  return rank}
async function cloudBoard(world){const rows=await sb('/rest/v1/idiom_n4_scores?world=eq.'+world+'&select=name,score,secs&order=score.desc,secs.asc&limit=30')||[];
  return rows.map(r=>({n:r.name,v:r.score,t:r.secs}))}

    const wrap=el('div',{class:'opts'});const sel=new Set();let done=false;

      Object.entries(btns).forEach(([k,b])=>{k=+k;b.disabled=true;b.style.opacity=1;b.classList.remove('sel');if(good.has(k))b.classList.add('ok');else if(sel.has(k))b.classList.add('bad')});
      sfx(ok);if(onAnswer)onAnswer(ok);
      box.append(el('div',{class:'fb '+(ok?'ok':'bad')},(ok?'答對了！':'差一點！')+(explain?' '+explain:'')));
      const nx=el('button',{onclick:()=>{box.remove();res(ok)}},'下一步 →');
      if(okBtn)okBtn.remove();
      box.append(el('div',{class:'ctrl'},nx));nx.focus({preventScroll:true});
    }
    order.forEach(i=>{const b=el('button',{onclick:()=>{if(done)return;if(multi){sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel')}else{sel.add(i);judge()}}},(multi?'□ ':'')+opts[i]);btns[i]=b;wrap.append(b)});
    box.append(wrap);
    let okBtn=null;
    if(multi){box.insertBefore(el('div',{class:'small'},'可以選很多個，選好按「確定」'),wrap);okBtn=el('button',{onclick:()=>{if(!sel.size)return;judge()}},'確定');box.append(okBtn)}
    parent.append(box);
    box.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}
function waitBtn(parent,label,cls=''){return new Promise(r=>{const b=el('button',{class:'big '+cls,onclick:()=>{b.remove();r()}},label);parent.append(b)})}

/* ================= 世界 1：成語配對 ================= */
/* 意思很接近的成語，不放在同一組，免得配對時兩個都說得通 */
const CLOSE=[['脫胎換骨','物換星移'],['獲益匪淺','融會貫通'],['前功盡棄','煙消雲散'],['登峰造極','融會貫通'],['大獲全勝','樂不可支']];
function pickSets(n){for(let t=0;t<300;t++){const p=shuffle(ID);const sets=[];for(let r=0;r<n;r++)sets.push(p.slice(r*4,r*4+4));
  if(sets.every(g=>!CLOSE.some(([a,b])=>g.some(x=>x.w===a)&&g.some(x=>x.w===b))))return sets}
  const p=shuffle(ID);return [0,1,2].slice(0,n).map(r=>p.slice(r*4,r*4+4))}
async function matchWorld(ctx){
  const S=ctx.stage;const pool=pickSets(3);const ROUNDS=3;let max=0;
  for(let r=0;r<ROUNDS;r++){
    if(!ctx.alive())return max;
    const set=pool[r];max+=set.length*10;
    S.innerHTML='';
    S.append(el('div',{class:'tag'},'第 '+(r+1)+' / '+ROUNDS+' 組　先點一個成語，再點它的意思（反過來也可以）。一次就配對成功得 10 分。'));
    const fb=el('div',{class:'fb',style:'display:none'});
    const L=el('div',{class:'opts'}),R=el('div',{class:'opts'});
    S.append(el('div',{class:'pair'},L,R),fb);
    let pick=null;const miss={};let done=0;
    const btn={};
    await new Promise(res=>{
      function tap(kind,w,b){
        if(b.disabled)return;
        if(!pick||pick.kind===kind){if(pick)pick.b.classList.remove('sel');pick={kind,w,b};b.classList.add('sel');return}
        const a=pick;pick=null;a.b.classList.remove('sel');
        const idiom=kind==='w'?w:a.w, meanW=kind==='m'?w:a.w;
        const bi=btn['w'+idiom],bm=btn['m'+meanW];
        if(idiom===meanW){
          sfx(true);[bi,bm].forEach(x=>{x.classList.add('ok');x.disabled=true;x.style.opacity=1});
          const pts=miss[idiom]?5:10;ctx.add(pts);done++;ctx.prog(r*4+done,ROUNDS*4);
          fb.style.display='';fb.className='fb ok';fb.innerHTML='配對成功！<b>'+idiom+'</b>：'+byW(idiom).m+(pts<10?'（試了第二次，得 5 分）':'');
          if(done===set.length)setTimeout(res,500);
        }else{
          sfx(false);miss[idiom]=1;
          [bi,bm].forEach(x=>{x.classList.add('bad','shake');setTimeout(()=>x.classList.remove('bad','shake'),600)});
          fb.style.display='';fb.className='fb bad';fb.innerHTML='不對喔！「'+idiom+'」的意思是「'+meanOf(idiom)+'」；你選的那句解釋是在說「'+meanW+'」。再找找看。';
        }
      }
      set.forEach(x=>{const b=el('button',{onclick:()=>tap('w',x.w,b)},x.w);b.style.fontSize='20px';btn['w'+x.w]=b;L.append(b)});
      shuffle(set).forEach(x=>{const b=el('button',{onclick:()=>tap('m',x.w,b)},x.m);b.style.fontSize='16px';b.style.lineHeight='1.4';btn['m'+x.w]=b;R.append(b)});
    });
    if(!ctx.alive())return max;
    /* 課本造句複習 */
    S.innerHTML='';

    await waitBtn(S,r<ROUNDS-1?'下一組 →':'看成績 →');
  }
  return max;
}

/* ================= 世界 3：錯字小偵探 ================= */
async function fixWorld(ctx){
  const S=ctx.stage;const list=shuffle(ID).slice(0,8);let max=0;
  for(let k=0;k<list.length;k++){
    if(!ctx.alive())return max;
    const it=list[k];max+=15;
    const [wi,bad]=it.wrong;
    const start=it.s.indexOf(it.w);const errAt=start+wi;
    const chars=[...it.s];chars[errAt]=bad;
    S.innerHTML='';
    S.append(el('div',{class:'tag'},'第 '+(k+1)+' / '+list.length+' 題　這句話有一個錯字，點出來！（找對 10 分，改對再加 5 分）'));
    const sent=el('div',{class:'sent'});S.append(sent);
    const box=el('div',{style:'display:flex;flex-direction:column;gap:10px'});S.append(box);
    const btns=[];
    const found=await new Promise(res=>{
      chars.forEach((c,i)=>{
        if(/[，。、！？「」：；]/.test(c)){sent.append(c);return}
        const b=el('button',{onclick:()=>{btns.forEach(x=>x.disabled=true);res(i===errAt?true:i)}},c);btns.push(b);b._i=i;sent.append(b);
      });
    });
    btns.forEach(b=>{b.style.opacity=1;if(b._i===errAt)b.classList.add(found===true?'ok':'hint')});
    if(found===true){sfx(true);ctx.add(10);box.append(el('div',{class:'fb ok'},'抓到了！「'+bad+'」寫錯了。'))}
    else{sfx(false);btns.find(b=>b._i===found).classList.add('bad');
      box.append(el('div',{class:'fb bad',html:'「'+chars[found]+'」沒有錯喔。錯字是黃色的「<b>'+bad+'</b>」，它在成語「'+it.w+'」裡面。'}))}
    const fix=shuffle(it.fix);const right=fix.indexOf(it.w[wi]);
    const ok=await ask(box,{tag:'改改看',q:'「'+bad+'」應該改成哪個字？',opts:fix,ans:right,explain:'正確寫法是「'+it.w+'」。'+it.why+'意思：'+it.m});
    if(ok)ctx.add(5);
    ctx.prog(k+1,list.length);
  }
  return max;
}

        area.append(el('div',{class:'draft',html:'你想說：'+L.ask.replace('＿＿','<span style="color:var(--sea)">＿＿＿＿</span>')}));
        const wrap=el('div',{class:'opts'});area.append(wrap);
        const pick=await new Promise(res=>left.forEach(w=>{const b=el('button',{onclick:()=>res(w)},w);b.style.fontSize='20px';wrap.append(b)}));
        area.innerHTML='';tries++;
        if(pick===L.a){
          sfx(true);const pts=tries===1?10:5;ctx.add(pts);
          say('me',fill(pick));
          if(pts<10)say('n','✓ 這次用對了！「'+L.a+'」就是「'+meanOf(L.a)+'」。');
          await wait(500);
          break;
        }
        sfx(false);
        const bub=say('me',fill(pick));bub.classList.add('wrongmsg');
        await typing();
        say('f','咦？「'+pick+'」是「'+meanOf(pick)+'」的意思耶，用在這裡怪怪的……');
        left=left.filter(w=>w!==pick);
        if(tries>=2){
          await wait(300);say('n','這裡在說「'+L.why+'」，要用「'+L.a+'」。你改口說：');await wait(500);say('me',fill(L.a));
          await wait(1200);
          break;
        }
        await wait(300);
      }
      ctx.prog(++step,TOTAL);area.innerHTML='';
    }
    if(!ctx.alive())return max;
    await wait(300);
    area.append(el('div',{class:'small'},'這段對話用到的成語：'+st.lines.filter(x=>x.a).map(x=>x.a).join('、')));
    await waitBtn(area,k<list.length-1?'下一個故事 →':'看成績 →');
  }
  return max;
}

home();
if(REMOTE&&DB.current)pullMine().then(()=>{if(!CUR)home()});
})();
