<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<a class="bz-back" href="../index.html" style="display:block;padding:10px max(16px,env(safe-area-inset-left,0px));font:600 14px/1.4 'PingFang TC','Noto Sans TC',sans-serif;color:#24302B;background:#EEF0E8;border-bottom:1px solid #C9D0C4;text-decoration:none;letter-spacing:.06em">← 回遊戲書房</a>
<title>邏輯偵探大挑戰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：偵探紫，四個世界卡片；遊戲畫面上方操作區、下方題目卡 */
:root{
  --sky:#F0EDF8; --paper:#FFFFFF; --ink:#1B2140; --soft:#5D6788;
  --sea:#6A4BC4; --sea-l:#DCD3F5; --leaf:#2F9E5F; --sun:#F2AE2E; --coral:#D9443A;
  --line:#DDD6EE; --air:#F7F5FC;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font-family:var(--display);font-size:18px;cursor:pointer;border:0;border-radius:14px;padding:10px 18px;background:var(--sea);color:#fff;box-shadow:0 3px 0 #4A3290;transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #4A3290}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.ghost{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
button.warn{background:var(--coral);box-shadow:0 3px 0 #9E3727}
button:disabled{opacity:.45;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-size:28px;color:var(--sea)}
.chip{font-family:var(--display);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:16px}
.panel{background:var(--paper);border-radius:20px;padding:18px;border:2px solid var(--line)}
.hero{display:block}
.hero>*,.world>*,.stage>*,.gamehead>*{min-width:0}
.hero p{margin:4px 0 0;color:var(--soft)}
.namerow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.namerow input{flex:1 1 200px;width:100%;min-width:0;font-size:18px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);font-family:var(--body)}
.players{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.players button{font-size:15px;padding:4px 12px;box-shadow:none;background:var(--sky);color:var(--ink)}
.players button.on{background:var(--sun);color:var(--ink)}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.worlds{grid-template-columns:1fr}.namerow button{flex:1 1 100%}.logo h1{font-size:24px}.world{grid-template-columns:56px 1fr}.world .ico{width:56px;height:56px}.world .ico svg{width:44px;height:44px}}
.world{position:relative;text-align:left;background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.world .ico{width:72px;height:72px;border-radius:16px;display:grid;place-items:center}
.world h3{font-size:21px}
.world .sub{font-family:var(--body);font-size:14px;color:var(--soft);line-height:1.4}
.world .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:15px}
.stars{color:var(--sun);letter-spacing:2px}
.stars .off{color:var(--line)}
.world.locked{opacity:.55}
.world .lock{font-family:var(--body);font-size:14px;color:var(--coral)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.gamehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gamehead h2{font-size:24px;flex:1 1 auto}
.score{font-family:var(--display);font-size:20px;color:var(--sea);font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);width:0;transition:width .3s}
.stage{background:var(--paper);border-radius:20px;border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.stage svg{width:100%;height:auto;max-height:360px;display:block}
.tag{font-family:var(--display);color:var(--soft);font-size:15px}
.q{font-family:var(--display);font-size:21px;line-height:1.6;white-space:pre-line}
.opts{display:grid;gap:8px}
.opts button{background:var(--sky);color:var(--ink);box-shadow:0 3px 0 var(--line);text-align:left;font-size:18px}
.opts button.sel{background:var(--sun)}
.opts button.ok{background:var(--leaf);color:#fff;box-shadow:0 3px 0 #1E6B40}
.opts button.bad{background:var(--coral);color:#fff;box-shadow:0 3px 0 #9E3727}
.fb{border-radius:14px;padding:10px 14px;font-size:16px}
.fb.ok{background:#E3F5EA;color:#1E6B40}
.fb.bad{background:#FCE8E4;color:#9E3727}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sent{font-family:var(--display);font-size:22px;line-height:2.1}
.sent button{font-size:22px;padding:2px 8px;margin:2px;background:var(--sky);color:var(--ink);box-shadow:0 2px 0 var(--line);border-radius:10px}
.sent button.ok{background:var(--leaf);color:#fff}
.sent button.bad{background:var(--coral);color:#fff}
.sent button.hint{background:var(--sun)}
.meter{position:relative;height:22px;border-radius:99px;background:linear-gradient(90deg,#D7EEF8,#7CC6E6,#1C8DB7);border:2px solid var(--line);overflow:hidden;flex:1 1 200px}
.meter i{position:absolute;top:0;bottom:0;width:6px;background:var(--ink);border-radius:3px;left:0}
.big{font-size:22px;padding:14px 26px}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result .bigstars{font-size:56px;color:var(--sun);letter-spacing:6px}
.result .bigstars .off{color:var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-size:15px;padding:6px 12px;background:var(--sky);color:var(--ink);box-shadow:none}
.tabs button.on{background:var(--sea);color:#fff}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--display);font-weight:400;color:var(--soft)}
td.n{text-align:right;font-family:var(--display);font-size:19px}
tr.me td{background:#FFF5DD}
.card{border:3px dashed var(--sea);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--air)}
.card .code{font-family:var(--display);font-size:26px;letter-spacing:4px;color:var(--sea)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.small{font-size:14px;color:var(--soft)}
.foot{text-align:center;color:var(--soft);font-size:14px;padding-block:24px 8px}
.sdk{display:grid;grid-template-columns:repeat(6,1fr);border:3px solid var(--ink);border-radius:10px;overflow:hidden;max-width:440px;width:100%;margin:0 auto}
.sdk button{aspect-ratio:1;border-radius:0;box-shadow:none;background:#fff;color:var(--sea);font-size:28px;padding:0;border:1px solid var(--line);min-height:48px}
.sdk button:active{transform:none}
.sdk button.g{color:var(--ink);background:var(--air);font-weight:700}
.sdk button.rc{background:#F1ECFB}
.sdk button.cur{background:#FFE9B0}
.sdk button.err{color:var(--coral);background:#FCE8E4}
.sdk .br{border-right:3px solid var(--ink)}
.sdk .bb{border-bottom:3px solid var(--ink)}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:440px;width:100%;margin:0 auto}
.pad button{font-size:26px;padding:10px 0;min-height:52px}
.clues{margin:0;padding-left:26px;font-size:18px;line-height:1.8}
.clues li{cursor:pointer}
.clues li.used{text-decoration:line-through;color:var(--soft)}
table.lg{max-width:520px;margin:0 auto}
table.lg th,table.lg td{text-align:center;padding:3px;border:0}
table.lg th{font-size:16px;color:var(--ink)}
table.lg button{width:100%;min-height:54px;font-size:26px;background:#fff;color:var(--ink);box-shadow:none;border:2px solid var(--line);padding:0;border-radius:10px}
table.lg button.x{color:#A9A3BC;background:var(--air)}
table.lg button.v{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.slots{display:flex;gap:10px;justify-content:center}
.slots span{width:62px;height:72px;border:3px solid var(--sea);border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:38px;background:#fff}
.pad10{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:440px;width:100%;margin:0 auto}
.pad10 button{font-size:26px;padding:10px 0;min-height:52px}
.hist{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:20px}
.hist div{display:flex;justify-content:space-between;background:var(--air);border-radius:10px;padding:4px 14px;font-variant-numeric:tabular-nums}
.marks{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.marks button{min-width:48px;min-height:48px;font-size:20px;padding:4px 8px;background:#fff;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.marks button.x{text-decoration:line-through;color:#B5AFC6;background:var(--air)}
.marks button.y{background:var(--leaf);color:#fff;border-color:var(--leaf)}

/* 童趣版：卡通粗描邊、糖果色、圓點底 */
:root{--sky:#FFF4D6;--ink:#2B2350;--soft:#6B6390;--sea:#3A8DF5;--leaf:#2DBE7E;--sun:#FFC93C;--coral:#FF5E6C;--line:#2B2350;--air:#F2F8FF}
html,body{background:#FFF4D6 radial-gradient(circle,#FFE29A 3px,transparent 3.5px) 0 0/28px 28px}
button{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:18px}
button:active{box-shadow:0 1px 0 var(--ink)}
button.ghost{background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
button.warn{box-shadow:0 4px 0 var(--ink)}
.panel,.stage{border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink)}
.chip{border:3px solid var(--ink);background:var(--sun)}
.logo h1{font-size:32px;letter-spacing:1px;-webkit-text-stroke:1px var(--ink)}
.logo h1 span:nth-child(5n+1){color:#FF7AA8}.logo h1 span:nth-child(5n+2){color:#FF9F43}.logo h1 span:nth-child(5n+3){color:#2DBE7E}.logo h1 span:nth-child(5n+4){color:#3A8DF5}.logo h1 span:nth-child(5n){color:#9B7BFF}
.hero{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;align-items:center}
.hero h2{color:var(--coral)}
.say{display:inline-block;background:#DDF3FF;border:3px solid var(--ink);border-radius:18px;padding:6px 14px;font-family:var(--display);margin-top:6px;position:relative}
.mascot{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.world{border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:26px;transition:transform .15s}
.world:nth-child(1){background:#FFE1EC}.world:nth-child(2){background:#DDF3FF}.world:nth-child(3){background:#DDF7E9}.world:nth-child(4){background:#FFF0C2}
.world:not(.locked):hover{transform:translateY(-3px) rotate(-1deg)}
.world .ico{background:#fff!important;border:3px solid var(--ink);border-radius:20px}
.world .sub{color:#4A4270}
.world.locked{opacity:.65;filter:grayscale(.7)}
.stars{color:var(--sun);-webkit-text-stroke:1px var(--ink)}
.stars .off,.result .bigstars .off{color:#fff}
.result .bigstars{-webkit-text-stroke:2px var(--ink)}
.result .mascot{width:120px}
.bar{height:18px;border:3px solid var(--ink);background:#fff}
.bar i{background:repeating-linear-gradient(45deg,#2DBE7E 0 10px,#5FDCA2 10px 20px)}
.gamehead h2{color:var(--coral)}
.tag{color:var(--ink);font-size:16px}
.namerow input{border:3px solid var(--ink)}
.players button{border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);background:#fff}
.opts button{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.opts button:nth-child(4n+1){background:#FFE1EC}.opts button:nth-child(4n+2){background:#DDF3FF}.opts button:nth-child(4n+3){background:#DDF7E9}.opts button:nth-child(4n){background:#FFF0C2}
.opts button.ok{background:var(--leaf)!important;color:#fff}
.opts button.bad{background:var(--coral)!important;color:#fff}
.fb{border:3px solid var(--ink);font-size:17px;animation:pop .35s}
.fb.ok{background:#D7F7E7;color:#145C3B}.fb.bad{background:#FFE0E3;color:#A3202E}
@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.03)}100%{transform:scale(1)}}
td,th{border-bottom:2px dotted #DCD3F0}
.tabs button{border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);background:#fff}
.card{border:3px dashed var(--ink);background:#fff}
.sdk{border:4px solid var(--ink);border-radius:18px}
.sdk button{border:1px solid #CFC7E6;box-shadow:none;border-radius:0;color:#3A8DF5}
.sdk button.g{background:#FFF6DA;color:var(--ink)}
.sdk button.rc{background:#EAF6FF}
.sdk .br{border-right:4px solid var(--ink)}.sdk .bb{border-bottom:4px solid var(--ink)}
.pad button:nth-child(6n+1),.pad10 button:nth-child(5n+1){background:#FF7AA8}
.pad button:nth-child(6n+2),.pad10 button:nth-child(5n+2){background:#FF9F43}
.pad button:nth-child(6n+3),.pad10 button:nth-child(5n+3){background:#FFC93C;color:var(--ink)}
.pad button:nth-child(6n+4),.pad10 button:nth-child(5n+4){background:#2DBE7E}
.pad button:nth-child(6n+5),.pad10 button:nth-child(5n){background:#3A8DF5}
.pad button:nth-child(6n){background:#9B7BFF}
.clues{padding-left:0;list-style:none;counter-reset:c}
.clues li{counter-increment:c;background:#fff;border:2px dashed #BFB5DD;border-radius:14px;padding:6px 12px;margin-bottom:6px}
.clues li::before{content:counter(c);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);margin-right:8px;font-family:var(--display);font-size:16px}
table.lg button{border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
table.lg button.x{background:#F1EEF8;color:#A9A3BC}
table.lg button.v{border-color:var(--ink)}
.slots span{border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.hist div{border:2px solid var(--ink);background:#fff}
.marks button{border:3px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
.marks button.y{border-color:var(--ink)}
@media (max-width:520px){.hero{grid-template-columns:84px minmax(0,1fr)}.logo h1{font-size:26px}}

.ctwrap{display:flex;flex-direction:column;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px;animation:pop .35s}
table.ct{border-collapse:separate;border-spacing:4px;width:100%;font-size:16px}
table.ct th{text-align:center;font-size:14px;color:var(--ink);border:0;padding:4px;background:#FFF0C2;border-radius:8px}
table.ct td{text-align:center;border:0;padding:6px 4px;border-radius:8px;background:#F4F1FA;white-space:pre-line;font-family:var(--display)}
table.ct td.t{background:#D7F7E7;color:#145C3B}
table.ct td.f{background:#FFE0E3;color:#A3202E}
table.ct tr.good td{box-shadow:inset 0 0 0 3px var(--sun);font-weight:700}
table.ct tr.good td:first-child{background:var(--sun);color:var(--ink)}

.lno{font-family:var(--display);font-size:38px;color:var(--coral);line-height:1}

.solve{display:flex;flex-direction:column;gap:12px}
.numbox{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;max-width:440px;width:100%;margin:0 auto}
.ansrow{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--display);font-size:18px}
.ansv{min-width:110px;text-align:center;font-size:34px;border-bottom:4px solid var(--sea);padding:0 8px;color:var(--sea)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp button{font-size:24px;padding:8px 0;min-height:50px}
.hints{display:flex;flex-direction:column;gap:6px}
.hint{background:#FFF0C2;border:2px dashed var(--ink);border-radius:14px;padding:8px 12px;font-size:17px}
.teach{background:#FFE1EC;border:3px solid var(--ink);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 var(--ink);animation:pop .35s}
.teach-h{font-family:var(--display);font-size:22px;color:var(--coral)}
button.hold{position:relative;overflow:hidden;background:var(--ink);color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
button.hold span{position:relative;z-index:1}
button.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--leaf)}
.dots{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-end;text-align:center}
.chain{display:flex;align-items:center;gap:6px;justify-content:center;padding:6px 0;min-width:max-content}
.chain .op{font-family:var(--display);font-size:17px;color:var(--soft);white-space:nowrap}
.cell{display:inline-grid;place-items:center;min-width:58px;height:54px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-family:var(--display);font-size:24px}
table.back td.cell{display:table-cell;height:48px;border-radius:10px}
.cell.active{background:#FFE9B0;box-shadow:0 0 0 4px var(--sun)}
.cell.ok{background:#D7F7E7;color:#145C3B}
.cell.rev{background:#FFE0E3;color:#A3202E}
.wellwrap{display:flex;gap:12px;align-items:stretch}
.well{position:relative;width:46px;min-height:220px;border:3px solid var(--ink);border-top:0;border-radius:0 0 12px 12px;background:linear-gradient(#DDF3FF,#9FB8D9)}
.well .mark{position:absolute;left:50%;width:26px;height:26px;margin-left:-13px;margin-bottom:-2px;border-radius:50% 50% 40% 40%;background:#FF9F43;border:2px solid var(--ink);transition:bottom .5s}
.track{display:flex;flex-wrap:wrap;gap:5px}
.track span{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:#fff;font-family:var(--display);font-size:17px}
.track span.k{background:var(--sea);color:#fff}.track span.c{background:#FF7AA8;color:#fff}
.coins{display:flex;flex-wrap:wrap;gap:6px;min-height:46px}
.coins span{width:40px;height:40px;border-radius:50%;background:#FFC93C;border:3px solid var(--ink);box-shadow:inset 0 -4px 0 #E7A82A}
.wl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wlc{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px;text-align:center;font-family:var(--display);display:flex;flex-direction:column;gap:4px;opacity:.55}
.wlc b{font-size:22px;min-height:28px}
.wlc .row{justify-content:center;gap:4px}.wlc button{padding:6px 10px;min-height:44px;font-size:17px}
.wlc.active{opacity:1;background:#FFE9B0;box-shadow:0 0 0 4px var(--sun)}
.wlc.win,.wlc.lose{opacity:1}.wlc.win b{color:#145C3B}.wlc.lose b{color:#A3202E}.wlc.rev{background:#FFE0E3}
table.rep{font-size:14px}table.rep td{font-family:inherit}
@media (max-width:520px){.wl{grid-template-columns:repeat(2,minmax(0,1fr))}.cell{min-width:46px}}

</style>

<script>
(()=>{
/* ---------- 工具 ---------- */
const app=document.getElementById('app');

/* 解說表格：每一種假設排成一列，真＝綠、假＝紅，符合的那一列用黃色標出來 */
function caseTable(head,rows,good,legend){
  const t=el('table',{class:'ct'});
  t.append(el('tr',{},head.map(h=>el('th',{},h))));
  rows.forEach((r,i)=>t.append(el('tr',{class:i===good?'good':''},r.map(c=>typeof c==='string'?el('td',{},c):el('td',{class:c.c},c.t)))));
  return el('div',{class:'ctwrap'},el('div',{class:'small'},legend),el('div',{style:'overflow-x:auto'},t));
}
/* 犯人題：假設是誰，看每個人的話是真是假，數一數 */
function culpritTable(names,says,want,count){
  return ()=>{let good=-1;const rows=names.map((x,i)=>{const v=says.map(f=>f(x));const n=v.filter(b=>b===(count==='真')).length;const hit=n===want;if(hit)good=i;
    return ['如果是 '+x,...v.map(b=>b?{t:'真',c:'t'}:{t:'假',c:'f'}),{t:(count==='真'?'說真話 ':'說謊 ')+n+' 人'+(hit?' ✓':''),c:hit?'t':''}]});
    return caseTable(['假設',...names.map(n=>n+' 說的話'),'結果'],rows,good,'把每個人都假設一次：他是犯人的話，每句話是「真」還是「假」？題目說'+(count==='真'?'說真話':'說謊')+'的只有 '+want+' 人，找那一列。')}
}
/* 誠實島：假設每個人是哪一種，誠實的人的話要是真、說謊的人的話要是假 */
function isleTable(people,says){
  return ()=>{const n=people.length;let good=-1;const rows=[];
    for(let m=(1<<n)-1;m>=0;m--){const h=people.map((_,i)=>!!(m&(1<<(n-1-i))));let all=true;
      const cells=says.map(s=>{const tr=s.f(h),fit=tr===h[s.who];if(!fit)all=false;return {t:(tr?'真':'假')+(fit?' ✓':' ✗'),c:fit?'t':'f'}});
      if(all)good=rows.length;
      rows.push([people.map((p,i)=>p+(h[i]?'😊誠實':'🤥說謊')).join('\n'),...cells,{t:all?'成立 ✓':'矛盾',c:all?'t':'f'}])}
    return caseTable(['假設',...says.map(s=>people[s.who]+' 說的話'),'結果'],rows,good,'誠實的人說的話一定是「真」，說謊的人說的話一定是「假」。對得上打 ✓，對不上打 ✗（矛盾）。全部 ✓ 的那一列就是答案。')}
}

    const drawMarks=()=>{markRow.innerHTML='';markRow.append(el('span',{class:'tag'},'筆記'));for(let d=0;d<10;d++){const b=el('button',{class:['','x','y'][marks[d]],'aria-label':'數字 '+d+' 記號',onclick:()=>{marks[d]=(marks[d]+1)%3;drawMarks()}},String(d));markRow.append(b)}};
    const drawHist=()=>{histEl.innerHTML='';hist.forEach((h,i)=>histEl.prepend(el('div',{},el('span',{},'第 '+(i+1)+' 次　'+h.g.join(' ')),el('b',{},h.a+'A'+h.b+'B'))))};
    for(let d=1;d<=10;d++){const v=d%10;const b=el('button',{onclick:()=>{if(inp.length<D&&!inp.includes(v)){inp.push(v);drawSlots()}}},String(v));keys[v]=b;pad.append(b)}
    const delB=el('button',{class:'ghost',onclick:()=>{inp.pop();drawSlots()}},'⌫ 刪除');
    const subB=el('button',{},'送出');
    const giveB=el('button',{class:'ghost'},'放棄這局');
    S.append(slots,pad,el('div',{class:'ctrl',style:'justify-content:center'},delB,subB,giveB),fb,markRow,el('div',{class:'small'},'點筆記的數字做記號：一次 ✗（不可能）、兩次 ●（一定有）。猜到 0A0B 時，那三個數字全都可以打 ✗！'),histEl);
    drawMarks();
    await new Promise(res=>{
      subB.onclick=()=>{if(over||inp.length<D)return;let a=0,b=0;inp.forEach((d,i)=>{if(secret[i]===d)a++;else if(secret.includes(d))b++});
        hist.push({g:inp.slice(),a,b});inp=[];drawHist();
        if(a===D){over=true;const p=abScore(hist.length);ctx.add(p);sfx(true);fb.className='fb ok';fb.textContent='破解成功！密碼是 '+secret.join('')+'，你猜了 '+hist.length+' 次，得到 '+p+' 分。';drawSlots();res();return}
        sfx(a+b>0);fb.className='small';fb.textContent=a+'A'+b+'B。'+(a+b===0?'這幾個數字都不在密碼裡，記得打 ✗！':a+b===D?'數字都對了，只差位置！':'想想看哪些數字可以刪掉。');drawSlots()};
      giveB.onclick=()=>{if(over)return;over=true;sfx(false);fb.className='fb bad';fb.textContent='密碼是 '+secret.join('')+'。下一局試試：先猜 012、345、678，看哪些數字在密碼裡。';drawSlots();res()};
      drawSlots();
    });
    if(!ctx.alive())return max;
    giveB.disabled=true;ctx.prog(ri+1,ROUNDS);
    const nx=el('div');S.append(nx);await waitBtn(nx,ri<ROUNDS-1?'下一局 →':'完成 →');
  }
  return max;
}

/* ================= 思考引擎（第 2 堂起共用） =================
   原則：先自己算 → 提示用反問、用了扣分 → 答對要選理由 → 換數字再一題 → 關鍵題說給老師聽 → 全部記錄 */
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function logRec(ctx,rec){const p=player();if(!p)return;p.log=p.log||[];
  p.log.push(Object.assign({L:LESSONS[CURL].id,w:ctx.wi,at:Date.now()},rec));if(p.log.length>400)p.log.splice(0,p.log.length-400);save()}

/* 數字鍵盤輸入 */
function numBox(label,unit){
  let v='';const disp=el('span',{class:'ansv'},'？');
  const set=s=>{v=s;disp.textContent=v===''?'？':v};
  const keys=[1,2,3,4,5,6,7,8,9,'⌫',0,'清除'].map(k=>el('button',{class:typeof k==='number'?'':'ghost',onclick:()=>{
    if(k==='⌫')set(v.slice(0,-1));else if(k==='清除')set('');else if(v.length<5)set(v==='0'?String(k):v+k)}},String(k)));
  const node=el('div',{class:'numbox'},el('div',{class:'ansrow'},el('span',{},label),disp,unit?el('span',{},unit):null),el('div',{class:'kp'},keys));
  return{node,get:()=>v===''?null:Number(v),clear:()=>set(''),lock(){keys.forEach(b=>b.disabled=true)},unlock(){keys.forEach(b=>b.disabled=false)}};
}

/* 說給老師聽：老師按住 2 秒才通過 */
function teacherCheck(parent,prompt){return new Promise(res=>{
  const fill=el('i');const btn=el('button',{class:'hold'},el('span',{},'老師按住 2 秒：通過'),fill);let t=null;
  const box=el('div',{class:'teach'},el('div',{class:'teach-h'},'🗣 說給老師聽'),el('div',{class:'q'},prompt),
    el('div',{class:'small'},'用自己的話說清楚，說完請老師按住下面的按鈕。'),btn);
  btn.addEventListener('pointerdown',e=>{e.preventDefault();fill.style.transition='width 2s linear';fill.style.width='100%';
    t=setTimeout(()=>{btn.disabled=true;btn.firstChild.textContent='老師說：通過！';sfx(true);res(true)},2000)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>{if(btn.disabled)return;clearTimeout(t);fill.style.transition='none';fill.style.width='0'}));
  parent.append(box);setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'center'}),50);
})}

/* 理由題：opts[0] 是正確的，顯示時會打亂 */
function askReason(box,R){const o=shuffle(R.opts.map((t,i)=>({t,i})));
  return ask(box,{tag:'你是怎麼知道的？',q:R.q||'哪一句最能說明你的想法？',opts:o.map(x=>x.t),ans:o.findIndex(x=>x.i===0),explain:R.why||''})}

/* 一題完整流程。item：{tag,q,qNode,ans,unit,hints,traps,explain,sim,reason,teacher,variant}
   主題滿分 10＝答案 6（錯一次 -2、提示一次 -1）＋理由 2＋變式題 2 */
async function solveItem(ctx,item,main=true){
  const S=ctx.stage;S.innerHTML='';const t0=Date.now();
  const box=el('div',{class:'solve'});S.append(box);
  box.append(el('div',{class:'tag'},item.tag),item.qNode?item.qNode():null,el('div',{class:'q'},item.q),
    main?el('div',{class:'small'},'✏️ 可以用計算紙，算好再輸入。'):null);
  const nb=numBox('你的答案',item.unit);box.append(nb.node);
  const fb=el('div');const hintBox=el('div',{class:'hints'});
  let tries=0,hints=0,solved=false;const maxTry=main?3:2;
  const sub=el('button',{},'送出答案');
  const hb=main&&item.hints&&item.hints.length?el('button',{class:'ghost'},'💡 提示（-1 分）'):null;
  box.append(el('div',{class:'ctrl'},sub,hb),hintBox,fb);
  if(hb)hb.onclick=()=>{if(hints>=item.hints.length)return;hintBox.append(el('div',{class:'hint'},'提示 '+(hints+1)+'：'+item.hints[hints]));hints++;if(hints>=item.hints.length)hb.disabled=true};
  await new Promise(res=>{sub.onclick=()=>{const v=nb.get();
    if(v==null){fb.className='fb bad';fb.textContent='先輸入你的答案。';return}
    if(v===item.ans){solved=true;sfx(true);fb.className='fb ok';fb.textContent='答對了！'+(item.explain?' '+item.explain:'');res();return}
    tries++;sfx(false);const trap=item.traps&&item.traps[v];
    if(tries>=maxTry){fb.className='fb bad';fb.textContent=(trap?trap+' ':'')+'正確答案是 '+item.ans+(item.unit||'')+'。'+(item.explain?' '+item.explain:'');res();return}
    fb.className='fb bad';fb.textContent=(trap||'不對喔，再檢查一次你的算法。')+'（還有 '+(maxTry-tries)+' 次機會）';nb.clear()}});
  sub.disabled=true;nb.lock();if(hb)hb.disabled=true;
  if(!ctx.alive())return 0;
  if(!main){const p=solved?(tries===0?2:1):0;ctx.add(p);return p}
  let pts=solved?Math.max(1,6-2*tries-hints):0;ctx.add(pts);
  return await afterSolve(ctx,box,item,{pts,tries,hints,solved,t0});
}
/* 答完之後：動手驗證 → 選理由 → 說給老師聽 → 變式題 → 記錄 */
async function afterSolve(ctx,box,item,st){
  let pts=st.pts;
  if(item.sim&&ctx.alive()){const sb=el('div');box.append(sb);await waitBtn(sb,'🔍 動手驗證看看');if(ctx.alive())await item.sim(sb)}
  let rOk=null;if(item.reason&&ctx.alive()){const rb=el('div');box.append(rb);rOk=await askReason(rb,item.reason);if(rOk){pts+=2;ctx.add(2)}}
  let tOk=null;if(item.teacher&&ctx.alive())tOk=await teacherCheck(box,item.teacher);
  let vOk=null;
  if(item.variant&&ctx.alive()){const nx=el('div');box.append(nx);await waitBtn(nx,'換個數字再一題 →');
    if(ctx.alive()){const v=item.variant();v.tag='換個數字再一題（不能用提示）';const vp=await solveItem(ctx,v,false);vOk=vp===2;pts+=vp}}
  logRec(ctx,{item:item.short||item.tag,wrong:st.tries,hints:st.hints,ok:st.solved,reason:rOk,variant:vOk,teacher:tOk,secs:Math.round((Date.now()-st.t0)/1000)});
  return pts;
}
/* 依序做完一串題目 */
async function itemsWorld(ctx,items){let max=0;
  for(let i=0;i<items.length;i++){if(!ctx.alive())return max;max+=10;
    await solveItem(ctx,items[i]);ctx.prog(i+1,items.length);
    if(ctx.alive()){const nx=el('div');ctx.stage.append(nx);await waitBtn(nx,i<items.length-1?'下一題 →':'完成 →')}}
  return max}

/* 依序填格子（倒推表格、倒推機器用）。每格錯 2 次就直接填上答案 */
function fillCells(cells,nb,btn,fb){return new Promise(res=>{let k=0,wrong=0,cw=0;
  const act=()=>cells.forEach((c,i)=>c.el.classList.toggle('active',i===k));act();
  const next=()=>{k++;cw=0;nb.clear();if(k>=cells.length){btn.disabled=true;act();res(wrong)}else act()};
  btn.onclick=()=>{const v=nb.get();if(v==null)return;const c=cells[k];
    if(v===c.ans){c.el.textContent=v;c.el.classList.add('ok');sfx(true);fb.className='small';fb.textContent=c.okMsg||'對！繼續往下一格。';next()}
    else{wrong++;cw++;sfx(false);
      if(cw>=2){c.el.textContent=c.ans;c.el.classList.add('rev');fb.className='fb bad';fb.textContent=(c.msg||'')+' 這格是 '+c.ans+'，看懂了再繼續。';next()}
      else{fb.className='fb bad';fb.textContent=c.msg||'再想想看。';nb.clear()}}};
})}

/* ============ 第 2 堂：順著推 ============ */
/* 數列偵探 */
const SEQGEN={
  add(){const a=rnd(2,9),d=rnd(3,12);const s=[0,1,2,3,4].map(i=>a+d*i);
    return{s,ans:a+d*5,ok:'每次都加 '+d,bad:['每次都乘 2','每次加的數越來越大'],traps:{}}},
  alt(){const a=rnd(5,9),b=rnd(2,a-2),x=rnd(3,15);const s=[x];for(let i=1;i<7;i++)s.push(s[i-1]+(i%2?a:-b));
    return{s:s.slice(0,6),ans:s[6],ok:'輪流「加 '+a+'」和「減 '+b+'」',bad:['每次都加 '+(a-b),'每次都加 '+a],traps:{[s[5]+a-b]:'看清楚：是一加一減輪流，不是每次加一樣多。'}}},
  mul(){const r=pick([2,3]),a=rnd(2,5);const s=[0,1,2,3].map(i=>a*r**i);
    return{s,ans:a*r**4,ok:'每次都乘 '+r,bad:['每次都加 '+(s[1]-s[0]),'每次都加 '+r],traps:{[s[3]+(s[3]-s[2])]:'相差的數不一樣喔，試試看是不是「乘」。'}}},
  grow(){const a=rnd(1,9),d=rnd(1,3);const s=[a];for(let i=1;i<6;i++)s.push(s[i-1]+d+i-1);const last=s[4]-s[3];
    return{s:s.slice(0,5),ans:s[5],ok:'相差的數每次多 1（差是 '+d+'、'+(d+1)+'、'+(d+2)+'…）',bad:['每次都加 '+d,'每次都乘 2'],traps:{[s[4]+last]:'相差的數有沒有每次變大？'}}},
  fib(){const a=rnd(1,4),b=rnd(a+1,a+4);const s=[a,b];for(let i=2;i<7;i++)s.push(s[i-1]+s[i-2]);
    return{s:s.slice(0,6),ans:s[6],ok:'每個數都是「前兩個數相加」',bad:['每次都乘 2','相差的數每次多 1'],traps:{[s[5]*2]:'不是乘 2 喔，看看前兩個數加起來是多少。'}}}
};
function seqItem(type,teacher){const g=SEQGEN[type]();
  return{tag:'數列偵探',short:'數列：'+g.ok,q:'找出規律，□ 裡應該填多少？\n'+g.s.join('、')+'、□',ans:g.ans,traps:g.traps,
    hints:['把相鄰兩個數相減，把差寫在兩數中間。','差有規律嗎？如果看不出來，試試看是不是「乘」，或是「前兩個數相加」。'],
    explain:'規律是：'+g.ok+'。',reason:{opts:[g.ok,...g.bad],why:'規律是：'+g.ok+'。'},
    teacher:teacher?'把你找到的規律說給老師聽：前一個數是怎麼變成下一個數的？':null,variant:()=>seqItem(type,false)}}
function dotsSVG(n,hl){const r=9,gap=22,W=n*gap+10,H=n*gap+6;let s='';
  for(let row=1;row<=n;row++)for(let i=0;i<row;i++){const x=W/2+(i-(row-1)/2)*gap,y=row*gap-6;s+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(hl&&row===n?'#FF7AA8':'#FFC93C')+'" stroke="#2B2350" stroke-width="2"/>'}
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+Math.min(W,240)+'">'+s+'</svg>'}
function triItem(teacher){const n=rnd(6,9);const ans=n*(n+1)/2;
  return{tag:'花片三角形',short:'三角形花片（底層 '+n+' 個）',
    qNode:()=>el('div',{class:'dots'},[2,3,4].map(k=>el('div',{},el('div',{html:dotsSVG(k)}),el('div',{class:'small'},'底層 '+k+' 個，共 '+(k*(k+1)/2)+' 個')))),
    q:'花片排成三角形。照這個規律，底層有 '+n+' 個時，總共有幾個花片？',unit:'個',ans,
    traps:{[n*n]:'那是排成正方形的數法喔。',[n*(n+1)]:'你是不是多算了一倍？',[n*3]:'每一層的個數不一樣多喔。'},
    hints:['底層 2 個時共 3 個，底層 3 個時共 6 個。多一層，多了幾個？','每多一層，就多加「這一層的個數」。1＋2＋3＋…一直加到 '+n+'。'],
    explain:'1＋2＋…＋'+n+'＝'+ans+'。',
    sim:box=>new Promise(r=>{let k=1;const pic=el('div',{class:'dots'});const t=el('div',{class:'small'});
      const show=()=>{pic.innerHTML=dotsSVG(k,true);t.textContent='底層 '+k+' 個：總共 '+(k*(k+1)/2)+' 個（這一層加了 '+k+' 個）'};show();
      const b=el('button',{onclick:()=>{if(k<n){k++;show()}if(k>=n){b.disabled=true;r()}}},'再加一層 →');box.append(pic,t,b)}),
    reason:{opts:['每多一層，就多加「這一層的個數」：1＋2＋3＋…','每多一層，就多加固定 3 個','底層個數乘以 2 就是總數'],why:'多一層就多加那一層的個數。'},
    teacher:teacher?'說給老師聽：底層多 1 個的時候，總數會多幾個？為什麼？':null,variant:()=>triItem(false)}}
async function seqWorld(ctx){const types=shuffle(['alt','mul','grow','fib']).slice(0,3);
  const items=[seqItem(types[0],false),seqItem(types[1],true),triItem(false),seqItem(types[2],false)];
  return itemsWorld(ctx,items)}

/* 空瓶換飲料 */
function bottleCalc(B,k){let drink=B,empty=B;const rows=[];while(empty>=k){const n=Math.floor(empty/k);drink+=n;empty=empty%k+n;rows.push([n,empty,drink])}return{drink,rows}}
function bottleItem(teacher){let k,p,B,c;do{k=pick([2,3]);p=pick([1,2,5]);B=rnd(k===2?6:8,k===2?13:20);c=bottleCalc(B,k)}while(c.rows.length<2);
  const M=B*p,one=B+Math.floor(B/k);const traps={};if(one!==c.drink)traps[one]='換來的飲料喝完，又變成空瓶，還可以再換喔！';if(B!==c.drink)traps[B]='別忘了空瓶可以換飲料。';
  return{tag:'空瓶換飲料',short:'空瓶換飲料（'+M+'元、'+k+'瓶換1）',
    q:'福利社一瓶飲料 '+p+' 元，'+k+' 個空瓶可以再換 1 瓶飲料（不能跟老闆借瓶子）。小安有 '+M+' 元，最多可以喝幾瓶？',unit:'瓶',ans:c.drink,traps,
    hints:['先算：一開始用錢可以買幾瓶？喝完有幾個空瓶？','每換一次，手上的空瓶＝「沒換掉的」＋「新喝完的」。用表格一輪一輪記下來。'],
    explain:'一開始買 '+B+' 瓶，再一輪一輪換，總共 '+c.drink+' 瓶。',
    sim:box=>new Promise(r=>{const tb=el('table',{class:'ct'});tb.append(el('tr',{},['','換到','喝完後手上空瓶','總共喝了'].map(h=>el('th',{},h))));
      tb.append(el('tr',{},el('td',{},'用錢買'),el('td',{},B+' 瓶'),el('td',{},B+' 個'),el('td',{},B+' 瓶')));let i=0;
      const b=el('button',{onclick:()=>{const[n,e,d]=c.rows[i];tb.append(el('tr',{},el('td',{},'第 '+(i+1)+' 次換'),el('td',{class:'t'},n+' 瓶'),el('td',{},e+' 個'),el('td',{},d+' 瓶')));i++;
        if(i>=c.rows.length){b.disabled=true;box.append(el('div',{class:'small'},'剩 '+c.rows[i-1][1]+' 個空瓶，不夠 '+k+' 個，換不了了。'));r()}}},'換一次 →');
      box.append(el('div',{style:'overflow-x:auto'},tb),b)}),
    reason:{opts:['一直把空瓶拿去換，換來的喝完又是空瓶，直到空瓶不夠換','用錢買的瓶數，加上空瓶換一次就好','空瓶數除以 '+k+' 就是答案'],why:'換來的飲料喝完也是空瓶，要一直換到不夠換為止。'},
    teacher:teacher?'說給老師聽：為什麼要換好幾次？最後剩下的空瓶為什麼不能再換？':null,variant:()=>bottleItem(false)}}
async function bottleWorld(ctx){return itemsWorld(ctx,[bottleItem(true),bottleItem(false),bottleItem(false)])}

/* 蝸牛爬井 */
const CLIMBERS=[{n:'蝸牛',w:'井',top:'井口'},{n:'青蛙',w:'深坑',top:'坑口'},{n:'小松鼠',w:'光滑的竹竿',top:'竿頂'}];
function climbDays(D,u,d){return D<=u?1:Math.ceil((D-u)/(u-d))+1}
function snailItem(teacher){let D,u,d,a;do{u=rnd(3,7);d=rnd(1,u-1);D=(u-d)*rnd(4,9);a=climbDays(D,u,d)}while(a<3||D/(u-d)===a||D>40);
  const C=pick(CLIMBERS);const traps={[D/(u-d)]:'你是不是用「全長 ÷ 每天淨爬的公尺」？最後一天白天爬到頂就出去了，不會再滑下來喔！'};
  if(!traps[a+1])traps[a+1]='再算一次，最後那天白天就已經到了。';
  return{tag:'爬出去要幾天',short:C.n+'爬'+D+'公尺（上'+u+'下'+d+'）',
    q:C.n+'在一個 '+D+' 公尺的'+C.w+'底部。牠每天白天往上爬 '+u+' 公尺，晚上睡覺時會滑下 '+d+' 公尺。請問牠在第幾天可以到達'+C.top+'？',unit:'天',ans:a,traps,
    hints:['每天「白天＋晚上」合起來，實際往上多少公尺？','最後一天白天要從多高的地方出發，才能一口氣到'+C.top+'？在那之前要花幾天？'],

const OPS={'+':[(x,a)=>x+a,(y,a)=>y-a,'減'],'−':[(x,a)=>x-a,(y,a)=>y+a,'加'],'×':[(x,a)=>x*a,(y,a)=>y/a,'除以'],'÷':[(x,a)=>x/a,(y,a)=>y*a,'乘以']};

  for(let i=0;i<3;i++){const t=pick(['+','−','×','÷']);const a=t==='×'?pick([2,3]):t==='÷'?2:rnd(2,9);const nv=OPS[t][0](v,a);
    if(nv<=0||nv!==Math.floor(nv)||nv>99){ok=false;break}ops.push([t,a]);v=nv;vals.push(v)}
  if(ok&&new Set(ops.map(o=>o[0])).size>=2)return{x,ops,vals}}}
function chainText(c){return c.ops.map(([t,a])=>({'+':'加 ','−':'減 ','×':'乘以 ','÷':'除以 '}[t])+a).join('，再')}

  const hb=el('button',{class:'ghost',onclick:()=>{if(hints<H.length){hintBox.append(el('div',{class:'hint'},'提示 '+(hints+1)+'：'+H[hints]));hints++}if(hints>=H.length)hb.disabled=true}},'💡 提示（-1 分）');

    reason:{opts:['從最後的結果開始，每一步做相反的計算，一步一步倒回去','從第一步開始照著題目算','把題目裡所有數字加起來再算'],why:'倒推要從最後開始，做相反的計算。'},
    teacher:teacher?'說給老師聽：為什麼「乘以 2」倒回去要「除以 2」？順序為什麼要從最後一步開始？':null,
    variant:()=>{const v=genChain();return{q:'一個數'+chainText(v)+'，結果是 '+v.vals[3]+'。原來的數是多少？',ans:v.x}}};

    st.append(el('div',{class:'tag'},label),el('div',{class:'q'},rule+'\n現在有 '+N+' 個硬幣，'+(kidFirst?'你先拿。':'電腦先拿。')));
    const pile=el('div',{class:'coins'});const msg=el('div',{class:'small'});const btns=el('div',{class:'ctrl'});
    const drawPile=()=>{pile.innerHTML='';for(let i=0;i<left;i++)pile.append(el('span',{}));msg.textContent=msg.textContent};
    const end=win=>{over=true;btns.innerHTML='';sfx(win);msg.className=win?'fb ok':'fb bad';msg.textContent=win?'電腦拿到最後一個硬幣，你贏了！':'你拿到最後一個硬幣，輸了。看看倒推表，你要讓電腦剩下幾個？';setTimeout(()=>res(win),300)};
    const comp=()=>{let mv=S.filter(s=>s<left&&!W[left-s]);let n=mv.length?mv[0]:Math.min(left,pick(S.filter(s=>s<left).length?S.filter(s=>s<left):[1]));
      if(left===1)n=1;left-=n;drawPile();if(left===0)return end(true);msg.className='small';msg.textContent='電腦拿了 '+n+' 個，剩 '+left+' 個。輪到你。';drawBtns()};
    const drawBtns=()=>{btns.innerHTML='';S.forEach(n=>{if(n<=left)btns.append(el('button',{onclick:()=>{if(over)return;left-=n;drawPile();if(left===0)return end(false);
      msg.className='small';msg.textContent='你拿了 '+n+' 個，剩 '+left+' 個。電腦想一下…';btns.innerHTML='';setTimeout(comp,700)}},'拿 '+n+' 個'))})};
    st.append(pile,btns,msg);drawPile();if(kidFirst){msg.textContent='輪到你。';drawBtns()}else{msg.textContent='電腦先拿…';setTimeout(comp,700)}});
  const mkN=()=>rnd(11,17);let won=false,g=0;
  while(g<3&&!won&&ctx.alive()){g++;won=await play(mkN(),'第 '+g+' 局（最多 3 局）');if(!won&&g<3&&ctx.alive()){const nx=el('div');st.append(nx);await waitBtn(nx,'再來一局 →')}}
  if(!ctx.alive())return 20;if(won)ctx.add([10,7,4][g-1]);ctx.prog(2,3);
  const b2=el('div');st.append(b2);const tOk=await teacherCheck(b2,'說給老師聽：你是怎麼用倒推表，決定每次要拿幾個的？');ctx.prog(3,3);
  logRec(ctx,{item:'拿硬幣（每次 '+S.join('、')+' 個）',wrong,hints:0,ok:won,reason:null,variant:null,teacher:tOk,secs:Math.round((Date.now()-t0)/1000)});
  const d=el('div');st.append(d);await waitBtn(d,'完成 →');
  return 20}

/* ---------- 密碼鎖：老師輸入密碼才能玩，這個分頁關掉前都記得（遊戲書房開過鎖也算） ---------- */
const LOCK_HASH='27b106acfc9f97d73952426627dcddb18f41babc443f3ad4edd73488d6b4c2a0';
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function lockOk(){try{return sessionStorage.getItem('bz_lock_ok')===LOCK_HASH}catch(e){return false}}
function start(){lessonPick()}
function lockScreen(){
  app.innerHTML='';
  const inp=el('input',{type:'password',inputmode:'numeric',placeholder:'老師密碼',autocomplete:'off',style:'text-align:center;letter-spacing:.3em;font-size:24px'});
  const msg=el('div',{class:'small',style:'color:var(--coral);min-height:1.5em;margin-top:6px'});
  const go=async()=>{let ok=false;try{ok=await sha(inp.value.trim())===LOCK_HASH}catch(e){}
    if(ok){try{sessionStorage.setItem('bz_lock_ok',LOCK_HASH)}catch(e){}start()}
    else{msg.textContent='密碼不對，請找老師幫忙開鎖。';inp.value='';inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);inp.focus()}};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  app.append(header(),el('div',{class:'panel hero'},el('div',{class:'mascot',html:OWL}),
    el('div',{},el('h2',{style:'font-size:22px'},'這個遊戲上鎖了'),el('div',{class:'say'},'請老師輸入密碼，咕咕才能開門！'),
      el('div',{class:'namerow'},inp,el('button',{onclick:go},'開鎖')),msg)));
  setTimeout(()=>inp.focus(),50);
}
useLesson(0);
lockOk()?start():lockScreen();
