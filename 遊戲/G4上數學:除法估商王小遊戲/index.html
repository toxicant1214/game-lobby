<script>
(()=>{
/* ---------- 工具 ---------- */
const app=document.getElementById('app');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.random()*a.length|0];
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
let actx=null;
function sfx(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);const t=actx.currentTime;o.type='triangle';if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.1)}else{o.frequency.setValueAtTime(220,t);o.frequency.setValueAtTime(160,t+.12)}g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}catch(e){}}
function shake(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
const NS='http://www.w3.org/2000/svg';
function svgEl(vb,inner,css=''){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',vb);s.innerHTML=inner;if(css)s.style.cssText=css;return s}

/* ---------- 除法引擎 ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const near10=d=>Math.round(d/10)*10;
const tens=d=>d%10===5?[d-5,d+5]:[near10(d)];
function steps(dd,dv){
  const D=String(dd).split('').map(Number),n=D.length,S=[];
  if(dd<dv){S.push({i:n-1,cur:dd,q:0,prod:0,r:dd,zf:true});return{D,n,S,q:0,r:dd}}
  let k=1;while(+D.slice(0,k).join('')<dv)k++;
  let cur=+D.slice(0,k).join('');
  for(let i=k-1;i<n;i++){const q=Math.floor(cur/dv),prod=q*dv,r=cur-prod;S.push({i,cur,q,prod,r});if(i<n-1)cur=r*10+D[i+1]}
  return{D,n,S,q:Math.floor(dd/dv),r:dd%dv};
}
const midZero=st=>st.S.some((s,j)=>j>0&&s.q===0);
function gen(minDD,maxDD,minDV,maxDV,ok=()=>true,tries=4000){
  for(let t=0;t<tries;t++){const dd=ri(minDD,maxDD),dv=ri(minDV,maxDV);if(dv%10===0)continue;const st=steps(dd,dv);if(ok(dd,dv,st))return{dd,dv,st}}
  const dd=ri(minDD,maxDD),dv=ri(minDV,maxDV)||7;return{dd,dv,st:steps(dd,dv)};
}
/* 估商：把除數想成整十，估出的商 */
const estQ=(cur,dv)=>dv<10?Math.min(9,Math.floor(cur/dv)):Math.min(9,Math.floor(cur/near10(dv)));
const PLACE=['個','十','百','千','萬'];
const placeName=(n,i)=>PLACE[n-1-i]+'位';

/* 直式畫面：rows=[{text,end,under,id,cls}]，qcells=商那一列每格文字 */
function divView({dv,D,qcells,rows,active,onRow,onQCell,hiCol}){
  const n=D.length;const box=el('div',{class:'ld',style:`--n:${n};--dw:${String(dv).length*0.62+0.9}em`});
  const mk=(cls)=>el('div',{class:'ldrow '+(cls||'')});
  const cell=(t,c)=>el('div',{class:'lc '+(c||'')},t==null?'':String(t));
  /* 商 */
  const qr=mk('qrow');qr.append(cell('','dvc'));
  for(let c=0;c<n;c++){const t=qcells[c]==null?'':String(qcells[c]);const cc=cell(t,'q'+(active&&active.kind==='q'&&active.col===c?' act':'')+(hiCol===c?' hi':''));
    if(onQCell){cc.classList.add('tap');cc.onclick=()=>onQCell(c)}qr.append(cc)}
  if(onRow){qr.classList.add('tapr');qr.onclick=()=>onRow('quot')}
  box.append(qr);
  /* 除數＋被除數 */
  const dr=mk('ddrow');dr.append(cell(dv,'dvc'));D.forEach((d,c)=>dr.append(cell(d,'dd'+(c===0?' first':''))));box.append(dr);
  rows.forEach(r=>{const row=mk(r.cls);row.append(cell('','dvc'));const s=String(r.text);const start=r.end-s.length+1;
    for(let c=0;c<n;c++){const k=c-start;let t=(k>=0&&k<s.length)?s[k]:'';let cl='';
      if(r.under&&c>=Math.min(start,r.uStart??start)&&c<=r.end)cl+=' ul';
      if(r.act&&c===r.end)cl+=' act';if(r.newCol===c)cl+=' newd';row.append(cell(t,cl))}
    if(onRow&&r.id){row.classList.add('tapr');row.onclick=()=>onRow(r.id)}
    box.append(row)});
  return box;
}
/* 依進度組出直式的各列 */
function buildRows(st,upto,phase,buf){
  const rows=[];const{D,n,S}=st;
  for(let j=0;j<S.length&&j<=upto;j++){const s=S[j];
    if(j===upto&&phase==='q')break;
    if(s.q>0||s.zf){rows.push({text:s.prod,end:s.i,under:true,id:'p'+j,uStart:s.i-String(s.cur).length+1});
      if(j===upto&&phase==='r'){rows.push({text:buf||'',end:s.i,act:true,id:'r'+j});break}
      if(s.i<n-1)rows.push({text:s.r*10+D[s.i+1],end:s.i+1,id:'r'+j,newCol:s.i+1});else rows.push({text:s.r,end:s.i,id:'r'+j})}
    else{const last=rows[rows.length-1];if(last&&s.i<n-1){last.text=s.cur*10+D[s.i+1];last.end=s.i+1;last.newCol=s.i+1}}
  }
  return rows;
}
const qcellsOf=(st,upto)=>{const a=[];st.S.forEach((s,j)=>{if(j<upto)a[s.i]=s.q});return a};

/* 數字鍵盤 */
function keypad(onKey){

  ['1','2','3','4','5','6','7','8','9','⌫','0','確定'].forEach(t=>{const b=el('button',{class:t==='確定'?'kp-ok':t==='⌫'?'kp-del':''},t);b.onclick=()=>onKey(t);k.append(b)});

/* 完整直式：一步一步填；回傳得分 */
function solveDiv(ctx,S,{dd,dv,st},{askStart=true,title='',pts=10}={}){
  return new Promise(res=>{
    const head=el('div',{class:'q',html:title||`算算看：<b>${dd} ÷ ${dv}</b>`});
    const viewBox=el('div',{class:'ldwrap'});const fb=el('div',{class:'fb',hidden:''});const tip=el('div',{class:'small'});
    const hintB=el('button',{class:'ghost',style:'font-size:15px;min-height:40px;padding:4px 12px'},'💡 估商提示');
    S.append(head,viewBox,tip,el('div',{class:'ctrl'},hintB),fb);
    let mis=0,j=0,phase=askStart?'start':'q',buf='';
    const kp=keypad(key);S.append(kp);
    const say=(t,ok)=>{fb.hidden=false;fb.className='fb '+(ok?'ok':'bad');fb.innerHTML=t};
    function draw(){
      viewBox.innerHTML='';const s=st.S[j];
      const qc=qcellsOf(st,phase==='done'?st.S.length:(phase==='r'?j+1:j));
      if(phase==='q'&&buf!=='')qc[s.i]=buf;
      viewBox.append(divView({dv,D:st.D,qcells:qc,rows:buildRows(st,phase==='done'?st.S.length:j,phase==='start'?'q':phase,buf),
        active:phase==='q'?{kind:'q',col:s.i}:null,onQCell:phase==='start'?pickStart:null}));
      kp.hidden=phase==='start'||phase==='done';hintB.hidden=phase!=='q';
      tip.textContent=phase==='start'?'先想一想：商的第一個數字要寫在哪一位的上面？點上面那一排的格子。'
        :phase==='q'?`估商：${s.cur} 裡面有幾個 ${dv}？輸入商的這一位。`
        :phase==='r'?`減減看：${s.cur} − ${s.prod} ＝ ？輸入剩下的數。`:'';
    }
    function pickStart(c){const f=st.S[0].i;
      if(c===f){sfx(true);say(`對！${placeName(st.n,f)}開始寫，因為前面的 ${String(st.S[0].cur)} 才夠分給 ${dv}。`,true);phase='q';draw()}
      else{mis++;sfx(false);say(c<f?`${st.D.slice(0,c+1).join('')} 比 ${dv} 小，不夠分，要再多看一位。`:`看${placeName(st.n,c-1)}以前就已經夠分了，商要更早開始寫。`)}}
    hintB.onclick=()=>{const s=st.S[j];const R=dv<10?dv:near10(dv);
      say(dv<10?`想想 ${dv} 的幾倍最接近 ${s.cur}，又不會超過？`:`把 ${dv} 想成 <b>${R}</b>，${s.cur} 裡面大約有幾個 ${R}？估出來以後，乘乘看再調整。`,true);fb.className='fb'};
    function key(t){
      if(phase!=='q'&&phase!=='r')return;
      if(t==='⌫'){buf=buf.slice(0,-1);draw();return}
      if(t!=='確定'){if(phase==='q'){buf=t}else if(buf.length<5){buf+=t}draw();return}
      if(buf==='')return;const v=+buf;const s=st.S[j];
      if(phase==='q'){
        if(v===s.q){sfx(true);fb.hidden=true;buf='';
          if(s.q===0&&!s.zf){say(`${s.cur} 比 ${dv} 小，不夠分，商寫 0，再往下拉一位。`,true);j++;phase=j<st.S.length?'q':'done'}
          else phase='r';
          if(phase==='done')finish();draw();return}
        mis++;sfx(false);
        if(v*dv>s.cur)say(`${dv} × ${v} ＝ ${v*dv}，比 ${s.cur} 大，<b>商太大了</b>，改小一點。`);
        else say(`${dv} × ${v} ＝ ${v*dv}，${s.cur} − ${v*dv} ＝ ${s.cur-v*dv}，剩下的比 ${dv} 還大，<b>還能再分</b>，商改大一點。`);
        buf='';draw();return}
      if(phase==='r'){
        if(v===s.r){sfx(true);fb.hidden=true;buf='';j++;
          if(j>=st.S.length){phase='done';finish()}else{phase='q';if(s.i<st.n-1)say(`把下一位的 ${st.D[s.i+1]} 拉下來，變成 ${s.r*10+st.D[s.i+1]}。`,true)}
          draw();return}
        mis++;sfx(false);say(`再算一次：${s.cur} − ${s.prod} ＝ ？`);buf='';draw()}
    }
    function finish(){const r=st.r;
      say(`完成！<b>${dd} ÷ ${dv} ＝ ${st.q} … ${r}</b>　檢查：餘數 ${r} ${r<dv?'比':'不比'}除數 ${dv} 小 ✔`,true);
      waitBtn(S,'下一題 →').then(()=>res(Math.max(3,pts-2*mis)))}
    draw();
  });
}

  return `<svg viewBox="0 0 ${W} 170" style="width:100%;max-width:${W+20}px;display:block;margin:auto">${h}</svg>`;

    step1.append(el('div',{class:'tag'},`第 1 步：先準備估商。除數 ${dv} 要想成哪一個整十？`));

      if(T1.includes(c)){b.classList.add('ok');[...tw.children].forEach(x=>x.disabled=true);sfx(true);pts+=[3,2,1][wrong1]||0;fb.hidden=false;fb.className='fb ok';fb.innerHTML=`對！${dv} 最接近 ${c}${T1.length>1?'（20 和 30 一樣近，兩個都可以）':''}。`;step2(c)}
      else{wrong1++;b.classList.add('bad');b.disabled=true;sfx(false);fb.hidden=false;fb.className='fb bad';fb.innerHTML=`${dv} 離 ${c} 比較遠，要找<b>最接近</b>的整十。`}}});
    function step2(R){
      qEl.innerHTML=`<b>${dd} ÷ ${dv}</b>　商是多少？`;
      const est=Math.min(9,Math.floor(dd/R));
      const box=el('div',{class:'qbox'});S.append(box);
      box.append(el('div',{class:'tag',html:`第 2 步：${dd} 裡面大約有幾個 ${R}？拉滑桿選商，按「秤秤看」。`}));
      const sv=svgEl('0 0 340 170','','width:100%;max-width:420px;display:block;margin:auto');box.append(sv);
      const sl=el('input',{type:'range',min:'0',max:'9',step:'1',value:'1',id:'qsl'});

      box.append(lab,sl,el('div',{class:'ctrl',style:'justify-content:center'},go));
      let tries=0,done=false;
      const draw=(v,show)=>{const p=dv*v;const ang=show?(p>dd?-12:(dd-p>=dv?8:3)):0;
        let h=`<path d="M170 30 V150 M120 150 h100" stroke="#1E2A3A" stroke-width="4"/><g transform="rotate(${-ang} 170 40)"><path d="M40 40 H300" stroke="#1E2A3A" stroke-width="5"/>
          <path d="M40 40 L20 80 H60Z" fill="#E3ECF7" stroke="#1E2A3A" stroke-width="2"/><text x="40" y="100" font-size="16" text-anchor="middle" fill="#1E2A3A">被除數</text><text x="40" y="120" font-size="20" text-anchor="middle" fill="#1E2A3A">${dd}</text>

        if(show&&p<=dd){const rem=dd-p,mx=Math.max(rem,dv),w1=rem/mx*240,w2=dv/mx*240;
          h+=`<text x="10" y="148" font-size="12" fill="#5E6B76">剩下 ${rem}</text><rect x="70" y="138" width="${w1}" height="10" rx="5" fill="${rem>=dv?'#C8463D':'#2F9E6B'}"/><text x="10" y="166" font-size="12" fill="#5E6B76">除數 ${dv}</text><rect x="70" y="156" width="${w2}" height="10" rx="5" fill="#9AA4B0"/>`}
        sv.innerHTML=h;lab.innerHTML=`商用 <b>${v}</b> 試試看`};
      sl.value=String(est);draw(est,false);
      sl.addEventListener('input',()=>{if(!done)draw(+sl.value,false)});
      fb.hidden=false;fb.className='fb ok';fb.innerHTML=`把 ${dv} 想成 ${R}：${dd} ÷ ${R}，商大約是 <b>${est}</b>。滑桿已經放在 ${est}，秤秤看對不對！`;
      go.onclick=()=>{if(done)return;const v=+sl.value;tries++;draw(v,true);const p=dv*v;
        if(p>dd){sfx(false);fb.className='fb bad';fb.innerHTML=`${dv} × ${v} ＝ ${p}，比 ${dd} 大，天秤翹起來了！<b>商太大，改小一點。</b>`}
        else if(dd-p>=dv){sfx(false);fb.className='fb bad';fb.innerHTML=`${dv} × ${v} ＝ ${p}，剩下 ${dd-p}，比除數 ${dv} 還大（紅色那條比較長）！<b>還能再分，商改大一點。</b>`}
        else{done=true;sfx(true);go.remove();sl.disabled=true;fb.className='fb ok';
          fb.innerHTML=`剛剛好！<b>${dd} ÷ ${dv} ＝ ${q} … ${r}</b>，餘數 ${r} 比除數 ${dv} 小。${v!==est?`（先估 ${est}，再調整成 ${q}，這就是估商！）`:''}`;
          pts+=tries<=2?7:tries===3?5:3;waitBtn(S,'下一題 →').then(()=>res(pts))}};
    }
  });
}
async function w2(ctx){

/* ================= 世界 4：直式偵探 ================= */
function detect(ctx,S,kind){
  return new Promise(res=>{
    let P,wrongRows,shownQ,rowsOverride,fix,why,hints;
    if(kind==='zero'){P=gen(1000,9999,3,49,(dd,dv,st)=>midZero(st)&&st.q>=100);const qs=String(P.st.q);
      const qc=[];const nz=qs.replace(/0/g,'');for(let k=0;k<nz.length;k++)qc[P.st.n-nz.length+k]=nz[k];shownQ=qc;rowsOverride=buildRows(P.st,P.st.S.length,'done','');
      wrongRows=['quot'];fix={q:`商應該是 ${P.st.q}`,opts:[`${P.st.q}`,`${nz}`,`${nz}0`]};why=`有一位不夠分，卻沒有記 0，商少了一位。`;hints=['數數看商有幾位數？','不夠分的那一位，商要記 0。']}

const TASKS=[

function lifeTask(ctx,S,T){
  return new Promise(res=>{
    const{P}=T;const q=P.st.q,r=P.st.r,final=T.ans==='q1'&&r>0?q+1:q;
    S.append(el('div',{class:'card-clue',html:T.icon+' '+T.q}));
    S.append(el('div',{class:'small'},'先用紙筆（或心算）算出商和餘數，填進下面的格子。'));
    const form=el('div',{class:'qr-in'});
    const bq=el('button',{class:'slot on'},'');const br=el('button',{class:'slot'},'');
    form.append(el('span',{},`${P.dd} ÷ ${P.dv} ＝`),bq,el('span',{},'…'),br);
    const fb=el('div',{class:'fb',hidden:''});S.append(form);
    let cur='q',vq='',vr='',mis=0;
    bq.onclick=()=>{cur='q';bq.classList.add('on');br.classList.remove('on')};br.onclick=()=>{cur='r';br.classList.add('on');bq.classList.remove('on')};
    const kp=keypad(t=>{if(t==='⌫'){if(cur==='q')vq=vq.slice(0,-1);else vr=vr.slice(0,-1)}
      else if(t==='確定'){check();return}
      else{if(cur==='q'&&vq.length<4)vq+=t;else if(cur==='r'&&vr.length<3)vr+=t}
      bq.textContent=vq;br.textContent=vr});
    S.append(kp,fb);
    const say=(t,ok)=>{fb.hidden=false;fb.className='fb '+(ok?'ok':'bad');fb.innerHTML=t};
    function check(){if(vq===''){say('先填商。');return}if(vr===''){cur='r';br.click();say('再填餘數（沒有剩下就填 0）。');return}
      const a=+vq,b=+vr;
      if(a===q&&b===r){sfx(true);kp.remove();say(`算對了！${P.dd} ÷ ${P.dv} ＝ ${q} … ${r}`,true);step2();return}
      mis++;sfx(false);
      if(b>=P.dv)say(`餘數 ${b} 比除數 ${P.dv} 還大，<b>還能再分</b>！商要改大。`);
      else if(a*P.dv+b===P.dd)say('算式對了，但是再檢查一次…');
      else if(a*P.dv>P.dd)say(`${P.dv} × ${a} ＝ ${a*P.dv}，比 ${P.dd} 大，商太大了。`);
      else say(`驗算看看：${P.dv} × ${a} ＋ ${b} ＝ ${a*P.dv+b}，不等於 ${P.dd}，再算一次。`)}
    async function step2(){
      const vis=el('div',{class:'packs'});const show=Math.min(q,24);
      for(let i=0;i<show;i++)vis.append(el('span',{class:'pk'},T.icon));if(q>show)vis.append(el('span',{class:'small'},`…共 ${q} 份`));
      if(r>0)vis.append(el('span',{class:'pk left'},`剩 ${r}`));S.append(vis);
      const qa=el('div');S.append(qa);
      const opts=[...new Set([`${final} ${T.unit}`,`${final===q?q+1:q} ${T.unit}`,`${r} ${T.unit}`])];
      const g=await pick(qa,{q:'所以答案是？',opts,hints:['想一想：剩下的要「多一個」，還是「不算」？',T.ans==='q1'?'剩下的也需要，不能丟下！':'剩下的不夠一份，不能算進去。'],explain:T.why,pts:5});
      res(Math.max(0,5-2*mis)+g)}
  });
}

function bossQ(){

  const mk=(q,ans,ds,why)=>({q,opts:[String(ans),...shuffle([...new Set(ds.map(String))].filter(x=>x!==String(ans))).slice(0,3)],why});
  if(g==='ten'){let dv;do{dv=ri(11,94)}while(dv%10===0||dv%10===5);const R=near10(dv);return mk(`估商時，除數 ${dv} 要想成？`,R,[R-10,R+10,dv],`${dv} 最接近 ${R}。`)}
  if(g==='digits'){const P=gen(100,9999,3,89,()=>true);const L=String(P.st.q).length;return mk(`${P.dd} ÷ ${P.dv}，商是幾位數？`,L+' 位數',[(L+1)+' 位數',Math.max(1,L-1)+' 位數','4 位數','1 位數'],`商從${placeName(P.st.n,P.st.S[0].i)}開始寫，是 ${L} 位數。`)}
  if(g==='rem'){const dv=ri(12,60),q=ri(2,9);const bad=Math.random()<.5;const r=bad?ri(dv,dv+9):ri(0,dv-1);return mk(`有人算出「□ ÷ ${dv} ＝ ${q} … ${r}」，這個餘數合理嗎？`,bad?'不合理':'合理',[bad?'合理':'不合理'],bad?`餘數 ${r} 不能比除數 ${dv} 大或一樣。`:`餘數 ${r} 比除數 ${dv} 小，合理。`)}
  if(g==='est'){const P=gen(100,999,12,94,(dd,dv,st)=>dd<dv*10&&dd>=dv);return mk(`${P.dd} ÷ ${P.dv} 的商是？`,P.st.q,[P.st.q+1,Math.max(0,P.st.q-1),P.st.q+2],`${P.dd} ÷ ${P.dv} ＝ ${P.st.q} … ${P.st.r}`)}
  if(g==='check'){const dv=ri(12,40),q=ri(3,30),r=ri(1,dv-1);return mk(`${dv} × ${q} ＋ ${r} ＝ ？（驗算）`,dv*q+r,[dv*q+r+dv,dv*q-r,dv*q+r+10],`${dv} × ${q} ＝ ${dv*q}，再加 ${r}。`)}
  const dv=ri(4,9),n=dv*ri(3,8)+ri(1,dv-1);return mk(`${n} 人坐計程車，每輛最多坐 ${dv} 人，最少要幾輛？`,Math.ceil(n/dv),[Math.floor(n/dv),Math.ceil(n/dv)+1],`${n} ÷ ${dv} ＝ ${Math.floor(n/dv)} … ${n%dv}，剩下的人也要坐，要多一輛。`);
}

}

/* ---------- 排行榜 ---------- */
async function board(tab=0){
  if(typeof tab!=='number')tab=0;
  app.innerHTML='';app.append(header());
  const tabs=['總分',...WORLDS.map(w=>w.boss?'魔王關':w.name)];
  let rows=[],failed=false;
  if(REMOTE){app.append(el('div',{class:'panel'},'正在讀取排行榜…'));try{rows=await cloudBoard(tab===0?'total':WKEY[tab-1])}catch(e){failed=true}if(window.bzStats)await bzStats('divking');app.innerHTML='';app.append(header())}
  else rows=Object.entries(DB.players).map(([n,p])=>{const tm=p.time||[];const b=p.best;return tab===0?{n,v:b.reduce((a,c)=>a+c,0),t:tm.reduce((a,c,i)=>a+(b[i]>0?(c||0):0),0)}:{n,v:b[tab-1]||0,t:tm[tab-1]}}).filter(r=>r.v>0).sort(cmpRow);
  const tbl=el('table',{class:'lb'},el('tr',{},el('th',{},'名次'),el('th',{},'名字'),REMOTE?el('th',{style:'text-align:right'},'次數'):null,el('th',{style:'text-align:right'},'時間'),el('th',{style:'text-align:right'},'分數')));
  rows.forEach((r,i)=>tbl.append(el('tr',{class:r.n===DB.current?'me':''},el('td',{},i<3?['🥇','🥈','🥉'][i]:String(i+1)),el('td',{},r.n+(REMOTE&&window.bzTag?bzTag('divking',r.n):'')),REMOTE?el('td',{style:'text-align:right'},String(window.bzPlays?bzPlays('divking',r.n):0)):null,el('td',{style:'text-align:right'},fmt(r.t)),el('td',{class:'n'},String(r.v)))));
  let armed=false;
  const clr=el('button',{class:'ghost',onclick:()=>{if(!armed){armed=true;clr.textContent='再按一次確定清除';clr.className='warn';return}DB={players:{},current:''};save();home()}},'清除這台裝置的紀錄');
  app.append(el('div',{class:'panel',style:'display:flex;flex-direction:column;gap:12px'},
    el('h2',{style:'font-size:24px'},REMOTE?'全校排行榜（前 30 名）':'排行榜（這台裝置）'),
    el('div',{class:'tabs'},tabs.map((t,i)=>el('button',{class:i===tab?'on':'',onclick:()=>board(i)},t))),
    failed?el('p',{class:'small'},'排行榜暫時連不上，請確認網路後按「重新整理」。'):rows.length?el('div',{style:'overflow-x:auto'},tbl):el('p',{class:'small'},'還沒有人上榜。輸入名字開始玩，第一名就是你！'),
    el('p',{class:'small'},'分數高的排前面；分數一樣，時間短的排前面。'+(REMOTE?'🏆 = 每一關都過關；次數 = 總共玩了幾關。':'這個版本的排行榜只記在這台裝置上。'))));
  app.append(el('div',{class:'row'},el('button',{onclick:home},'回地圖'),REMOTE?el('button',{class:'ghost',onclick:()=>board(tab)},'重新整理'):clr));
}

/* ---------- 成績卡 ---------- */
function card(){
  const p=player();if(!p)return home();
  const total=p.best.reduce((a,b)=>a+b,0);
  const d=new Date();const ds=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
  const raw=DB.current+'|'+p.best.join(',')+'|'+p.time.join(',')+'|'+p.stars.join(',');let h=7;for(const c of raw)h=(h*31+c.charCodeAt(0))>>>0;
  const code=(h%1679616).toString(36).toUpperCase().padStart(4,'0');
  app.innerHTML='';app.append(header());
  app.append(el('div',{class:'panel'},el('div',{class:'card'},
    el('h2',{style:'font-size:24px'},'除法估商王 成績卡'),
    el('div',{},'名字：'+DB.current+'　　日期：'+ds),
    WORLDS.map((w,i)=>el('div',{html:(w.boss?'魔王關':'世界 '+(i+1)+' '+w.name)+'：<b>'+p.best[i]+'</b> 分（'+fmt(p.time[i])+'） '+starStr(p.stars[i])})),
    el('div',{style:'font-family:var(--display);font-size:22px'},'總分 '+total+'　星星 '+p.stars.reduce((a,b)=>a+b,0)+' / '+(NW*3)),
    null)));
  app.append(el('div',{class:'row'},el('button',{onclick:home},'回地圖')));
}

/* ---------- 遊戲框架 ---------- */
let CUR=null;
function play(i){
  const w=WORLDS[i];app.innerHTML='';
  const sc=el('span',{class:'score'},'0 分');const tm=el('span',{class:'score',style:'color:var(--ink)'},'⏱ 0:00');
  const bar=el('i');const stage=el('div',{class:'stage'});const t0=Date.now();
  const token={};CUR=token;
  const timer=setInterval(()=>{if(CUR!==token){clearInterval(timer);return}tm.textContent='⏱ '+fmt((Date.now()-t0)/1000||0.4)},500);
  app.append(el('div',{class:'gamehead'},el('button',{class:'ghost',onclick:()=>{CUR=null;home()}},'← 地圖'),el('h2',{},(w.boss?'':'世界 '+(i+1)+'　')+w.name),el('div',{class:'stats'},tm,sc)),el('div',{class:'bar'},bar),stage);
  const ctx={stage,score:0,max:0,step:0,N:1,alive:()=>CUR===token,
    add(n){this.score+=n;sc.textContent=this.score+' 分'},
    tick(got,pts){this.max+=pts;this.add(got);bar.style.width=(Math.min(1,++this.step/this.N)*100)+'%'}};
  window.scrollTo(0,0);
  w.run(ctx).then(()=>{if(CUR!==token)return;clearInterval(timer);finish(i,ctx.score,ctx.max,Math.max(1,Math.round((Date.now()-t0)/1000)))});
}
function finish(i,score,max,secs){
  const p=player();score=Math.max(0,score);let st=starsFor(score,max||1);if(WORLDS[i].boss&&score<max)st=Math.min(st,2);
  const isBest=better(score,secs,p.best[i],p.time[i]);
  if(isBest){p.best[i]=score;p.time[i]=secs}
  p.stars[i]=Math.max(p.stars[i],st);p.plays++;save();
  app.innerHTML='';app.append(header());
  const msg=(i===NW-1&&score<max)?'王冠被搶走了……再挑戰一次，把亂除怪打倒！':st===3?'太厲害了，滿分等級！':st===2?'很棒！再挑戰一次拿三顆星？':st===1?(i<NW-1?'過關了！下一關已經打開。':'過關了！你就是除法估商王！'):'再練習一次，拿到 1 顆星就能過關。';
  const up=REMOTE?el('div',{class:'small'},'成績上傳中…'):null;
  if(REMOTE&&window.bzLog)bzLog('divking',WKEY[i],score,st>=1);
  if(REMOTE)pushScore(i,secs).then(r=>{up.textContent='已登記到全校排行榜！這一關你目前第 '+r+' 名。'}).catch(()=>{up.textContent='連線失敗，成績先存在這台裝置，下次玩完會一起上傳。'});
  app.append(el('div',{class:'panel result'},
    el('h2',{style:'font-size:26px'},WORLDS[i].name+' 完成'),
    el('div',{class:'bigstars',html:'★'.repeat(st)+'<span class="off">'+'★'.repeat(3-st)+'</span>'}),
    el('div',{style:'font-family:var(--display);font-size:30px;color:var(--brick)'},score+' / '+max+' 分'),
    el('div',{style:'font-family:var(--display);font-size:20px'},'用時 '+fmt(secs)+(p.time[i]&&!isBest?'　（最佳 '+p.best[i]+' 分・'+fmt(p.time[i])+'）':'')),
    isBest&&score>0?el('div',{class:'chip'},'新紀錄！'):null,up,el('p',{},msg),
    el('div',{class:'row',style:'justify-content:center'},el('button',{onclick:()=>play(i)},'再玩一次'),i<NW-1&&p.stars[i]>=1?el('button',{onclick:()=>play(i+1)},'下一關'):null,el('button',{class:'ghost',onclick:home},'回地圖'),el('button',{class:'ghost',onclick:()=>board()},'排行榜'))));
  sfx(st>0);
}
function waitBtn(parent,label){return new Promise(r=>{const b=el('button',{class:'big'},label);b.onclick=()=>{b.remove();r()};parent.append(b);b.focus({preventScroll:true})})}
const ptsFor=(pts,wrong)=>[pts,Math.round(pts*.6),Math.round(pts*.3)][wrong]||0;
const lab=o=>o.label||String(o.html||o).replace(/<[^>]+>/g,'');
const tagLine=(S,t)=>S.append(el('div',{class:'tag'},t));

/* 答錯不給答案：第 1、2 次錯給提示可重答（得分遞減），第 3 次才揭曉 */
function tiered(fb,{hints=[],explain=''}){
  let wrong=0;
  return{get wrong(){return wrong},
    bad(why){wrong++;sfx(false);fb.hidden=false;fb.className='fb bad';if(wrong>=3)return true;
      fb.innerHTML=(why?why+'<br>':'')+'💡 提示：'+(hints[Math.min(wrong-1,hints.length-1)]||'再想一想！')+' 再試一次！';return false},
    good(){sfx(true);fb.hidden=false;fb.className='fb ok';fb.innerHTML='答對了！'+(explain?' '+explain:'')},
    reveal(ans){fb.className='fb bad';fb.innerHTML='答案是「'+ans+'」。'+(explain?' '+explain:'')}}
}
function pick(parent,{q,tag,top,opts,ans=0,hints,explain,pts=10,img=false}){
  return new Promise(res=>{
    const box=el('div',{class:'qbox'});if(tag)box.append(el('div',{class:'tag'},tag));if(top)box.append(el('div',{class:'focus',html:top}));if(q)box.append(el('div',{class:'q',html:q}));
    const wrap=el('div',{class:'opts'+(img?' imgs':'')});if(img)wrap.style.gridTemplateColumns='repeat('+(opts.length===4&&innerWidth<520?2:opts.length)+',minmax(0,1fr))';
    const fb=el('div',{class:'fb',hidden:''});
    const T=tiered(fb,{hints,explain});const btns=[];let done=false;
    const end=got=>{done=true;btns.forEach(b=>b.disabled=true);btns[ans].classList.add('ok');btns[ans].disabled=false;
      const nx=el('button',{},'下一步 →');nx.onclick=()=>{box.remove();res(got)};box.append(el('div',{class:'ctrl'},nx));nx.focus({preventScroll:true})};
    shuffle(opts.map((_,i)=>i)).forEach(i=>{const o=opts[i];
      const b=el('button',{html:o.html||o});b.onclick=()=>{if(done||b.disabled)return;
        if(i===ans){b.classList.add('ok');T.good();end(ptsFor(pts,T.wrong))}
        else{b.classList.add('bad');b.disabled=true;if(T.bad(o.why)){T.reveal(lab(opts[ans]));end(0)}}};
      btns[i]=b;wrap.append(b)});
    box.append(wrap,fb);parent.append(box);
  });
}
/* 飄來飄去的泡泡選項 */
function chase(parent,ctx,{q,top,opts,ans=0,hints,explain,pts=10}){
  return new Promise(res=>{
    const box=el('div',{class:'qbox'});if(top)box.append(el('div',{class:'focus',html:top}));box.append(el('div',{class:'q',html:q}));
    const sky=el('div',{class:'sky'});const fb=el('div',{class:'fb',hidden:''});box.append(sky,fb);parent.append(box);
    const T=tiered(fb,{hints,explain});let done=false;const S=96,H=300;const W=()=>Math.max(220,sky.clientWidth);
    const ms=shuffle(opts.map((_,i)=>i)).map((i,k)=>{const o=opts[i];const b=el('button',{class:'mover',html:o.html});sky.append(b);
      const m={b,i,x:(k%2)*(W()-S),y:(k>>1)*(H-S),vx:(Math.random()<.5?-1:1)*(30+Math.random()*25),vy:(Math.random()<.5?-1:1)*(25+Math.random()*20),dead:false};
      b.onclick=()=>{if(done||m.dead)return;
        if(i===ans){b.classList.add('ok');T.good();fin(ptsFor(pts,T.wrong))}
        else{b.classList.add('bad');m.dead=true;if(T.bad(o.why)){T.reveal(lab(opts[ans]));ms.find(z=>z.i===ans).b.classList.add('ok');fin(0)}}};
      return m});
    let last=performance.now();const place=m=>{m.b.style.transform=`translate(${m.x}px,${m.y}px)`};ms.forEach(place);
    function loop(now){if(done||!ctx.alive())return;const dt=Math.min(.05,(now-last)/1000);last=now;const w=W();
      ms.forEach(m=>{if(m.dead)return;m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.x<0){m.x=0;m.vx*=-1}if(m.x>w-S){m.x=w-S;m.vx*=-1}if(m.y<0){m.y=0;m.vy*=-1}if(m.y>H-S){m.y=H-S;m.vy*=-1}});
      for(let a=0;a<ms.length;a++)for(let c=a+1;c<ms.length;c++){const A=ms[a],B=ms[c];const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1;if(d<S){const o=(S-d)/2,nx=dx/d,ny=dy/d;if(!A.dead){A.x-=nx*o;A.y-=ny*o}if(!B.dead){B.x+=nx*o;B.y+=ny*o}if(!A.dead&&!B.dead){[A.vx,B.vx]=[B.vx,A.vx];[A.vy,B.vy]=[B.vy,A.vy]}}}
      ms.forEach(m=>{m.x=Math.max(0,Math.min(w-S,m.x));m.y=Math.max(0,Math.min(H-S,m.y));place(m)});requestAnimationFrame(loop)}
    if(!REDUCE)requestAnimationFrame(loop);
    function fin(got){done=true;const nx=el('button',{},'下一步 →');nx.onclick=()=>{box.remove();res(got)};box.append(el('div',{class:'ctrl'},nx));nx.focus({preventScroll:true})}
  });
}


home();
if(REMOTE&&DB.current)pullMine().then(()=>{if(!CUR)home()});
})();
