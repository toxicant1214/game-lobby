<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>環島交通王</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
[hidden]{display:none!important}
/* 版面：公路灰底＋公車黃、路線藍；每個世界是一個交通站，舞台上方有東西在移動，下方是門／選項 */
:root{
  --bg:#E8EEF1; --panel:#FFFFFF; --panel2:#EEF3F6; --ink:#1F2A33; --soft:#5E6B76;
  --brick:#2B6CB0; --brick-d:#1E4E82; --grain:#F2B705; --bamboo:#2F9E6B; --water:#4BA3D9;
  --line:#D3DCE2; --ok:#2F9E6B; --bad:#D9483B; --road:#3A4450;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  }
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
b{color:var(--brick)}
button{font-family:var(--display);font-size:18px;cursor:pointer;border:0;border-radius:14px;padding:10px 18px;background:var(--brick);color:#fff;box-shadow:0 3px 0 var(--brick-d);transition:transform .08s;min-height:48px}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brick-d)}
button:focus-visible,input:focus-visible{outline:3px solid var(--water);outline-offset:2px}
button.ghost{background:var(--panel);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
button.warn{background:var(--bad);box-shadow:0 3px 0 #8A3426}
button:disabled{opacity:.45;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-size:28px;color:var(--brick)}
.chip{font-family:var(--display);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:16px}
.panel{background:var(--panel);border-radius:20px;padding:18px;border:2px solid var(--line)}
.hero{display:grid;grid-template-columns:1fr 130px;gap:14px;align-items:center}
.hero>*,.world>*,.stage>*,.gamehead>*{min-width:0}
.hero p{margin:4px 0 0;color:var(--soft)}
.namerow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.namerow input{flex:1 1 200px;width:100%;min-width:0;font-size:18px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font-family:var(--body)}
.players{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.players button{font-size:15px;padding:4px 12px;min-height:36px;box-shadow:none;background:var(--panel2);color:var(--ink)}
.players button.on{background:var(--grain);color:var(--ink)}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.worlds .boss{grid-column:1/-1}
@media (max-width:520px){.worlds{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero-ico{display:none!important}.namerow button{flex:1 1 100%}.logo h1{font-size:24px}.world{grid-template-columns:56px 1fr}.world .ico{width:56px;height:56px}.world .ico svg{width:46px;height:46px}}
.world{position:relative;text-align:left;background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.world.boss{border-color:#E7A9A1;background:linear-gradient(120deg,var(--panel),#FBE3DF)}
.world .ico{width:72px;height:72px;border-radius:16px;display:grid;place-items:center}
.world h3{font-size:21px}
.world .sub{font-family:var(--body);font-size:14px;color:var(--soft);line-height:1.4}
.world .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:15px}
.stars{color:#E0A526;letter-spacing:2px}
.stars .off{color:var(--line)}
.world.locked{opacity:.55}
.world .lock{font-family:var(--body);font-size:14px;color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.gamehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gamehead .stats{display:flex;gap:14px;margin-left:auto;white-space:nowrap}
@media (max-width:520px){.gamehead h2{font-size:20px;flex:1 1 0}.gamehead .stats{flex:1 1 100%;justify-content:space-between}}
.gamehead h2{font-size:23px;flex:1 1 auto}
.score{font-family:var(--display);font-size:20px;color:var(--brick);font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bamboo);width:0;transition:width .3s}
.stage{background:var(--panel);border-radius:20px;border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.stage svg{display:block}
.tag{font-family:var(--display);color:var(--soft);font-size:15px}
.q{font-family:var(--display);font-size:21px;line-height:1.5}
.qbox{display:flex;flex-direction:column;gap:10px}
.opts{display:grid;gap:8px}
.opts button{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 var(--line);text-align:left;font-size:18px}
.opts.imgs button{text-align:center;padding:8px 4px}
.ib{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;line-height:1.3}
.ib svg{width:64px;height:64px}
.ib.house svg{width:100%;max-width:120px;height:auto}
.opts button.ok,.mover.ok,.lg.ok{background:var(--ok)!important;color:#fff;box-shadow:0 3px 0 #2A5E3A;opacity:1}
.opts button.bad,.mover.bad,.lg.bad{background:var(--bad)!important;color:#fff;box-shadow:0 3px 0 #8A3426}
.fb{border-radius:14px;padding:10px 14px;font-size:16px;line-height:1.55}
.fb.ok{background:#E2F1E5;color:#2A5E3A;border:2px solid #A9D3B4}
.fb.bad{background:#FBE5DF;color:#8A3426;border:2px solid #EAB3A6}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big{font-size:22px;padding:14px 26px}
.small{font-size:14px;color:var(--soft)}
.hero-ico{display:flex;justify-content:center}
.focus{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);font-size:22px}
.focus svg{width:110px;height:110px}
/* 時光機 */
.sky{position:relative;height:300px;border-radius:16px;overflow:hidden;background:linear-gradient(#DCEAF2,#F6EEDC);border:2px solid var(--line)}
.mover{position:absolute;left:0;top:0;width:96px;height:96px;padding:4px;border-radius:50%;background:#ffffffd8;border:2px solid var(--line);box-shadow:0 4px 10px #7A655333;color:var(--ink);display:grid;place-items:center;will-change:transform}
.mover .ib{font-size:13px}
.mover .ib svg{width:50px;height:50px}
/* 拼圖 */
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tray button{background:var(--grain);color:var(--ink);box-shadow:0 3px 0 #B9973E;touch-action:none;user-select:none;-webkit-user-select:none}
.tray button.sel{outline:3px solid var(--brick);outline-offset:2px}
.ghost-chip{position:fixed;z-index:50;pointer-events:none;font-family:var(--display);font-size:18px;background:var(--grain);border-radius:14px;padding:10px 18px;box-shadow:0 6px 16px #0003;transform:translate(-50%,-60%)}
.plan{width:100%;max-width:520px;margin:auto;touch-action:manipulation}
/* 分類快答 */
.flash{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-size:28px;padding:18px 10px;background:#fff;border:2px solid var(--line);border-radius:18px}
.flash svg{width:90px;height:90px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{font-size:22px;padding:16px}
.two .yuan{background:var(--bamboo);box-shadow:0 3px 0 #3E6A30}
.two .han{background:var(--brick)}
/* 地圖 */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
@media (max-width:520px){.mapwrap{grid-template-columns:1fr}}
.mapwrap svg{width:100%;max-width:300px;margin:auto}
.legend{display:flex;flex-direction:column;gap:8px}
.lg{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 var(--line);text-align:left;font-size:16px;line-height:1.35}
.lg .no{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brick);color:#fff;margin-right:6px;font-size:15px}
.card-clue{background:#fff;border:3px dashed var(--brick);border-radius:16px;padding:12px 14px;font-family:var(--display);font-size:20px}
/* 魔王 */
.hp{height:16px;border-radius:99px;background:#EBD7C7;overflow:hidden;border:2px solid #C9A27A}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#E0A526,#B5412F);transition:width .3s}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result .bigstars{font-size:56px;color:#E0A526;letter-spacing:6px}
.result .bigstars .off{color:var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-size:15px;padding:6px 12px;min-height:40px;background:var(--panel2);color:var(--ink);box-shadow:none}
.tabs button.on{background:var(--brick);color:#fff}
table.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lb td,.lb th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.lb th{font-family:var(--display);font-weight:400;color:var(--soft)}
.lb td.n{text-align:right;font-family:var(--display);font-size:19px}
.lb tr.me td{background:#FFF3C4}
.card{border:3px dashed var(--brick);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.card .code{font-family:var(--display);font-size:26px;letter-spacing:4px;color:var(--brick)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.belt{position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(#CFE7F5 0 58%,var(--road) 58% 100%);border:2px solid var(--line)}
.belt::after{content:"";position:absolute;left:0;right:0;top:79%;height:3px;background:repeating-linear-gradient(90deg,#F2B705 0 18px,transparent 18px 30px)}
.rider{position:absolute;left:0;top:50%;will-change:transform;z-index:1}
.ridebox{display:flex;flex-direction:column;align-items:center;gap:0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 10px;box-shadow:0 4px 10px #1F2A3322;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;max-width:200px;text-align:center}
.ridebox svg{width:96px;height:56px}
.ridebox b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--ink);line-height:1.3}
.ridebox.gone{transition:transform .45s,opacity .45s;opacity:0}
.ghost-v{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%) scale(.9);background:#fff;border:2px solid var(--grain);border-radius:14px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 18px #0003}
.ghost-v svg{width:80px;height:46px}.ghost-v b{font-size:14px;font-weight:400}
.gates{display:grid;gap:8px}
.gate{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px dashed #9FB0BC;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:19px;padding:10px 6px;line-height:1.25}
.gate small{font-family:var(--body);font-size:12px;color:var(--soft)}
.gate .gi{font-size:26px}
.gate.ok{background:#DDF2E5!important;border-color:var(--ok)}
.gate.bad{background:#FBE3DF!important;border-color:var(--bad)}
.small-g .gate{font-size:16px;padding:8px 4px}
.twinsea{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;border-radius:16px;background:linear-gradient(#CFE7F5 0 50%,#4BA3D9 50%)}
.twin{background:#ffffffd0;color:var(--ink);box-shadow:0 3px 0 #2B6CB055;display:flex;flex-direction:column;align-items:center;padding:6px;overflow:hidden}
.twin svg{width:100%;max-width:150px;height:auto}
.twin b{font-weight:400;font-size:18px}
.twin.ok{background:#DDF2E5!important;color:var(--ink)}.twin.bad{background:#FBE3DF!important;color:var(--ink)}
.twin.sail svg{animation:sail 1.2s ease-in-out}
@keyframes sail{50%{transform:translateX(30%)}}
.podium{display:flex;gap:8px;min-height:84px;flex-wrap:wrap;padding:8px;border-radius:14px;background:var(--road);align-items:center}
.pod{display:flex;align-items:center;gap:4px;background:#fff;border-radius:12px;padding:2px 8px}
.pod b{font-family:var(--display);color:var(--brick);font-size:20px;font-weight:400}.pod svg{width:70px;height:40px}
.vbtn{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 var(--line);padding:6px 10px}
.vbtn .ib svg{width:80px;height:46px}
.ib svg{width:84px;height:50px}
.board{background:#141A20;border-radius:14px;padding:16px 0;overflow:hidden;border:4px solid #3A4450;box-shadow:inset 0 0 18px #000}
.track{display:flex;white-space:nowrap;width:max-content;will-change:transform}
.seg{background:transparent;color:#F2B705;box-shadow:none;font-size:24px;padding:6px 3px;border-radius:8px;min-height:52px;text-shadow:0 0 6px #F2B70588}
.seg:active{transform:none}
.seg.hit{background:#D9483B;color:#fff;text-shadow:none}
.seg.fixed{background:#2F9E6B;color:#fff;text-shadow:none}
.card-clue{background:#fff;border:3px dashed var(--brick);border-radius:16px;padding:12px 14px;font-family:var(--display);font-size:19px;line-height:1.5}
@media (max-width:520px){.hero h2{font-size:19px!important}}
.foot{text-align:center;color:var(--soft);font-size:14px;padding-block:24px 8px}
</style>

/* 移動的條（交通工具或卡片）：從左邊開到右邊，循環；回傳控制物件 */
function lane(ctx,host,{speed=55,h=120}={}){
  const belt=el('div',{class:'belt',style:`height:${h}px`});host.append(belt);
  let item=null,x=-160,raf=0,paused=false,last=performance.now();
  function loop(now){if(!ctx.alive()||!belt.isConnected)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    if(item&&!paused){x+=speed*dt;const W=belt.clientWidth;if(x>W+10)x=-item.offsetWidth-10;item.style.transform=`translate(${x}px,-50%)`}raf=requestAnimationFrame(loop)}
  raf=requestAnimationFrame(loop);
  return{belt,set(node){if(item)item.remove();item=node;node.classList.add('rider');belt.append(node);x=8;if(REDUCE){x=Math.max(8,(belt.clientWidth-node.offsetWidth)/2)}node.style.transform=`translate(${x}px,-50%)`},
    pause(v){paused=v},get item(){return item},clear(){if(item)item.remove();item=null},stop(){cancelAnimationFrame(raf)}};
}
/* 拖曳一個東西到 .gate 上（也可直接點 gate） */
function dragTo(node,onDrop){
  node.addEventListener('pointerdown',e=>{e.preventDefault();const sx=e.clientX,sy=e.clientY;let ghost=null;try{node.setPointerCapture(e.pointerId)}catch(_){}
    const mv=ev=>{if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){ghost=node.cloneNode(true);ghost.className='ghost-v';document.body.append(ghost)}if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px'}};
    const up=ev=>{node.removeEventListener('pointermove',mv);node.removeEventListener('pointerup',up);node.removeEventListener('pointercancel',up);
      if(ghost){ghost.remove();const t=document.elementFromPoint(ev.clientX,ev.clientY);const g=t&&t.closest&&t.closest('.gate');if(g)onDrop(g.dataset.id)}};
    node.addEventListener('pointermove',mv);node.addEventListener('pointerup',up);node.addEventListener('pointercancel',up)});
}

/* 輸送帶分類：一次一個，送進對的門 */
function sortBelt(ctx,S,{title,items,gates,pts=5}){
  return new Promise(res=>{
    tagLine(S,title);
    const L=lane(ctx,S,{speed:50,h:items[0].tall?150:120});
    const prog=el('div',{class:'small'});const fb=el('div',{class:'fb',hidden:''});
    const gw=el('div',{class:'gates',style:`grid-template-columns:repeat(${gates.length},minmax(0,1fr))`});
    const gb={};gates.forEach(g=>{const b=el('button',{class:'gate',html:g.html});b.dataset.id=g.id;b.onclick=()=>choose(g.id);gb[g.id]=b;gw.append(b)});
    S.append(prog,gw,fb);
    let i=0,total=0,T=null,busy=false;
    const show=()=>{const it=items[i];prog.textContent='第 '+(i+1)+' / '+items.length+' 個　把它拖到下面的門，或直接點門';
      const n=el('div',{class:'ridebox',html:it.html});dragTo(n,choose);L.set(n);T=tiered(fb,{hints:it.hints,explain:it.explain});fb.hidden=true;Object.values(gb).forEach(b=>b.classList.remove('bad','ok'))};
    show();
    async function choose(id){if(busy)return;const it=items[i];
      if(id===it.ans){busy=true;gb[id].classList.add('ok');T.good();total+=ptsFor(pts,T.wrong);L.pause(true);const n=L.item;n.classList.add('gone');await sleep(REDUCE?100:450);L.pause(false);
        const nx=el('button',{},i+1<items.length?'下一個 →':'下一步 →');S.append(nx);await new Promise(r=>nx.onclick=r);nx.remove();busy=false;i++;
        if(i<items.length)show();else{L.stop();L.belt.remove();res(total)}}
      else{gb[id].classList.add('bad');shake(gb[id]);if(T.bad(it.why&&it.why[id]||'')){busy=true;gb[it.ans].classList.add('ok');T.reveal(gates.find(g=>g.id===it.ans).label);L.pause(true);
        const nx=el('button',{},i+1<items.length?'下一個 →':'下一步 →');S.append(nx);await new Promise(r=>nx.onclick=r);nx.remove();busy=false;L.pause(false);i++;if(i<items.length)show();else{L.stop();L.belt.remove();res(total)}}}
    }
  });
}

    let cur=null;

  const ctx={stage,score:0,max:0,step:0,N:1,alive:()=>CUR===token,
    add(n){this.score+=n;sc.textContent=this.score+' 分'},
    tick(got,pts){this.max+=pts;this.add(got);bar.style.width=(Math.min(1,++this.step/this.N)*100)+'%'}};
  window.scrollTo(0,0);
  w.run(ctx).then(()=>{if(CUR!==token)return;clearInterval(timer);finish(i,ctx.score,ctx.max,Math.max(1,Math.round((Date.now()-t0)/1000)))});
}
function finish(i,score,max,secs){
  const p=player();score=Math.max(0,score);let st=starsFor(score,max||1);if(WORLDS[i].boss&&score<max)st=Math.min(st,2);
  const isBest=better(score,secs,p.best[i],p.time[i]);
  if(isBest){p.best[i]=score;p.time[i]=secs}
  p.stars[i]=Math.max(p.stars[i],st);p.plays++;save();
  app.innerHTML='';app.append(header());
  const msg=(i===NW-1&&score<max)?'道路塞爆了……再挑戰一次，把大塞車怪趕走！':st===3?'太厲害了，滿分等級！':st===2?'很棒！再挑戰一次拿三顆星？':st===1?(i<NW-1?'過關了！下一關已經打開。':'過關了！道路暢通了！'):'再練習一次，拿到 1 顆星就能過關。';
  const up=REMOTE?el('div',{class:'small'},'成績上傳中…'):null;
  if(REMOTE&&window.bzLog)bzLog('traffic',WKEY[i],score,st>=1);
  if(REMOTE)pushScore(i,secs).then(r=>{up.textContent='已登記到全校排行榜！這一關你目前第 '+r+' 名。'}).catch(()=>{up.textContent='連線失敗，成績先存在這台裝置，下次玩完會一起上傳。'});
  app.append(el('div',{class:'panel result'},
    el('h2',{style:'font-size:26px'},WORLDS[i].name+' 完成'),
    el('div',{class:'bigstars',html:'★'.repeat(st)+'<span class="off">'+'★'.repeat(3-st)+'</span>'}),
    el('div',{style:'font-family:var(--display);font-size:30px;color:var(--brick)'},score+' / '+max+' 分'),
    el('div',{style:'font-family:var(--display);font-size:20px'},'用時 '+fmt(secs)+(p.time[i]&&!isBest?'　（最佳 '+p.best[i]+' 分・'+fmt(p.time[i])+'）':'')),
    isBest&&score>0?el('div',{class:'chip'},'新紀錄！'):null,up,el('p',{},msg),
    el('div',{class:'row',style:'justify-content:center'},el('button',{onclick:()=>play(i)},'再玩一次'),i<NW-1&&p.stars[i]>=1?el('button',{onclick:()=>play(i+1)},'下一關'):null,el('button',{class:'ghost',onclick:home},'回地圖'),el('button',{class:'ghost',onclick:()=>board()},'排行榜'))));
  sfx(st>0);
}
function waitBtn(parent,label){return new Promise(r=>{const b=el('button',{class:'big'},label);b.onclick=()=>{b.remove();r()};parent.append(b);b.focus({preventScroll:true})})}
const ptsFor=(pts,wrong)=>[pts,Math.round(pts*.6),Math.round(pts*.3)][wrong]||0;
const lab=o=>o.label||String(o.html||o).replace(/<[^>]+>/g,'');
const tagLine=(S,t)=>S.append(el('div',{class:'tag'},t));

/* 答錯不給答案：第 1、2 次錯給提示可重答（得分遞減），第 3 次才揭曉 */
function tiered(fb,{hints=[],explain=''}){
  let wrong=0;
  return{get wrong(){return wrong},
    bad(why){wrong++;sfx(false);fb.hidden=false;fb.className='fb bad';if(wrong>=3)return true;
      fb.innerHTML=(why?why+'<br>':'')+'💡 提示：'+(hints[Math.min(wrong-1,hints.length-1)]||'再想一想！')+' 再試一次！';return false},
    good(){sfx(true);fb.hidden=false;fb.className='fb ok';fb.innerHTML='答對了！'+(explain?' '+explain:'')},
    reveal(ans){fb.className='fb bad';fb.innerHTML='答案是「'+ans+'」。'+(explain?' '+explain:'')}}
}
function pick(parent,{q,tag,top,opts,ans=0,hints,explain,pts=10,img=false}){
  return new Promise(res=>{
    const box=el('div',{class:'qbox'});if(tag)box.append(el('div',{class:'tag'},tag));if(top)box.append(el('div',{class:'focus',html:top}));if(q)box.append(el('div',{class:'q',html:q}));
    const wrap=el('div',{class:'opts'+(img?' imgs':'')});if(img)wrap.style.gridTemplateColumns='repeat('+(opts.length===4&&innerWidth<520?2:opts.length)+',minmax(0,1fr))';
    const fb=el('div',{class:'fb',hidden:''});
    const T=tiered(fb,{hints,explain});const btns=[];let done=false;
    const end=got=>{done=true;btns.forEach(b=>b.disabled=true);btns[ans].classList.add('ok');btns[ans].disabled=false;
      const nx=el('button',{},'下一步 →');nx.onclick=()=>{box.remove();res(got)};box.append(el('div',{class:'ctrl'},nx));nx.focus({preventScroll:true})};
    shuffle(opts.map((_,i)=>i)).forEach(i=>{const o=opts[i];
      const b=el('button',{html:o.html||o});b.onclick=()=>{if(done||b.disabled)return;
        if(i===ans){b.classList.add('ok');T.good();end(ptsFor(pts,T.wrong))}
        else{b.classList.add('bad');b.disabled=true;if(T.bad(o.why)){T.reveal(lab(opts[ans]));end(0)}}};
      btns[i]=b;wrap.append(b)});
    box.append(wrap,fb);parent.append(box);
  });
}
/* 飄來飄去的泡泡選項 */
function chase(parent,ctx,{q,top,opts,ans=0,hints,explain,pts=10}){
  return new Promise(res=>{
    const box=el('div',{class:'qbox'});if(top)box.append(el('div',{class:'focus',html:top}));box.append(el('div',{class:'q',html:q}));
    const sky=el('div',{class:'sky'});const fb=el('div',{class:'fb',hidden:''});box.append(sky,fb);parent.append(box);
    const T=tiered(fb,{hints,explain});let done=false;const S=96,H=300;const W=()=>Math.max(220,sky.clientWidth);
    const ms=shuffle(opts.map((_,i)=>i)).map((i,k)=>{const o=opts[i];const b=el('button',{class:'mover',html:o.html});sky.append(b);
      const m={b,i,x:(k%2)*(W()-S),y:(k>>1)*(H-S),vx:(Math.random()<.5?-1:1)*(30+Math.random()*25),vy:(Math.random()<.5?-1:1)*(25+Math.random()*20),dead:false};
      b.onclick=()=>{if(done||m.dead)return;
        if(i===ans){b.classList.add('ok');T.good();fin(ptsFor(pts,T.wrong))}
        else{b.classList.add('bad');m.dead=true;if(T.bad(o.why)){T.reveal(lab(opts[ans]));ms.find(z=>z.i===ans).b.classList.add('ok');fin(0)}}};
      return m});
    let last=performance.now();const place=m=>{m.b.style.transform=`translate(${m.x}px,${m.y}px)`};ms.forEach(place);
    function loop(now){if(done||!ctx.alive())return;const dt=Math.min(.05,(now-last)/1000);last=now;const w=W();
      ms.forEach(m=>{if(m.dead)return;m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.x<0){m.x=0;m.vx*=-1}if(m.x>w-S){m.x=w-S;m.vx*=-1}if(m.y<0){m.y=0;m.vy*=-1}if(m.y>H-S){m.y=H-S;m.vy*=-1}});
      for(let a=0;a<ms.length;a++)for(let c=a+1;c<ms.length;c++){const A=ms[a],B=ms[c];const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1;if(d<S){const o=(S-d)/2,nx=dx/d,ny=dy/d;if(!A.dead){A.x-=nx*o;A.y-=ny*o}if(!B.dead){B.x+=nx*o;B.y+=ny*o}if(!A.dead&&!B.dead){[A.vx,B.vx]=[B.vx,A.vx];[A.vy,B.vy]=[B.vy,A.vy]}}}
      ms.forEach(m=>{m.x=Math.max(0,Math.min(w-S,m.x));m.y=Math.max(0,Math.min(H-S,m.y));place(m)});requestAnimationFrame(loop)}
    if(!REDUCE)requestAnimationFrame(loop);
    function fin(got){done=true;const nx=el('button',{},'下一步 →');nx.onclick=()=>{box.remove();res(got)};box.append(el('div',{class:'ctrl'},nx));nx.focus({preventScroll:true})}
  });
}


home();
if(REMOTE&&DB.current)pullMine().then(()=>{if(!CUR)home()});
})();
