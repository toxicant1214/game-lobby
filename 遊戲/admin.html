<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>遊戲書房 主任室</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  --paper:#EEF0E8; --sheet:#F8F9F3; --ink:#24302B; --ink-soft:#5E6B63; --line:#C9D0C4;
  --moss:#4F6B4A; --rust:#A65A3A;
  --serif:"Noto Serif TC","Songti TC",serif; --hand:"LXGW WenKai TC","Kaiti TC",var(--serif);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--hand);font-size:16px;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding-block:48px 72px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:24px}
.back{color:var(--ink-soft);text-decoration:none;font-size:14px;letter-spacing:.06em}
h1{font-family:var(--serif);font-weight:900;font-size:34px;margin:0;letter-spacing:.06em}
h2{font-family:var(--serif);font-weight:700;font-size:22px;margin:0;letter-spacing:.06em}
.sub{color:var(--ink-soft);margin:0}
.card{background:var(--sheet);border:1px solid var(--line);padding:24px;display:grid;gap:14px;min-width:0}
label{font-family:var(--serif);font-weight:700;letter-spacing:.1em}
select{font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--ink);background:#fff;color:var(--ink);width:100%;min-height:46px}
input{font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--ink);background:#fff;color:var(--ink);width:100%;min-height:46px}
button{font:inherit;font-size:16px;font-weight:700;letter-spacing:.1em;padding:10px 16px;min-height:46px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--sheet)}
button.danger{background:var(--rust);border-color:var(--rust)}
button.ghost{background:transparent;color:var(--ink)}
button.small{font-size:14px;min-height:36px;padding:4px 12px;letter-spacing:.04em}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--rust);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.msg{margin:0;font-weight:700;min-height:1.4em}
.msg.ok{color:var(--moss)}.msg.err{color:var(--rust)}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-size:20px;margin-right:4px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--serif);font-size:13px;letter-spacing:.12em;color:var(--ink-soft);background:var(--sheet);position:sticky;top:0}
td.code{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.2em}
td input{min-height:36px;font-size:15px;padding:4px 8px;min-width:7em}
td.act{width:1%}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.acts button.small{min-height:32px;padding:3px 10px;white-space:nowrap}
@media (max-width:600px){
  .tablewrap{overflow:visible;border:0;background:transparent}
  .tablewrap thead{display:none}
  .tablewrap table,.tablewrap tbody{display:block}
  .tablewrap tr{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;background:#fff;border:1px solid var(--line);padding:12px;margin-bottom:10px}
  .tablewrap td{border:0;padding:0;white-space:normal}
  .tablewrap td:nth-child(2){grid-column:1/-1;grid-row:2}
  .tablewrap td:nth-child(2) input{width:100%;min-width:0}
  .tablewrap td:nth-child(3){grid-column:2;grid-row:1;justify-self:end}
  .tablewrap td:nth-child(4){grid-column:1;grid-row:3;font-size:13px;color:var(--ink-soft)}
  .tablewrap td:nth-child(4)::before{content:"最後使用 "}
  .tablewrap td.act{grid-column:2;grid-row:3;width:auto;justify-self:end}
  .tablewrap .acts{flex-direction:row}
}
tr.off td{color:#9AA39C}
tr.off td.code{text-decoration:line-through}
.pill{display:inline-block;font-size:13px;padding:0 8px;border:1px solid currentColor}
.pill.on{color:var(--moss)}.pill.off{color:var(--rust)}
.note{font-size:14px;color:var(--ink-soft);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">← 回遊戲書房</a>
  <div>
    <h1>主任室</h1>
    <p class="sub">管理學生代碼、清除排行榜。</p>
  </div>

  <form class="card" id="login">
    <label for="pass">主任密碼</label>
    <div class="row">
      <input id="pass" type="password" autocomplete="current-password" required>
      <button type="submit" id="loginBtn" style="flex:0 0 auto">進入</button>
    </div>
    <p class="msg" id="loginMsg" aria-live="polite"></p>
  </form>

  <section class="card" id="codes" hidden>
    <h2>學生代碼</h2>
    <div class="stats" id="stats"></div>
    <div class="row">
      <input id="addN" type="number" min="1" max="200" value="10" aria-label="要新增幾組" style="flex:0 0 6em">
      <button type="button" id="addBtn" style="flex:0 0 auto">新增代碼</button>
      <button type="button" class="ghost" id="copyBtn" style="flex:0 0 auto">複製可用代碼</button>
    </div>
    <p class="msg" id="codeMsg" aria-live="polite"></p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>代碼</th><th>備註（姓名、座號）</th><th>狀態</th><th>最後使用</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="note">停用後，孩子下次打開遊戲書房就會被請回輸入代碼的畫面。備註打完按 Enter 或點別處就會存。</p>
  </section>

  <section class="card" id="records" hidden>
    <h2>學生紀錄</h2>
    <p class="sub">所有玩過的孩子（完整姓名）、玩了幾次、有沒有全破。老師們用老師密碼也能從大廳下方的「老師查看」進去看。</p>
    <a href="./teacher.html" id="recBtn" style="text-decoration:none"><button type="button" style="width:100%">打開學生紀錄</button></a>
  </section>

  <section class="card" id="reset" hidden>
    <h2>清除排行榜</h2>
    <p class="sub">選擇要清除的範圍，舊成績會先備份。每年 1、3、5、7、9、11 月的 1 號早上 8 點也會自動清除全部遊戲一次。</p>
    <label for="which">清除範圍</label>
    <select id="which">
      <option value="all">全部遊戲</option>
      <option value="plants">植物大冒險（三上自然）</option>
      <option value="air">空氣和水大冒險（三上自然）</option>
      <option value="force">力量大冒險（三上自然）</option>
      <option value="aquatic">水之國生存挑戰（四上自然）</option>
      <option value="yb">因倍數大冒險（五上數學）</option>
      <option value="family">家庭稱謂大挑戰（三上社會）</option>
      <option value="moon">追月小偵探（四上自然）</option>
      <option value="laojia">阿嬤的三合院（四上社會）</option>
      <option value="traffic">環島交通王（四上社會）</option>
      <option value="divking">除法估商王（四上數學）</option>
      <option value="idiom4">成語大冒險 康軒版（四上國語）</option>
      <option value="idiomn4">成語大冒險 南一版（四上國語）</option>
      <option value="idiomh4">成語大冒險 翰林版（四上國語）</option>
      <option value="idiomn3b">成語大冒險 南一版 L7～12（三上國語）</option>
    </select>
    <button class="danger" id="go" type="button">清除排行榜</button>
    <div id="confirm" hidden>
      <p class="msg" id="confirmText">確定要清除嗎？</p>
      <div class="row">
        <button class="ghost" id="no" type="button">先不要</button>
        <button class="danger" id="yes" type="button">確定清除</button>
      </div>
    </div>
    <p class="msg" id="resetMsg" aria-live="polite"></p>
  </section>
</div>
<script>
const SUPABASE_URL = "https://wbxpqyrkgdaqvtsmijoe.supabase.co";
const SUPABASE_KEY = "sb_publishable_04ZnsTSBxbREalRf2NWfeA_L1rzM9V4";
const $ = id => document.getElementById(id);
let PASS = '', CODES = [];
const say = (id, t, cls) => { $(id).textContent = t; $(id).className = 'msg ' + (cls || ''); };

async function rpc(fn, args){
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method:'POST',
    headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(args) });
  const body = await r.json().catch(()=>null);
  if(!r.ok){ const e = new Error((body && body.message) || r.status); e.wrong = String(e.message).includes('wrong password'); throw e; }
  return body;
}
const fmt = t => t ? new Date(t).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderCodes(){
  const on = CODES.filter(c=>c.active).length;
  $('stats').innerHTML = `<span><b>${on}</b>組可用</span><span><b>${CODES.length - on}</b>組停用</span><span><b>${CODES.filter(c=>c.last_seen).length}</b>組用過</span>`;
  $('tbody').innerHTML = CODES.map(c => `
    <tr class="${c.active?'':'off'}" data-code="${c.code}">
      <td class="code">${c.code}</td>
      <td><input value="${esc(c.label||'')}" maxlength="20" aria-label="${c.code} 的備註"></td>
      <td><span class="pill ${c.active?'on':'off'}">${c.active?'可用':'停用'}</span></td>
      <td>${fmt(c.last_seen)}</td>
      <td class="act"><div class="acts"><button type="button" data-act="toggle" class="small ${c.active?'danger':'ghost'}">${c.active?'停用':'恢復'}</button>${c.active?` <button type="button" data-act="reissue" class="small ghost" title="代碼外流時用：舊代碼停用，給同一位學生一組新代碼">換新代碼</button>`:''}</div></td>
    </tr>`).join('');
}
async function loadCodes(){ CODES = await rpc('admin_list_codes', { p_pass: PASS }); renderCodes(); }

async function saveCode(code, patch){
  const c = CODES.find(x=>x.code===code); Object.assign(c, patch);
  await rpc('admin_update_code', { p_pass: PASS, p_code: code, p_label: c.label || '', p_active: c.active });
}

$('login').addEventListener('submit', async e => {
  e.preventDefault(); PASS = $('pass').value; $('loginBtn').disabled = true; say('loginMsg','確認中…');
  try{
    await loadCodes();
    $('login').hidden = true; $('codes').hidden = false; $('reset').hidden = false; $('records').hidden = false;
    try{ sessionStorage.setItem('bz_tpass', PASS); }catch(e){}
  }catch(err){ say('loginMsg', err.wrong ? '密碼不對，請再試一次。' : '讀取失敗：' + err.message, 'err'); }
  $('loginBtn').disabled = false;
});

$('tbody').addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  const code = b.closest('tr').dataset.code, c = CODES.find(x=>x.code===code);
  if(b.dataset.act === 'reissue'){
    if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = '再按一次確定'; return; }
    b.disabled = true;
    try{ const nc = await rpc('admin_reissue_code', { p_pass: PASS, p_code: code }); await loadCodes();
      say('codeMsg', `${code} 已停用，新代碼是 ${nc}${c.label ? '（' + c.label + '）' : ''}，在表格最下面。`, 'ok'); }
    catch(err){ say('codeMsg','換新失敗：' + err.message + '（請先在 Supabase 執行 session_codes.sql）','err'); b.disabled = false; }
    return;
  }
  b.disabled = true;
  try{ await saveCode(code, { active: !c.active }); renderCodes(); say('codeMsg', `${code} 已${c.active?'恢復':'停用'}`, 'ok'); }
  catch(err){ say('codeMsg','儲存失敗：' + err.message,'err'); b.disabled = false; }
});
$('tbody').addEventListener('change', async e => {
  if(e.target.tagName !== 'INPUT') return;
  const code = e.target.closest('tr').dataset.code;
  try{ await saveCode(code, { label: e.target.value.trim() }); say('codeMsg', `${code} 備註已儲存`, 'ok'); }
  catch(err){ say('codeMsg','儲存失敗：' + err.message,'err'); }
});
$('tbody').addEventListener('keydown', e => { if(e.key==='Enter' && e.target.tagName==='INPUT') e.target.blur(); });

$('addBtn').addEventListener('click', async () => {
  const n = Math.max(1, Math.min(200, parseInt($('addN').value,10) || 0));
  $('addBtn').disabled = true; say('codeMsg','新增中…');
  try{ await rpc('admin_add_codes', { p_pass: PASS, p_n: n }); await loadCodes(); say('codeMsg', `已新增 ${n} 組代碼，在表格最下面。`, 'ok'); }
  catch(err){ say('codeMsg','新增失敗：' + err.message,'err'); }
  $('addBtn').disabled = false;
});

$('copyBtn').addEventListener('click', async () => {
  const text = CODES.filter(c=>c.active).map(c => c.label ? `${c.code}\t${c.label}` : c.code).join('\n');
  try{ await navigator.clipboard.writeText(text); say('codeMsg','已複製，可以貼到 Excel 或 LINE。','ok'); }
  catch(err){ say('codeMsg','複製失敗，請手動選取表格。','err'); }
});

$('go').addEventListener('click', () => {
  const opt = $('which').selectedOptions[0];
  $('confirmText').textContent = $('which').value === 'all' ? '確定要清除「全部遊戲」的排行榜嗎？' : `確定要清除「${opt.textContent}」的排行榜嗎？`;
  $('go').hidden = true; $('confirm').hidden = false; say('resetMsg','');
});
$('no').addEventListener('click', () => { $('confirm').hidden = true; $('go').hidden = false; });
$('yes').addEventListener('click', async () => {
  $('yes').disabled = true; $('no').disabled = true; say('resetMsg','清除中…');
  const w = $('which').value;
  try{
    const n = w === 'all' ? await rpc('admin_reset', { p_pass: PASS }) : await rpc('admin_reset_game', { p_pass: PASS, p_game: w });
    if(w !== 'all') await rpc('admin_reset_plays', { p_pass: PASS, p_game: w }).catch(()=>{});   // 遊玩次數也一起清
    say('resetMsg', `清除完成，共備份並清除 ${n} 筆成績。`, 'ok');
  }
  catch(err){ say('resetMsg', err.wrong ? '密碼不對。' : '清除失敗：' + err.message, 'err'); }
  $('confirm').hidden = true; $('go').hidden = false; $('yes').disabled = false; $('no').disabled = false;
});
</script>
</body>
</html>
