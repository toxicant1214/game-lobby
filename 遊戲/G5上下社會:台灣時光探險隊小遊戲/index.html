<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台灣時光探險隊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 全螢幕遊戲。封面→選角→時光基地→章節 360° 環景（上方羅盤、右上工具、左下夥伴）→ 視覺小說對話、背包、線索本、寶物櫃、對決。單一夜空深色世界 */
:root{
  --night:#0d1220; --night-2:#151d33; --glass:rgba(13,18,32,.82); --glass-2:rgba(20,27,46,.96);
  --paper:#f4ead2; --paper-dim:#bfb59c; --brass:#d9a441; --brass-hi:#f6cf73; --brass-deep:#8a6220;
  --jade:#58b48a; --cinnabar:#d0503a; --sky:#7fd3ff; --line:rgba(217,164,65,.38);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass-hi);outline-offset:3px;}
input{-webkit-user-select:text;user-select:text;}
.screen{position:fixed;inset:0;}
.kicker{font-size:13px;letter-spacing:.45em;color:var(--brass-hi);font-weight:700;}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:16px;color:#2a1a04;background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 4px 0 var(--brass-deep);}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brass-deep);}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--line);box-shadow:none;}
.btn.jade{background:linear-gradient(180deg,#7fd8ae,var(--jade));color:#062216;box-shadow:0 4px 0 #2f7354;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
@keyframes idle{0%,100%{transform:scale(1,1) rotate(0)}50%{transform:scale(1.008,1.018) rotate(-.4deg)}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}

/* ---------- 封面 ---------- */
#cover .bg{position:absolute;inset:-3%;background-size:cover;background-position:center 35%;animation:drift 24s ease-in-out infinite alternate;}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.1) translate(-1%,-1%);}}
#cover .glow{position:absolute;left:50%;top:34%;width:46vmin;height:46vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,226,150,.55),rgba(127,211,255,.15) 45%,transparent 70%);mix-blend-mode:screen;animation:breathe 4s ease-in-out infinite;pointer-events:none;}
@keyframes breathe{50%{opacity:.55;transform:translate(-50%,-50%) scale(1.08);}}
#sparks{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;}
#cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(9,12,22,.85) 78%,rgba(9,12,22,.97));}
.cover-ui{position:absolute;left:0;right:0;bottom:0;display:grid;justify-items:center;gap:14px;text-align:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(6vh + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
.game-title{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(44px,8.5vw,104px);line-height:1;letter-spacing:.08em;padding-left:.08em;background:linear-gradient(180deg,#fff3cf 0%,var(--brass-hi) 45%,var(--brass) 70%,#9c6c1f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(60,35,5,.9)) drop-shadow(0 0 24px rgba(246,207,115,.35));}
.tagline{font-size:clamp(14px,2vw,18px);opacity:.85;margin:0;}
.go{position:relative;margin-top:10px;border:0;border-radius:999px;padding:16px 46px;font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.2em;color:#2a1a04;background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 6px 0 var(--brass-deep),0 0 30px rgba(246,207,115,.5);}
.go::after{content:"";position:absolute;inset:-6px;border-radius:999px;border:2px solid rgba(246,207,115,.6);animation:ring 2s ease-out infinite;}
@keyframes ring{from{opacity:1;transform:scale(.96)}to{opacity:0;transform:scale(1.18)}}
.foot{font-size:12px;color:var(--paper-dim);letter-spacing:.1em;}
#flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#fff 0%,#fff6d8 30%,rgba(127,211,255,.9) 60%,transparent 100%);opacity:0;pointer-events:none;z-index:90;}
#flash.on{animation:flash 1.1s ease-in forwards;}
#flash.off{animation:unflash .7s ease-out forwards;}
@keyframes flash{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.6)}100%{opacity:1;transform:scale(3)}}
@keyframes unflash{from{opacity:1}to{opacity:0}}

/* ---------- 選角 ---------- */
#pick{background:radial-gradient(ellipse at 50% 70%,#2a3352 0%,var(--night) 70%);}
#pick .bg{position:absolute;inset:0;background-size:cover;background-position:center 35%;opacity:.22;filter:blur(6px) saturate(1.2);}
.pick-head{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:3;padding:0 16px;}
.pick-head h2{margin:4px 0 0;font-family:var(--f-display);font-weight:900;font-size:clamp(24px,3.4vw,38px);}
.stage{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);align-items:end;padding:118px max(16px,env(safe-area-inset-right,0px)) calc(140px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
.hero-wrap{grid-column:2;position:relative;height:100%;display:flex;justify-content:center;align-items:flex-end;}
.pedestal{position:absolute;bottom:-14px;width:min(360px,80%);height:60px;border-radius:50%;background:radial-gradient(ellipse,rgba(246,207,115,.55),rgba(217,164,65,.15) 50%,transparent 72%);}
.pedestal::before{content:"";position:absolute;inset:18% 8%;border-radius:50%;border:2px solid rgba(246,207,115,.55);animation:spin 12s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.hero{position:relative;height:100%;max-height:78vh;display:flex;align-items:flex-end;transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .25s;}
.hero.out-l{transform:translateX(-60px);opacity:0;}
.hero.out-r{transform:translateX(60px);opacity:0;}
.hero img{height:100%;width:auto;max-width:none;transform-origin:50% 100%;animation:idle 3.6s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(0,0,0,.55));}
.hero.cheer img{animation:cheer .6s ease-out 1,idle 3.6s ease-in-out .6s infinite;}
@keyframes cheer{30%{transform:translateY(-22px) scale(1.03,.97)}60%{transform:translateY(0) scale(.98,1.03)}}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--glass);display:grid;place-items:center;}
.arrow svg{width:24px;height:24px;}
#prev{left:max(16px,env(safe-area-inset-left,0px));}
#next{right:max(16px,env(safe-area-inset-right,0px));}
.info{position:relative;z-index:6;max-height:calc(100% - 8px);overflow:auto;grid-column:3;align-self:center;justify-self:start;width:min(320px,100%);background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px;margin-left:8px;}
.info .type{font-family:var(--f-display);font-weight:900;font-size:28px;}
.info .tag{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.15em;color:#2a1a04;background:var(--brass);padding:3px 10px;border-radius:4px;}
.info p{margin:0;font-size:15px;line-height:1.7;}
.stats{display:grid;gap:6px;}
.stat{display:grid;grid-template-columns:4.5em 1fr;align-items:center;gap:8px;font-size:13px;color:var(--paper-dim);}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-hi));border-radius:4px;}
.choose{border:0;border-radius:12px;padding:14px 28px;font-weight:900;font-family:var(--f-display);font-size:19px;letter-spacing:.1em;color:#2a1a04;background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 5px 0 var(--brass-deep);}
.roster{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(0deg,rgba(9,12,22,.95),rgba(9,12,22,.6) 70%,transparent);}
.chip{width:76px;height:96px;border-radius:12px;border:2px solid var(--line);background:linear-gradient(180deg,#26304e,#141a2c);overflow:hidden;padding:0;position:relative;}
.chip img{width:100%;height:auto;max-width:none;position:absolute;left:0;top:-4px;}
.chip.on{border-color:var(--brass-hi);box-shadow:0 0 0 3px rgba(246,207,115,.35);transform:translateY(-4px);}
.chip .n{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:700;background:rgba(9,12,22,.8);padding:2px 0;}

/* ---------- 通用彈窗 ---------- */
.veil{position:fixed;inset:0;z-index:60;background:rgba(6,8,16,.72);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));}
.panel{width:min(640px,100%);max-height:calc(100% - 16px);overflow:auto;background:linear-gradient(180deg,#1d2640,#121828);border:2px solid var(--brass-deep);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.6);padding:20px;display:grid;gap:14px;animation:pop .3s cubic-bezier(.2,.9,.3,1.3);}
.panel h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:26px;text-wrap:balance;}
.panel p{margin:0;font-size:16px;line-height:1.8;}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:20px;line-height:1;flex:none;}
.namecard{grid-template-columns:140px minmax(0,1fr);}
.namecard .por img{width:100%;height:auto;animation:idle 3.6s ease-in-out infinite;transform-origin:50% 100%;}
.namecard .body{display:grid;gap:12px;align-content:start;min-width:0;}
.field{display:grid;gap:6px;font-size:14px;color:var(--paper-dim);}
.field input{font:inherit;font-size:22px;font-weight:700;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.35);color:var(--paper);min-width:0;}
.err{color:#ff9d8a;font-size:13px;min-height:1em;}
.dice{justify-self:start;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;}

/* ---------- 時光基地 ---------- */
#hub .bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;filter:brightness(.55) saturate(1.1);}
#hub .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,12,22,.5),rgba(9,12,22,.2) 40%,rgba(9,12,22,.9));}
.hub-ui{position:absolute;inset:0;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px;align-content:start;justify-items:center;}
.hub-top{width:min(1100px,100%);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.me{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 14px 8px 8px;}
.me img{width:52px;height:52px;object-fit:cover;object-position:50% 8%;border-radius:12px;background:#26304e;}
.me b{display:block;font-family:var(--f-display);font-size:18px;}
.me span{font-size:12px;color:var(--paper-dim);}
.hub-top .sp{flex:1;}
.hub-tools{display:flex;gap:8px;flex-wrap:wrap;}
.tool{height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--glass);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;}
.tool svg{width:20px;height:20px;flex:none;}
.tool .badge{background:var(--cinnabar);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:700;}
.tool[aria-pressed="true"]{background:var(--brass);color:#2a1a04;}
.hub-title{text-align:center;display:grid;gap:4px;margin-top:6px;}
.hub-title h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4vw,44px);}
.eras{width:min(1100px,100%);display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.era{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#141a2c;aspect-ratio:3/4;max-width:100%;padding:0;text-align:left;}
.era .im{position:absolute;inset:0;background-size:cover;background-position:center;}
.era .tx{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(0deg,rgba(9,12,22,.95),rgba(9,12,22,.4) 70%,transparent);display:grid;gap:2px;}
.era .tx b{font-family:var(--f-display);font-size:19px;}
.era .tx span{font-size:12px;color:var(--paper-dim);}
.era.locked .im{filter:grayscale(1) brightness(.35);}
.era.locked{cursor:default;}
.era .lock{position:absolute;top:10px;right:10px;font-size:11px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:999px;color:var(--paper-dim);}
.era.sel{outline:3px solid var(--brass-hi);outline-offset:2px;transform:translateY(-3px);}
.era.open:not(.sel){opacity:.82;}
.era.open{border-color:var(--brass-hi);box-shadow:0 0 0 3px rgba(246,207,115,.25),0 0 26px rgba(246,207,115,.3);}
.era .prog{position:absolute;top:10px;left:10px;font-size:11px;background:var(--brass);color:#2a1a04;padding:3px 8px;border-radius:999px;font-weight:700;}
.chapters{width:min(1100px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.chap{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:10px;}
.chap .th{width:96px;height:72px;border-radius:10px;background-size:cover;background-position:center;}
.chap b{font-family:var(--f-display);font-size:17px;display:block;}
.chap span{font-size:12px;color:var(--paper-dim);}
.chap .st{color:var(--brass-hi);letter-spacing:2px;font-size:13px;}
.chap.locked{opacity:.45;}
.battle-card{width:min(1100px,100%);display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(208,80,58,.25),var(--glass));border:1px solid rgba(208,80,58,.5);border-radius:16px;padding:12px 16px;}
.battle-card b{font-family:var(--f-display);font-size:19px;}
.battle-card .sp{flex:1;min-width:160px;}
.battle-card span{font-size:13px;color:var(--paper-dim);display:block;}

/* ---------- 章節環景 ---------- */
#play{background:#000;}
#pano{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;}
#pano.drag{cursor:grabbing;}
#strip{position:absolute;left:0;top:0;will-change:transform;display:flex;}
#strip .seg{position:relative;flex:none;height:100%;}
#strip .seg img{display:block;height:100%;width:auto;max-width:none;pointer-events:none;-webkit-user-drag:none;}
#pano::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 18%,transparent 70%,rgba(0,0,0,.55));}
.hs{position:absolute;transform:translate(-50%,-100%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;}
.hs .nm{font-size:13px;font-weight:700;background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap;}
.hs .bub{min-width:42px;height:42px;border-radius:21px;display:grid;place-items:center;background:var(--glass);border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.5);padding:0 6px;}
.hs .bub svg{width:20px;height:20px;}
.hs .stem{width:2px;height:12px;background:rgba(255,255,255,.85);}
.hs.new .bub{background:var(--brass-hi);color:#2a1a04;border-color:#fff;animation:pulse 1.8s ease-in-out infinite;}
.hs.new .bub b{font-size:22px;font-weight:900;line-height:1;}
.hs.obj .bub{border-radius:12px;}
.hs.obj.new .bub{background:var(--jade);color:#fff;}
.hs.hidden{opacity:0;pointer-events:none;}
.hs.hidden.sniffed{opacity:1;pointer-events:auto;animation:sniffin .6s ease-out;}
.hs.hidden.sniffed .bub{background:#b98cff;color:#fff;}
.hs.glint{opacity:.55;pointer-events:auto;}
.hs.glint .bub{width:22px;min-width:22px;height:22px;background:rgba(255,240,200,.25);border:1px solid rgba(255,240,200,.6);animation:twinkle 2.4s ease-in-out infinite;}
.hs.glint .bub svg,.hs.glint .nm,.hs.glint .stem{display:none;}
@keyframes twinkle{50%{transform:scale(1.4);opacity:.3}}
@keyframes sniffin{from{transform:translate(-50%,-80%) scale(.5);opacity:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(246,207,115,.7)}50%{box-shadow:0 0 0 14px rgba(246,207,115,0)}}

.hud-l{position:fixed;z-index:20;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:min(340px,calc(100vw - 24px));display:grid;gap:8px;}
.quest{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;}
.quest .t{display:flex;align-items:center;gap:10px;}
.quest .seal{flex:none;width:40px;height:40px;border-radius:8px;background:var(--cinnabar);color:#fff4e0;font-family:var(--f-display);font-weight:900;font-size:12px;line-height:1.1;display:grid;place-items:center;text-align:center;}
.quest h3{margin:0;font-family:var(--f-display);font-size:18px;line-height:1.25;}
.quest .era-l{font-size:11px;color:var(--brass-hi);letter-spacing:.1em;font-weight:700;}
.quest .mini{margin-left:auto;flex:none;border:1px solid var(--line);background:none;border-radius:6px;font-size:12px;padding:3px 8px;}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:5px;}
.goals li{display:flex;gap:8px;font-size:14px;line-height:1.45;color:var(--paper-dim);}
.goals li i{flex:none;width:15px;height:15px;margin-top:3px;border-radius:4px;border:2px solid var(--paper-dim);display:grid;place-items:center;font-style:normal;font-size:10px;}
.goals li.done{opacity:.5;text-decoration:line-through;}
.goals li.done i{background:var(--jade);border-color:var(--jade);color:#062216;}
.goals li.now{color:var(--paper);font-weight:700;}
.goals li.now i{border-color:var(--brass-hi);}
.quest:not(.full) .goals li:not(.now){display:none;}
.quest .cnt{font-size:12px;color:var(--paper-dim);}
.hud-r{position:fixed;z-index:20;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 380px);}
.compass{position:fixed;z-index:19;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));width:min(340px,40vw);height:34px;border-radius:17px;background:var(--glass);border:1px solid var(--line);overflow:hidden;}
.compass .tape{position:absolute;inset:0;}
.compass .tick{position:absolute;top:6px;font-size:11px;color:var(--paper-dim);transform:translateX(-50%);font-weight:700;}
.compass .dot{position:absolute;top:22px;width:8px;height:8px;border-radius:50%;background:var(--brass-hi);transform:translateX(-50%);box-shadow:0 0 6px var(--brass-hi);}
.compass .dot.obj{background:var(--jade);box-shadow:0 0 6px var(--jade);}
.compass .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--cinnabar);transform:translateX(-50%);}
.pan-btn{position:fixed;z-index:12;top:50%;transform:translateY(-50%);width:46px;height:66px;border-radius:12px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;}
.pan-btn svg{width:22px;height:22px;}
#pl{left:max(10px,env(safe-area-inset-left,0px));}
#pr{right:max(10px,env(safe-area-inset-right,0px));}

  {t:"觀察溪邊的臺灣山椒魚和櫻花鉤吻鮭",c:["c:iceage","f:salmon"],h:"溪邊的石頭上趴著一隻山椒魚，溪水裡還有粉紅色斑紋的魚。兩個都點點看。"},
  {t:"找回時光門碎片",c:["f:shardgot"],h:"遠方有一座傾倒、發光的銅環。碎片好像被土埋住了，你的鹿夥伴或許幫得上忙。"},
  {t:"把碎片嵌回時光門",c:["f:done"],h:"打開背包，把「時光門碎片」拿在手上，再點傾倒的銅環。"}
 ],
 spots:[
  {id:"hunter",name:"阿岩",role:"冰河時期的獵人",por:"hunter",s:"a",x:15,y:28,
   talks:[
    {if:["!f:hunter"],lines:[["hunter","嗯？你穿的衣服好奇怪……你也是跟著鹿群走過來的嗎？"],["hunter","這幾年天氣越來越冷。原本是大海的地方，海水一直退、一直退，最後變成這一大片平原。"],["hunter","我們跟著鹿和野牛，一路往東邊那座高山走。聽說那裡的森林有很多食物。"]],
     ask:{q:"阿岩他們為什麼可以「用走的」走到臺灣？",say:"你知道為什麼這裡變成陸地嗎？",o:[
      {t:"冰河時期海平面下降，臺灣和亞洲大陸連在一起",ok:true,r:"原來是這樣！海水變少，海底露出來，就變成可以走的陸地了。"},
      {t:"有人在海上蓋了一座大橋",r:"這麼長的橋？我們只會用石頭和木頭，蓋不出來啦！"},
      {t:"海水結冰，大家踩在冰上走過去",r:"不是冰喔！是海水變少、海平面下降，海底露出來了。"}]},
     fx:{set:["hunter"]},after:[["hunter","我女兒小禾好像在找什麼東西，你可以去問問她嗎？"]]},
    {if:[],lines:[["hunter","等天氣暖一點，我們要在東邊的山腳住下來。"]]}
   ]},
  {id:"he",name:"小禾",role:"阿岩的女兒",s:"a",x:36,y:44,
   talks:[
    {if:["!f:hunter"],lines:[["he","你好！我爸爸是帶頭的，你先去找他吧！"]]},
    {if:["f:hunter","!f:askfawn"],lines:[["he","嗚嗚……我照顧的鹿寶寶不見了！"],["he","剛剛鹿群經過的時候，牠被嚇到，一溜煙往溪邊跑掉了。牠還很小，自己會餓壞的！"],["你","別擔心，我幫你找！"]],fx:{set:["askfawn"]}},
    {if:["pet"],lines:[["he","鹿寶寶好像很喜歡你耶！那……牠就跟著你吧，要好好照顧牠喔！"]]},
    {if:[],lines:[["he","溪邊那裡有好多草叢，牠可能躲在裡面。"]]}
   ]},
  {id:"fawn",name:"鹿寶寶",role:"走失的小鹿",kind:"obj",s:"a",x:88,y:58,show:["f:askfawn","!pet"],
   talks:[
    {if:["!f:fawnfound"],lines:[["旁白","草叢裡縮著一隻小小的鹿寶寶，全身發抖。"],["旁白","你伸出手，牠聞了聞，肚子「咕嚕──」叫了一聲。牠好像餓到走不動了。"]],fx:{set:["fawnfound"]}},
    {if:[],lines:[["旁白","鹿寶寶餓得沒力氣。找點吃的，用背包拿給牠吧！"]]}
   ],
   gives:[{item:"berry",lines:[["旁白","鹿寶寶大口大口吃著野莓，吃完還舔了舔你的手。"],["旁白","牠站起來，在你腳邊繞了一圈，好像決定要跟著你了！"]],fx:{take:["berry"],pet:"join"},
     after:[["教授","太好了！動物和人一樣，都是在冰河時期，從這片陸地走到臺灣的。牠的鼻子很靈，說不定能幫你找東西。"],["教授","以後撿到食物，可以餵{pet}吃，牠會越長越大喔！點左下角的{pet}就能照顧牠。"]]}],

  {id:"bush",name:"野莓灌木",role:"",kind:"obj",s:"b",x:31,y:46,

    {if:["!f:berry"],lines:[["旁白","灌木上結滿了紅紅的野莓。史前的人會「採集」這種野果當食物。"]],fx:{give:["berry*4"],set:["berry"]}},
    {if:[],lines:[["旁白","野莓已經摘得差不多了。"]]}
   ]},
  {id:"sala",name:"臺灣山椒魚",role:"",kind:"obj",s:"b",x:16,y:62,
   talks:[
    {if:["!c:iceage"],lines:[["旁白","溪邊的石頭上，趴著一隻黑褐色、帶著斑點的小動物。"],["教授","那是臺灣山椒魚！牠和溪裡粉紅色斑紋的櫻花鉤吻鮭，都是很怕熱的動物。"]],
     ask:{q:"臺灣山椒魚和櫻花鉤吻鮭，是什麼時候來到臺灣的？",by:"教授",say:"你猜猜看？",o:[
      {t:"冰河時期，臺灣和亞洲大陸相連的時候",ok:true,r:"答對！冰河時期很冷，牠們就跟著寒冷的環境來到臺灣了。"},
      {t:"很久以後，被人放進溪裡的",r:"不是喔，牠們在臺灣已經住了好久好久，比人類寫下歷史還早。"},
      {t:"牠們是從天上掉下來的",r:"哈哈，動物可不會從天上掉下來！再想想。"}]},
     fx:{card:"iceage"}},
    {if:[],lines:[["旁白","山椒魚一動也不動，好像在曬太陽。"]]}
   ]},
  {id:"salmon",name:"櫻花鉤吻鮭",role:"",kind:"obj",s:"b",x:62,y:68,
   talks:[
    {if:["!f:salmon"],lines:[["旁白","冰涼的溪水裡，幾條身上有粉紅色斑紋的魚游來游去。"],["教授","後來冰河時期結束，天氣變暖，牠們就搬到涼快的地方住了。"]],
     ask:{q:"現在臺灣山椒魚和櫻花鉤吻鮭，主要住在臺灣的哪裡？",by:"教授",say:"怕熱的牠們，會搬去哪裡呢？",o:[
      {t:"高山地區",ok:true,r:"沒錯！高山比較涼快，牠們現在主要生活在臺灣的高山。"},
      {t:"西部沿海地區",r:"海邊太熱了，牠們受不了喔。"},
      {t:"南部熱帶地區",r:"熱帶更熱啦！怕熱的牠們會往涼快的地方去。"}]},
     fx:{set:["salmon"]}},
    {if:[],lines:[["旁白","魚兒在清澈的溪水裡一閃一閃。"]]}
   ]},
  {id:"snowberry",name:"雪地裡的果子",role:"",kind:"obj",hidden:true,s:"a",x:70,y:72,
   talks:[{if:["!f:snowberry"],lines:[["旁白","{pet}從雪堆裡拱出一小串野莓！"]],fx:{give:["berry*2"],set:["snowberry"]}},{if:[],lines:[["旁白","雪地上只剩下{pet}的腳印。"]]}]},
  {id:"gate",name:"傾倒的銅環",role:"時光門殘骸",kind:"obj",s:"b",x:82,y:28,
   talks:[
    {if:["!pet"],lines:[["旁白","古老的銅環半埋在土裡。下面壓著什麼東西，正在發出金色的光。"],["旁白","可是土又冷又硬，用手挖不動……要是有鼻子很靈、很會拱土的幫手就好了。"]]},
    {if:["pet","!f:shardgot"],lines:[["旁白","{pet}在銅環旁邊聞來聞去，突然用鼻子拼命拱土──"],["旁白","一片閃著金光的碎片露了出來！"]],fx:{give:["shard1"],set:["shardgot"]},
     after:[["教授","是時光門碎片！打開背包，把碎片「拿在手上」，再點一下銅環，把它嵌回去。"]]},
    {if:[],lines:[["旁白","銅環上有一個缺口，形狀剛好跟碎片一樣。"]]}
   ],
   gives:[{item:"shard1",lines:[["旁白","你把碎片對準缺口，「喀」一聲嵌了進去。銅環一下子亮了起來！"],["教授","太好了，第一片碎片找回來了！"],["教授","你知道嗎？大約一萬多年前，天氣慢慢變暖，海平面又上升了。"]],
     ask:{q:"天氣變暖、海平面上升以後，這片大平原會變成什麼？",by:"教授",say:"想像一下……",o:[
      {t:"被海水淹沒，臺灣和周圍的島嶼變成今天的樣子",ok:true,r:"答對了！臺灣就這樣變成四面環海的島嶼。"},
      {t:"變成一大片沙漠",r:"海水上升，應該是變成海，不是沙漠喔。"},
      {t:"一直都是陸地，不會改變",r:"海平面上升以後，低的地方就會被海水淹沒了。"}]},
     fx:{take:["shard1"],card:["island","noword"],done:true}}],
   wrong:[["旁白","銅環上的缺口形狀，和「{item}」對不起來。"]]}
 ],
 outro:[["教授","時光門亮了！它要把你送去下一個時代。"],["教授","對了，史前時期沒有文字，所以我們都是靠挖掘遺址、找到的東西來了解古人。準備好囉──三萬年前，臺東的海邊！"]],
},

{id:"ch2",seal:"第二章",title:"海邊洞穴的火光",pano:"ch2",start:{s:"a",x:40},
 music:{root:98,scale:[0,2,3,7,8],tempo:820,wave:"triangle"},
 intro:[
  ["旁白","一陣浪花聲。{name}睜開眼睛，眼前是一座長滿綠樹的大海崖，崖壁上有好幾個大洞穴。"],
  ["教授","這裡是臺東長濱的「八仙洞」，大約三萬年前就有人住在這裡。這是臺灣的「舊石器時期」。"],
  ["教授","那時候還不會種田、也不會蓋房子喔。去看看他們怎麼過生活吧！"]
 ],
 goals:[
  {t:"和洞口敲石頭的阿石打招呼",c:["f:met"],h:"洞口前坐著一個正在敲石頭的少年，去跟他打招呼。"},
  {t:"到海邊撿一顆硬石頭",c:["f:gotstone"],h:"轉身看向大海，沙灘上有很多圓圓的石頭。撿一顆起來。"},
  {t:"跟阿石學「敲打」石器",c:["f:made"],h:"打開背包，把「硬石頭」拿在手上，再點阿石。"},
  {t:"幫捕魚的少年處理他的魚",c:["f:fish"],h:"海邊有個拿木矛捕魚的少年，他好像需要一把鋒利的工具。把「打製石器」拿給他。"},
  {t:"請火堆旁的阿嬤烤魚",c:["f:roast"],h:"洞口左邊的火堆旁有一位阿嬤。把「魚」拿給她。"},
  {t:"拿火把探索洞穴深處",c:["f:done"],h:"洞穴深處有一點金光。把「火把」拿在手上，點洞穴深處。"}
 ],
 spots:[
  {id:"ashi",name:"阿石",role:"住在八仙洞的少年",por:"stone",s:"a",x:41,y:44,
   talks:[
    {if:["!f:met"],lines:[["ashi","哇，你是從哪裡來的？你身上那個會發光的圓圓東西是什麼？"],["ashi","我們一家都住在八仙洞裡。這裡離海很近，喝水、捕魚都很方便，下雨颳風也能躲進來。"]],
     ask:{q:"阿石他們為什麼選擇住在海邊的洞穴？",say:"你猜猜看，我們為什麼住這裡？",o:[
      {t:"取水方便、能遮風避雨，又能就近到海邊捕魚",ok:true,r:"對啊！洞穴就是我們天然的家。"},
      {t:"因為洞穴裡比較好種田",r:"種田？我們不會種田耶，食物都是從大自然找來的。"},
      {t:"因為洞穴裡已經有蓋好的房子",r:"這裡沒有房子啦，就是大自然的山洞喔。"}]},
     fx:{set:["met"]},after:[["ashi","你想學做石器？好啊！先去海邊撿一顆夠硬的石頭來給我。"]]},
    {if:["f:made"],lines:[["ashi","那把石器很好用吧？海邊那個捕魚的阿浪，剛剛好像在找刀子。"]]},
    {if:[],lines:[["ashi","海邊的沙灘上有很多石頭，挑一顆最硬的！"]]}
   ],
   gives:[{item:"stone",if:["f:met"],lines:[["ashi","這顆石頭很硬，不錯！"]],
     ask:{q:"要怎麼讓這顆石頭變得鋒利，可以切東西？",by:"ashi",say:"你覺得要怎麼做？",o:[
      {t:"拿另一顆石頭用力敲打它，敲出鋒利的邊",ok:true,r:"沒錯！來，你自己試試看！"},
      {t:"放進火裡燒，讓它變軟",r:"石頭燒不軟啦！我們都是用敲的。"},
      {t:"泡在海水裡好幾天",r:"泡水不會變利喔，要動手才行！"}]},
     fx:{craft:{mode:"tap",from:"stone",to:"chopper",take:"stone",title:"敲出一把石器"},set:["made"]},

    {if:[],lines:[["granny","洞穴最深的地方，好像一直有東西在發光……"]]}

    {if:[],lines:[["旁白","海浪一直把石頭沖上岸。"]]}

  {id:"bush2",name:"結果子的灌木",role:"",kind:"obj",s:"b",x:84,y:46,

Object.assign(CARDS,{
  formosa:{ch:"s1",name:"福爾摩沙",kind:"大航海時代",year:"十六世紀",text:"十六世紀，葡萄牙人的船經過臺灣附近，看到島上山林青翠，讚嘆這是「美麗之島」（Ilha Formosa）。後來歐洲人就用「福爾摩沙」來稱呼臺灣。",key:"<b>福爾摩沙</b>＝<b>美麗之島</b>，是歐洲人對臺灣的稱呼。"},
  location:{ch:"s1",name:"臺灣的重要位置",kind:"地理位置",year:"十六、十七世紀",text:"十五世紀末起，歐洲人開闢新航路，來到亞洲尋找香料、絲綢、瓷器和茶葉等商品，這段時期叫做大航海時代。臺灣北邊是日本、西邊是中國、南邊是菲律賓和東南亞，剛好在東亞海上航線的中間，成為各國船隻往來的中繼站，也讓荷蘭、西班牙都想占領臺灣。",key:"臺灣位在<b>東亞航運要道</b>，成為各國爭奪的地方。"},
  hanfisher:{ch:"s1",name:"渡海來的漢人",kind:"漢人來臺",year:"荷蘭人來臺以前",text:"很早以前，中國東南沿海（像福建）的漢人就會渡過臺灣海峽，到澎湖和臺灣附近的海域捕魚，也有人到臺灣做買賣。後來，越來越多漢人移居到臺灣。",key:"漢人渡過<b>臺灣海峽</b>，到<b>澎湖、臺灣</b>附近<b>捕魚、做買賣</b>。"},
  eurotrade:{ch:"s1",hidden:true,name:"甲板上的香料",kind:"隱藏發現",year:"大航海時代",text:"木桶裡裝滿胡椒、丁香等香料。歐洲人吃肉需要香料調味，香料在歐洲非常昂貴，所以他們冒險航海到亞洲來買。",key:"歐洲人航海到亞洲，想買<b>香料、絲綢、瓷器</b>。"},
  dayuan:{ch:"s2",name:"荷蘭人來到大員",kind:"荷蘭統治",year:"1624 年",text:"荷蘭人為了和中國、日本做生意，先占領澎湖，被明朝軍隊趕走以後，在 1624 年轉到臺灣南部的大員（今臺南安平）建立據點，開始統治臺灣。",key:"荷蘭人<b>先占澎湖</b>，被明朝趕走後，<b>1624 年</b>來到<b>大員</b>。"},
  transit:{ch:"s2",name:"轉口貿易",kind:"經濟",year:"荷蘭時期",text:"荷蘭人把中國的生絲、瓷器，和臺灣出產的鹿皮、蔗糖，集中到大員，再轉運到日本、東南亞和歐洲去賣，賺取利潤。這種把貨物運來再運出去賣的方式，叫做「轉口貿易」。",key:"大員成為<b>轉口貿易</b>的中心：貨物<b>運進來、再轉賣出去</b>。"},
  zeelandia:{ch:"s2",name:"熱蘭遮城與普羅民遮城",kind:"古蹟",year:"荷蘭時期",text:"荷蘭人在大員建造熱蘭遮城（也有人稱熱蘭遮堡），作為統治和貿易的中心，就是今天的安平古堡。後來又在對岸的赤崁建了普羅民遮城，就是今天的赤崁樓。",key:"<b>熱蘭遮城</b>→今<b>安平古堡</b>；<b>普羅民遮城</b>→今<b>赤崁樓</b>。"},
  brick:{ch:"s2",hidden:true,name:"城牆的紅磚",kind:"隱藏發現",year:"荷蘭時期",text:"熱蘭遮城的城牆用紅磚一塊一塊砌起來。傳說工匠用糖水、糯米和蚵殼灰調成黏土來黏磚頭，所以城牆特別堅固。",key:"熱蘭遮城的城牆是<b>紅磚</b>砌成的。"},
  farming:{ch:"s3",name:"招募漢人來開墾",kind:"荷蘭統治",year:"荷蘭時期",text:"荷蘭人需要更多糧食和可以出口的商品，就從中國東南沿海招募漢人來臺灣開墾，種植稻米和甘蔗，還從外地引進耕牛，讓耕種更有效率。荷蘭人也向人民收稅。",key:"荷蘭人<b>招募漢人</b>來開墾、<b>引進耕牛</b>，種<b>稻米和甘蔗</b>。"},
  sugarmill:{ch:"s3",name:"蔗糖出口",kind:"經濟",year:"荷蘭時期",text:"甘蔗榨汁、熬煮以後就變成糖。荷蘭時期，臺灣生產的蔗糖被運到日本、波斯等地販賣，成為重要的出口商品。",key:"<b>蔗糖</b>是荷蘭時期臺灣重要的<b>出口商品</b>。"},
  deerskin:{ch:"s3",name:"鹿皮貿易",kind:"經濟",year:"荷蘭時期",text:"當時臺灣的平原上有很多梅花鹿。荷蘭人收購大量鹿皮，運到日本販賣。因為捕捉得太多，梅花鹿的數量越來越少。",key:"大量<b>鹿皮</b>運往<b>日本</b>，梅花鹿<b>越來越少</b>。"},
  guohuaiyi:{ch:"s3",name:"郭懷一事件",kind:"漢人反抗",year:"1652 年",text:"荷蘭人向漢人收很重的稅，管理又嚴格，許多漢人農民非常不滿。1652 年，郭懷一帶領漢人起來反抗荷蘭人，但很快就被鎮壓，很多人失去生命。",key:"<b>1652 年郭懷一事件</b>：漢人不滿荷蘭人<b>重稅</b>而反抗。"},
  mission:{ch:"s4",name:"傳教與學校",kind:"文化",year:"荷蘭時期",text:"荷蘭的傳教士來到臺灣傳播基督教，也設立學校，教當地居民讀書寫字。",key:"荷蘭人<b>傳教</b>、<b>設立學校</b>。"},
  xingangdoc:{ch:"s4",name:"新港文書",kind:"文化",year:"荷蘭時期起",text:"傳教士用羅馬拼音（羅馬字）來拼寫當地居民的語言，教大家讀寫。荷蘭人離開以後，當地居民還繼續用羅馬字和漢人訂土地契約，這些文件被稱為「新港文書」。",key:"用<b>羅馬拼音</b>拼寫當地語言＝<b>新港文書</b>。"},
  bell:{ch:"s4",hidden:true,name:"給牧師的紙條",kind:"隱藏發現",year:"荷蘭時期",text:"孩子們用剛學會的羅馬字寫了一張紙條：「給辛苦的牧師」。學會文字以後，大家就能把想說的話寫下來。",key:"學會<b>羅馬字</b>，就能把話<b>寫下來</b>。"},
  spain:{ch:"s5",name:"西班牙人占領北臺灣",kind:"西班牙統治",year:"1626 年",text:"西班牙人以菲律賓的馬尼拉為基地，和中國、日本做生意。看到荷蘭人占領臺灣南部，擔心航線被切斷，就在 1626 年來到臺灣北部的雞籠（今基隆），建立聖薩爾瓦多城，後來又到淡水建立聖多明哥城，也在北部傳教。",key:"<b>1626 年</b>西班牙人占領<b>北臺灣</b>（<b>雞籠、淡水</b>），<b>建城、傳教</b>。"},
  hongmao:{ch:"s5",name:"淡水的城堡",kind:"古蹟",year:"西班牙、荷蘭時期",text:"西班牙人在淡水建了聖多明哥城。後來荷蘭人在原來的地方重新建城，漢人叫荷蘭人「紅毛」，所以這座城被叫做「紅毛城」，現在還在淡水。",key:"淡水的<b>聖多明哥城</b>，後來成為<b>紅毛城</b>的所在地。"},
  dutchnorth:{ch:"s5",name:"荷蘭趕走西班牙",kind:"荷西爭霸",year:"1642 年",text:"1642 年，荷蘭人派軍隊北上，把西班牙人趕出臺灣北部。從此，荷蘭人的統治範圍擴大到臺灣北部。",key:"<b>1642 年</b>荷蘭人<b>趕走西班牙人</b>。"},
  sulfur:{ch:"s5",hidden:true,name:"山裡冒出的煙",kind:"隱藏發現",year:"大航海時代",text:"淡水附近的山上，常常冒出帶著臭雞蛋味道的白煙，那裡出產硫磺。硫磺可以做火藥，是當時很受歡迎的商品。",key:"北臺灣出產<b>硫磺</b>。"}
});

    {if:["!f:formosa"],lines:[["sailor","船長桌上那支望遠鏡，拿來給我看看嘛！"]]},
    {if:[],lines:[["sailor","Ilha Formosa！我回去一定要跟大家說，我看到了美麗之島！"]]}

     fx:{take:["spyglass"],set:["formosa"],card:"formosa"},after:[["sailor","船長最懂航海了，你可以去問問他，為什麼我們的船會經過這裡。"]]}],

  {id:"table",name:"船長的桌子",role:"",kind:"obj",s:"a",x:46,y:68,

    {if:[],lines:[["旁白","航海圖上畫著好多彎彎曲曲的海岸線。"]]}

  {id:"captain",name:"費南多船長",role:"葡萄牙船長",por:"captain",s:"a",x:84,y:26,

    {if:["!f:fisher"],lines:[["fisher","繩子！快幫我找條繩子！"]]},

     ask:{q:"阿海這些漢人，很早以前就渡過臺灣海峽來做什麼？",by:"fisher",say:"你猜我們來做什麼？",o:[
      {t:"到澎湖和臺灣附近捕魚、做買賣",ok:true,r:"沒錯！這片海的魚可多了，還可以做生意。"},

     fx:{take:["rope"],give:["roastfish*2"],set:["fisher"],card:"hanfisher"},after:[["fisher","烤魚送你吃！對了，剛才我看到你們的主桅杆下面，有東西在發藍光，怪怪的。"]]}],
   wrong:[["fisher","「{item}」綁不住船啦！我需要繩子。"]]},
  {id:"crate",name:"木箱",role:"",kind:"obj",s:"b",x:84,y:72,

    {if:[],lines:[["旁白","木箱裡只剩下漁網和玻璃浮球。"]]}

  {id:"isles",name:"遠方的小島",role:"",kind:"obj",s:"b",x:30,y:30,

  {id:"spice",name:"香料木桶",role:"",kind:"obj",hidden:true,s:"b",x:44,y:58,

  {id:"mast",name:"主桅杆",role:"",kind:"obj",s:"b",x:63,y:52,show:["f:fisher"],

    {if:["!f:done"],lines:[["旁白","你把纏在一起的繩子一圈一圈解開……一顆閃著藍光的寶石掉了出來！"],["教授","是時光寶石！還有四顆藏在這個時代的其他地方。"]],
     ask:{q:"這一章的冒險裡，歐洲人叫臺灣什麼？",by:"教授",say:"考考你：",o:[

,/* ======================= 第二章 大員的城堡 ======================= */
{id:"s2",era:"sea",seal:"第二章",title:"大員的城堡",pano:"s2",start:{s:"a",x:30},

  ["教授","這裡是 1630 年代的「大員」，就是今天的臺南安平。看到城牆上的三色旗了嗎？那是荷蘭的旗子。"],

     ask:{q:"荷蘭人為什麼會來到臺灣的大員？",by:"vander",say:"你記住了嗎？",o:[

      {t:"被西班牙人邀請來的",r:"西班牙人？他們是我們的對手耶！"}]},

      {t:"以物易物",r:"我們是用銀幣買賣的喔，而且是把貨物運進來再轉賣出去。"},
      {t:"自給自足",r:"自給自足是自己種、自己吃。我們可是做大生意的！"}]},
     fx:{take:["silk"],set:["trade"],card:"transit"}}],

  {id:"soldier",name:"守城士兵",role:"荷蘭士兵",s:"a",x:57,y:46,

     ask:{q:"荷蘭人建的熱蘭遮城，就是今天的哪一個古蹟？",by:"soldier",say:"你們未來的人，叫它什麼？",o:[

      {t:"紅毛城",r:"紅毛城在北部的淡水喔，不是這裡。"},
      {t:"億載金城",r:"那是很久以後別人蓋的砲台，不是我們的城堡。"}]},
     fx:{card:"zeelandia"}},
    {if:[],lines:[["soldier","我要好好守著城門！"]]}
   ]},
  {id:"ship",name:"荷蘭大帆船",role:"",kind:"obj",s:"a",x:88,y:42,

  {t:"找回第三顆時光寶石",c:["f:done"],h:"鹿皮商人說，鹿皮堆裡有怪怪的藍光。"}
 ],
 spots:[

    {if:["!f:plow"],lines:[["atian","如果有耕牛幫忙犁田，就快多了！"]]},

      {t:"從荷蘭搬來的農夫",r:"荷蘭人是來做生意、管理的，種田的大多是我們漢人啦。"},
      {t:"從日本來的武士",r:"武士會打仗，可不會種甘蔗喔！"}]},
     fx:{take:["cowrope"],set:["plow"],give:["sugarcane*4"],card:"farming"},after:[["atian","這些甘蔗送你！拿去右邊的糖廍，師傅可以把它做成糖。"]]}],
   wrong:[["atian","「{item}」不能幫我犁田啦……"]]},
  {id:"officer",name:"范霍文",role:"荷蘭官員",s:"a",x:56,y:24,

    {if:["f:plow","!f:ledgergot"],lines:[["officer","田越開越多，我的帳冊都寫滿了！稻米、蔗糖、鹿皮、稅金……這本舊帳冊就送你當紀念吧。"]],fx:{set:["ledgergot"],give:["ledger"]}},
    {if:[],lines:[["officer","這一季的蔗糖產量又增加了，公司一定會很滿意。"]]}

  {id:"mill",name:"糖廍師傅",role:"榨糖的師傅",s:"a",x:89,y:28,

    {if:["!c:deerskin"],lines:[["skinman","看看這些鹿皮！品質最好的梅花鹿皮，日本人最喜歡了，拿來做武士的盔甲和衣服。"],["skinman","荷蘭人跟我們收購，一年要運好幾萬張到日本去！"],["旁白","{pet}躲到你身後，耳朵往後貼，全身發抖。"],["你","……{pet}，別怕。"]],

      {t:"不會有任何影響",r:"一年好幾萬張鹿皮，影響可大了。"}]},
     fx:{card:["deerskin","sugarmill"]},after:[["教授","好消息是，現在的人已經開始保育梅花鹿，牠們又慢慢回到野外了。去餵{pet}吃點甘蔗，讓牠安心吧。"]]},
    {if:["!f:done"],lines:[["skinman","說到這個，鹿皮堆裡好像有個東西一直發藍光，嚇我一跳……"]]},

   ]},

     ask:{q:"荷蘭時期，臺灣的鹿皮主要被運到哪裡？",by:"教授",say:"考考你：",o:[

      {t:"美國",r:"當時的鹿皮主要是運到日本喔。"},
      {t:"南極",r:"南極？那裡可沒有人買鹿皮！"}]},
     fx:{give:["gem3"],done:true}},
    {if:[],lines:[["旁白","{pet}遠遠地看著鹿皮堆，不願意靠近。"]]}
   ]},
  {id:"grass",name:"遠方的草原",role:"",kind:"obj",s:"b",x:80,y:38,

  {id:"fawn2",name:"草叢裡的小鹿",role:"",kind:"obj",hidden:true,s:"b",x:88,y:70,

 ],

}
,/* ======================= 第四章 學校與新港文書 ======================= */
{id:"s4",era:"sea",seal:"第四章",title:"學校與新港文書",pano:"s4",start:{s:"a",x:30},
 music:{root:131,scale:[0,2,4,5,7,9,11],tempo:820,wave:"sine"},
 intro:[
  ["旁白","噹──噹──遠處傳來鐘聲。{name}來到一間白牆的小屋前，大樹下有幾個小孩正在寫字。"],
  ["教授","荷蘭人來臺灣，除了做生意，也派了傳教士來。我們去看看他們在做什麼。"]
 ],
 goals:[
  {t:"跟尤牧師打招呼",c:["f:met"],h:"大樹下拿著書、穿黑色長袍的人，就是尤牧師。"},
  {t:"幫牧師找回不見的鵝毛筆",c:["f:quillgot"],h:"牧師的筆被風吹走了。轉身看看另一邊的大樹下。"},
  {t:"把鵝毛筆還給牧師",c:["f:lesson"],h:"打開背包，把「鵝毛筆」拿在手上，再點尤牧師。"},
  {t:"聽小德說說他學會了什麼",c:["f:kid"],h:"舉著石板的男孩就是小德。"},
  {t:"幫阿田和長老寫下契約",c:["f:contract"],h:"轉身到大樹下，阿田和長老正在商量。把「鵝毛筆」交給阿田。"},
  {t:"找回第四顆時光寶石",c:["f:done"],h:"小德說學校屋簷下的鐘，昨天晚上一直發出藍光。"}
 ],
 spots:[
  {id:"pastor",name:"尤牧師",role:"荷蘭傳教士",por:"pastor",s:"a",x:22,y:20,
   talks:[
    {if:["!f:met"],lines:[["pastor","你好呀，小朋友！我是從荷蘭來的傳教士。"],["pastor","我們來到臺灣傳播基督教，也在這裡蓋了學校，教大家讀書、寫字。"]],
     ask:{q:"荷蘭的傳教士來到臺灣，除了傳教，還做了什麼？",by:"pastor",say:"你看看這裡，猜得出來嗎？",o:[
      {t:"設立學校，教當地居民讀書寫字",ok:true,r:"答對了！孩子們學得可快了。"},
      {t:"建立軍隊，跟西班牙人打仗",r:"打仗是士兵的工作，我是來教書的喔。"},
      {t:"開墾田地，種植甘蔗",r:"種甘蔗是阿田他們的事。我的工作在學校裡。"}]},
     fx:{set:["met"],card:"mission"},after:[["pastor","糟糕，我的鵝毛筆剛剛被風吹走了，沒有筆就不能教寫字……你能幫我找找嗎？好像飛到大樹那一邊去了。"]]},
    {if:["!f:lesson"],lines:[["pastor","沒有鵝毛筆，就沒辦法教孩子們寫字了……"]]},
    {if:[],lines:[["pastor","語言是很珍貴的。把它寫下來，就能一直流傳下去。"]]}
   ],
   gives:[{item:"quill",if:["f:met"],lines:[["pastor","我的鵝毛筆！太感謝你了。"],["pastor","你知道嗎？這裡的居民有自己的語言，可是沒有文字。所以我們用羅馬拼音，就是 A、B、C 這種字母，把他們說的話拼寫出來。"]],
     ask:{q:"傳教士用什麼方式，把當地居民的語言寫下來？",by:"pastor",say:"你知道我們用什麼字母嗎？",o:[
      {t:"用羅馬拼音（羅馬字）拼寫",ok:true,r:"沒錯！孩子們學會以後，就能用羅馬字寫下自己的話。"},
      {t:"用注音符號拼寫",r:"注音符號是很久以後才有的喔。"},
      {t:"用畫圖代替文字",r:"畫圖很可愛，不過我們用的是羅馬字母。"}]},
     fx:{set:["lesson"]},after:[["pastor","鵝毛筆你先帶著，說不定等一下有人用得上。"]]}],
   wrong:[["pastor","「{item}」？我在找的是我的鵝毛筆喔。"]]},
  {id:"kid",name:"小德",role:"新港社的孩子",por:"kid",s:"a",x:85,y:38,
   talks:[
    {if:["!f:lesson"],lines:[["kid","牧師的筆不見了，今天不能上課了嗎？"]]},
    {if:["!f:kid"],lines:[["kid","你看你看！這是我的名字，我用羅馬字寫的！"],["kid","牧師說，只要學會這些字母，我們說的話就可以寫下來。"],["kid","我阿公正要跟阿田叔訂土地的約定，可是他們不會寫字，要我去幫忙。你也一起來嘛！"]],fx:{set:["kid"]},after:[["教授","他們在另一邊的大樹下。轉身過去看看。"]]},
    {if:["!f:done"],lines:[["kid","對了，學校屋簷下的那口鐘，昨天晚上一直發出藍光，好奇怪喔！"]]},
    {if:[],lines:[["kid","明天我要教阿公寫他的名字！"]]}
   ]},
  {id:"bell",name:"屋簷下的小鐘",role:"",kind:"obj",s:"a",x:68,y:26,
   talks:[
    {if:["!f:contract"],lines:[["旁白","一口小銅鐘。噹噹噹一響，就是上課時間到了。"]]},
    {if:["!f:done"],lines:[["旁白","你踮起腳尖往鐘裡面看……一顆藍色寶石卡在鐘裡面！難怪它會發光。"]],
     ask:{q:"荷蘭人離開以後，當地居民繼續用羅馬字寫下的土地契約，被叫做什麼？",by:"教授",say:"考考你：",o:[
      {t:"新港文書",ok:true,r:"答對了！"},
      {t:"馬關條約",r:"那是很久以後的條約喔。"},
      {t:"航海日誌",r:"航海日誌是船長寫的紀錄。"}]},
     fx:{give:["gem4"],done:true}},
    {if:[],lines:[["旁白","噹──小鐘輕輕響了一聲。"]]}
   ]},
  {id:"board",name:"小黑板",role:"",kind:"obj",hidden:true,s:"a",x:38,y:44,
   talks:[{if:["!f:board"],lines:[["旁白","{pet}在黑板下面嗅到一包東西，是孩子們藏起來的點心！"],["旁白","上面寫著羅馬字：「給辛苦的牧師」。"]],fx:{set:["board"],give:["sugar*2"],card:"bell"}},{if:[],lines:[["旁白","黑板上寫著 A、B、C。"]]}]},
  {id:"atian2",name:"阿田",role:"在新港社附近開墾的農夫",por:"atian",s:"b",x:23,y:20,
   talks:[
    {if:["!f:kid"],lines:[["atian2","咦，是你！我現在在這附近開墾。正在等人幫忙寫契約呢。"]]},
    {if:["!f:contract"],lines:[["atian2","小德的阿公同意把這塊地租給我開墾，我們要寫一份約定。小德會用羅馬字寫，可是我們沒有筆……"]]},
    {if:[],lines:[["atian2","有了這份契約，以後就不會吵架了！"]]}
   ],
   gives:[{item:"quill",if:["f:kid"],lines:[["atian2","太好了，有筆了！小德，麻煩你囉！"],["旁白","小德一邊聽阿公說，一邊用羅馬字慢慢寫下來。你在旁邊幫忙扶著紙。"]],
     fx:{take:["quill"],craft:{mode:"rub",kicker:"寫契約",title:"幫忙把契約寫好",lbl:"按住紙張，跟著小德左右來回寫！（按住左右拖動）",from:"quill",to:"xingang"},set:["contract"],card:"xingangdoc"},
     after:[["教授","這就是「新港文書」！荷蘭人離開以後，這種用羅馬字寫的契約，還被用了很久很久。"]]}],
   wrong:[["atian2","「{item}」不能拿來寫字啦。"]]},
  {id:"elder",name:"小德的阿公",role:"新港社的長老",s:"b",x:53,y:26,
   talks:[{if:["!f:contract"],lines:[["elder","我的孫子會寫字了，真了不起。"]]},{if:[],lines:[["elder","寫下來的約定，大家都看得懂，很好。"]]}]},
  {id:"bench",name:"大樹下的長椅",role:"",kind:"obj",s:"b",x:78,y:80,
   talks:[
    {if:["!f:met"],lines:[["旁白","長椅旁邊的草地上，有一根白白的羽毛。"]]},
    {if:["!f:quillgot"],lines:[["旁白","長椅下面卡著一支白色的鵝毛筆，筆尖還沾著墨水。一定是牧師的！"]],fx:{give:["quill"],set:["quillgot"]}},
    {if:[],lines:[["旁白","風吹過大樹，葉子沙沙作響。"]]}
   ]}
 ],
 outro:[["教授","第四顆寶石到手！只剩最後一顆了。"],["教授","我們一直待在南部……其實，這時候臺灣北部也有歐洲人喔！下一站：北臺灣的雞籠。"]]
}
,/* ======================= 第五章 北方的西班牙人 ======================= */
{id:"s5",era:"sea",seal:"第五章",title:"北方的西班牙人",pano:"s5",start:{s:"a",x:30},
 music:{root:123,scale:[0,1,4,5,7,8,10],tempo:740,wave:"triangle"},
 intro:[
  ["旁白","一陣涼涼的海風吹來，還飄著毛毛雨。{name}來到臺灣北部的一座小島，島上有一座石頭城堡。"],
  ["教授","這裡是北臺灣的雞籠，就是今天的基隆。城堡上的旗子不是荷蘭的……是西班牙的！"],

 ],
 goals:[
  {t:"問問神父：西班牙人為什麼來臺灣？",c:["f:met"],h:"小教堂前面，穿白色長袍、披黑色斗篷的人就是神父。"},
  {t:"拿食物給肚子餓的士兵",c:["f:fed"],h:"城堡前的西班牙士兵餓壞了。背包裡的烤魚、甘蔗或糖塊都可以，拿在手上再點他。"},
  {t:"看看淡水的城堡",c:["c:hongmao"],h:"轉身往另一邊看，河口的山丘上也有一座城堡。"},

  koxinga:{ch:"z1",name:"鄭成功",kind:"明鄭時期",year:"1661 年",text:"明朝末年，清朝勢力越來越大。鄭成功在中國東南沿海帶兵對抗清朝，但是一直打不贏。為了找一個穩固的根據地，他決定帶著大軍渡海，攻打荷蘭人統治的臺灣。",key:"鄭成功想以<b>臺灣</b>作為<b>對抗清朝</b>的<b>根據地</b>。"},
  luermen:{ch:"z1",name:"鹿耳門登陸",kind:"鄭荷之戰",year:"1661 年",text:"1661 年，鄭成功的船隊趁著漲潮，從水道狹窄、沙洲很多的鹿耳門進入台江內海，順利登陸，包圍了荷蘭人的城堡。",key:"鄭成功趁<b>漲潮</b>從<b>鹿耳門</b>進入台江內海。"},
  dutchleave:{ch:"z1",name:"荷蘭人離開臺灣",kind:"鄭荷之戰",year:"1662 年",text:"鄭成功的軍隊包圍熱蘭遮城好幾個月，荷蘭的長官揆一最後在 1662 年投降，帶著荷蘭人離開臺灣。荷蘭人統治臺灣大約三十八年。",key:"<b>1662 年</b>荷蘭人投降，<b>離開臺灣</b>。"},
  milkfishc:{ch:"z1",hidden:true,name:"國姓魚",kind:"隱藏發現",year:"明鄭時期",text:"臺南有個有趣的傳說：鄭成功（人稱國姓爺）很喜歡吃一種魚，所以有人把虱目魚叫做「國姓魚」。",key:"傳說<b>虱目魚</b>又叫「<b>國姓魚</b>」。"},
  tuntian:{ch:"z2",name:"屯田制度",kind:"明鄭時期",year:"明鄭時期",text:"鄭成功帶來很多軍隊，需要很多糧食。他讓軍隊到各地開墾，沒有戰事的時候種田，有戰事的時候打仗，這叫做「屯田」，也叫「寓兵於農」。",key:"<b>屯田</b>：士兵<b>平時種田、戰時打仗</b>。"},
  placename:{ch:"z2",name:"跟屯田有關的地名",kind:"地名由來",year:"明鄭時期",text:"屯田的軍隊在各地建立營區、開墾田地，留下了許多帶有「營」「鎮」「林」「協」等字的地名，例如新營、左營、林鳳營。",key:"地名裡的<b>「營」「鎮」</b>等字，很多和<b>屯田</b>有關。"},
  hanmore:{ch:"z2",name:"漢人越來越多",kind:"明鄭時期",year:"明鄭時期",text:"明鄭時期，除了軍隊和他們的家人，也有很多漢人從中國東南沿海來臺灣開墾。漢人越來越多，開墾的土地也從臺南一帶向南、北擴展。",key:"明鄭時期<b>漢人增加</b>，<b>開墾範圍擴大</b>。"},
  granary:{ch:"z2",hidden:true,name:"糧倉角落的地瓜",kind:"隱藏發現",year:"明鄭時期",text:"糧倉的角落堆著地瓜。士兵們除了種稻米，也種地瓜等作物，讓軍隊不怕沒有糧食。",key:"屯田讓軍隊<b>自己生產糧食</b>。"},
  confucius:{ch:"z3",name:"孔廟與學校",kind:"文化教育",year:"明鄭時期",text:"鄭成功的兒子鄭經治理臺灣時，聽從陳永華的建議，興建孔廟，設立學校，鼓勵大家讀書，並舉辦考試選拔人才。從此，漢人的教育和文化在臺灣扎根。",key:"<b>陳永華</b>建<b>孔廟</b>、設<b>學校</b>，推行教育。"},
  dongning:{ch:"z3",name:"東寧",kind:"明鄭時期",year:"明鄭時期",text:"鄭氏在臺灣建立政權，以今天的臺南一帶為中心。鄭經時期把臺灣改稱「東寧」。",key:"明鄭時期臺灣又被稱為<b>東寧</b>。"},
  qingcome:{ch:"z3",name:"明鄭時期結束",kind:"明鄭時期",year:"明鄭時期末",text:"清朝派施琅率領軍隊攻下澎湖，鄭成功的孫子鄭克塽投降，明鄭時期結束，臺灣從此被納入清帝國的版圖。",key:"<b>施琅</b>攻臺，<b>鄭克塽投降</b>，臺灣納入<b>清帝國</b>版圖。"},
  saltpan:{ch:"z3",hidden:true,name:"海邊的鹽田",kind:"隱藏發現",year:"明鄭時期",text:"海邊一格一格的鹽田裡，海水被太陽曬乾，就留下白白的鹽。鹽是每天生活都需要的東西。",key:"臺灣西南沿海用<b>海水曬鹽</b>。"}
});

  blackditch:{ch:"q1",name:"黑水溝",kind:"自然環境",year:"清領前期",text:"臺灣海峽的海水看起來特別深黑，水流急、風浪大，渡海的人叫它「黑水溝」。坐著小帆船渡海非常危險，有人形容「十去六死三留一回頭」。很多移民會帶著媽祖神像或香火，祈求平安。",key:"渡海要經過危險的<b>黑水溝</b>，移民向<b>媽祖</b>祈求平安。"},
  yifu:{ch:"q1",name:"一府三縣",kind:"行政區劃",year:"清領初期",text:"清帝國統治臺灣初期，設立臺灣府，下面分成臺灣縣、鳳山縣、諸羅縣，稱為「一府三縣」，隸屬福建省管理。當時政府的管理重點在南部。",key:"清領初期：<b>一府三縣</b>（臺灣府；臺灣縣、鳳山縣、諸羅縣），隸屬<b>福建</b>。"},
  mazu:{ch:"q1",hidden:true,name:"船上的媽祖",kind:"隱藏發現",year:"清領時期",text:"媽祖是保佑航海平安的神明。移民平安上岸以後，常常會蓋廟供奉媽祖，所以臺灣到處都有媽祖廟。",key:"移民把<b>媽祖信仰</b>帶到臺灣。"},
  kenhu:{ch:"q2",name:"墾戶與佃農",kind:"開墾",year:"清領前期",text:"有錢的人向官府申請開墾一大片土地，成為「墾戶」，再招募農民來耕種，這些農民叫做「佃農」，要把收成的一部分交給墾戶當地租。大家一起努力，田地越開越多。",key:"<b>墾戶</b>申請土地、招募<b>佃農</b>來開墾。"},
  shuizun:{ch:"q2",name:"水圳的功用",kind:"開墾",year:"清領前期",text:"水圳是引河水灌溉田地的水道。有了水圳，原本缺水的旱田可以變成水田，種出更多稻米，開墾的範圍也越來越大。",key:"<b>水圳</b>：引水灌溉，<b>旱田變水田</b>，稻米增產。"},
  sandazun:{ch:"q2",name:"清代三大圳",kind:"開墾",year:"清領時期",text:"八堡圳在中部的彰化，由施世榜投資興建；瑠公圳在北部的臺北，由郭錫瑠開鑿；曹公圳在南部的高雄，由鳳山知縣曹謹主持興建。",key:"<b>八堡圳</b>（中部・施世榜）、<b>瑠公圳</b>（北部・郭錫瑠）、<b>曹公圳</b>（南部・曹謹）。"},
  kidstones:{ch:"q2",hidden:true,name:"河邊的大石頭",kind:"隱藏發現",year:"清領前期",text:"做竹籠要裝很多大石頭，大家從河床上一顆一顆搬過來，非常辛苦。開一條水圳，常常要花好多年。",key:"開鑿<b>水圳</b>需要很多人力和時間。"},
  ports:{ch:"q3",name:"一府二鹿三艋舺",kind:"港口",year:"清領時期",text:"清領時期臺灣最熱鬧的三個港口城市：第一是府城（臺南），第二是鹿港，第三是艋舺（今臺北萬華）。從南到北，港口的興起也顯示開墾由南往北發展。",key:"<b>一府二鹿三艋舺</b>：<b>府城（臺南）、鹿港、艋舺</b>。"},
  jiao:{ch:"q3",name:"郊商",kind:"經濟",year:"清領時期",text:"做兩岸生意的商人，會組成叫做「郊」的商業團體，一起經營貿易、互相幫忙，也一起出錢做公益、修廟宇。",key:"商人組成的團體叫做<b>「郊」</b>，經營<b>兩岸貿易</b>。"},
  liangan:{ch:"q3",name:"兩岸貿易",kind:"經濟",year:"清領時期",text:"臺灣把稻米、蔗糖運到中國賣，再從中國買進布匹、藥材、日用品等。臺灣和中國之間的貿易非常頻繁。",key:"<b>出口</b>：稻米、蔗糖；<b>進口</b>：布匹、藥材、日用品。"},
  lane:{ch:"q3",hidden:true,name:"不見天街",kind:"隱藏發現",year:"清領時期",text:"鹿港有一條商店街，屋頂加蓋了遮雨棚，走在街上看不到天空，叫做「不見天街」，下雨天也能做生意。",key:"鹿港曾有熱鬧的<b>不見天街</b>。"},
  temple:{ch:"q4",name:"廟宇是生活中心",kind:"社會文化",year:"清領時期",text:"移民把家鄉的神明帶到臺灣，蓋起廟宇。廟宇不只是拜拜的地方，也是舉辦節慶、看戲、討論事情、聯絡感情的中心。",key:"<b>廟宇</b>是信仰、節慶和聯絡感情的<b>中心</b>。"},
  minbian:{ch:"q4",name:"民變",kind:"社會",year:"清領時期",text:"有些官員貪汙、管理不好，民眾不滿，就集體起來反抗政府，叫做「民變」。清領時期民變很多，有「三年一小反，五年一大亂」的說法。著名的有朱一貴事件（朱一貴被稱為「鴨母王」）、林爽文事件和戴潮春事件。",key:"<b>民變</b>：人民反抗<b>政府</b>，如<b>朱一貴、林爽文、戴潮春</b>事件。"},
  xiedou:{ch:"q4",name:"械鬥",kind:"社會",year:"清領時期",text:"移民常和同鄉、同姓的人住在一起。不同祖籍、不同族群的人，為了爭土地、搶水源，有時會拿起武器集體打架，叫做「械鬥」，例如漳州人和泉州人、閩南人和客家人之間的械鬥。輸的一方常常被迫搬家。",key:"<b>械鬥</b>：不同族群為<b>土地、水源</b>集體衝突。"},
  admin1:{ch:"q4",name:"行政區劃的變化（前期）",kind:"行政區劃",year:"清領前期",text:"一開始是一府三縣。朱一貴事件後，政府發現北邊管不到，增設彰化縣和淡水廳；林爽文事件後，諸羅縣改名為嘉義縣；後來宜蘭一帶開墾起來，又設了噶瑪蘭廳。行政區越設越多，代表開墾範圍越來越大。",key:"一府三縣 →（朱一貴事件後）增設<b>彰化縣、淡水廳</b> → 諸羅改名<b>嘉義</b> → 設<b>噶瑪蘭廳</b>。"},
  opera:{ch:"q4",hidden:true,name:"戲臺下的板凳",kind:"隱藏發現",year:"清領時期",text:"廟口演戲的時候，大家搬板凳來看。布袋戲、歌仔戲等傳統戲劇，是那時候大家最愛的娛樂。",key:"廟口常有<b>傳統戲劇</b>演出。"}
});

  ["教授","這是清帝國統治臺灣的時期，大約三百年前。明鄭投降以後，臺灣被納入清帝國的版圖。"],
  ["教授","這艘船上的人，都是從中國福建、廣東來的移民。不過……他們好像不是正大光明地來的。去問問那位船老大。"],

     ask:{q:"清帝國的「渡臺禁令」規定了什麼？",by:"boatboss",say:"你知道朝廷怎麼規定的嗎？",o:[

      {t:"完全不准任何人去臺灣",r:"也不是完全不准，是要申請，限制很多啦。"},

     ask:{q:"為什麼有那麼多福建、廣東的人，願意冒險渡海到臺灣？",by:"ashun",say:"你懂我的心情嗎？",o:[

  {id:"sea",name:"黑色的海水",role:"",kind:"obj",s:"a",x:40,y:32,

  {id:"shrine",name:"媽祖神龕",role:"",kind:"obj",hidden:true,s:"a",x:93,y:46,

  {id:"uncle",name:"林阿伯",role:"早年來臺的同鄉",por:"uncle",s:"b",x:46,y:24,

    {if:["!f:seasick"],lines:[["旁白","岸邊好像有人在揮手，可是船還沒靠岸。"]]},
    {if:["!f:uncle"],lines:[["uncle","阿順！你終於來了！還有這位小朋友，歡迎來到臺灣！"],["uncle","我二十年前來的，現在在府城外面幫墾戶種田。辛苦是辛苦，可是有飯吃！"],["uncle","你看那邊的城牆，那是府城。朝廷在臺灣設了一個臺灣府，下面分成臺灣縣、鳳山縣、諸羅縣，屬於福建省管。"]],
     ask:{q:"清帝國剛統治臺灣的時候，設立了什麼行政區？",by:"uncle",say:"你記住了嗎？",o:[
      {t:"一府三縣（臺灣府；臺灣縣、鳳山縣、諸羅縣）",ok:true,r:"記性真好！以後縣越設越多，你就知道臺灣越開越大囉。"},

  {id:"official",name:"官差",role:"檢查文件的官差",s:"b",x:15,y:26,

  {id:"crate",name:"碼頭邊的木箱",role:"",kind:"obj",s:"b",x:70,y:50,

    {if:["!f:done"],lines:[["旁白","打開木箱，裡面躺著一顆閃閃發光的珠子──是時光珠！"]],
     ask:{q:"清領初期，早期來臺的移民為什麼大多是男性？",by:"教授",say:"考考你：",o:[
      {t:"因為渡臺禁令不准帶家眷",ok:true,r:"答對了！所以很多移民只能自己一個人來臺灣打拚。"},
      {t:"因為女生不會坐船",r:"不是這個原因喔。"},

     fx:{give:["pearl1","amulet"],done:true}},
    {if:[],lines:[["旁白","空空的木箱。"]]}

 ],
 outro:[["教授","第一顆時光珠到手！"],["教授","移民上岸以後，要面對的第一個難題是──水。沒有水，就種不了稻子。下一站：中部的彰化平原！"]]

,/* ======================= 第二章 開圳的人們 ======================= */
{id:"q2",era:"qing1",seal:"第二章",title:"開圳的人們",pano:"q2",start:{s:"a",x:30},
 music:{root:110,scale:[0,2,4,7,9],tempo:820,wave:"triangle"},
 intro:[
  ["旁白","嘩啦嘩啦的水聲。{name}來到一條大河邊，好多人正在挖土、搬石頭。"],
  ["教授","這裡是彰化平原。土地很大，可是常常缺水。那位穿長袍的大老闆，正在想辦法把河水引到田裡。"]
 ],
 goals:[
  {t:"跟施世榜說話",c:["f:met"],h:"河邊穿綢緞長袍、拿著圖紙的人，就是施世榜。"},
  {t:"幫工人裝竹籠擋水",c:["f:dam"],h:"河邊的工頭需要竹籠。竹籠在河岸邊，拿到以後交給工頭。"},
  {t:"去田裡看看佃農阿土",c:["f:water"],h:"轉身看田那一邊，阿土站在乾裂的田邊。"},
  {t:"完成三大圳配對",c:["c:sandazun"],h:"施世榜要考考你，去找他。"},
  {t:"找回第二顆時光珠",c:["f:done"],h:"阿土說新圳道的水裡有東西在發光。"}
 ],
 spots:[
  {id:"shi",name:"施世榜",role:"出錢開圳的墾戶",por:"shi",s:"a",x:22,y:18,
   talks:[
    {if:["!f:met"],lines:[["shi","你好，小朋友。我是施世榜，向官府申請了這一大片土地來開墾。"],["shi","我請了很多農民來耕種，他們是佃農，收成以後交一部分給我當租金。可是土地再大，沒有水也種不出稻子啊！"],["shi","所以我決定出錢，挖一條水圳，把濁水溪的水引到田裡。"]],
     ask:{q:"像施世榜這樣申請土地、再招募農民來耕種的人，叫做什麼？",by:"shi",say:"你知道我這種人叫什麼嗎？",o:[
      {t:"墾戶",ok:true,r:"沒錯！我是墾戶，來種田的農民就是佃農。"},
      {t:"郊商",r:"郊商是做生意的。我是開墾土地的。"},
      {t:"巡撫",r:"巡撫是大官，我只是開墾土地的人。"}]},

Object.assign(CARDS,{
  shimonoseki:{ch:"j1",name:"馬關條約",kind:"割讓臺灣",year:"1895 年",text:"1894 年清帝國和日本打甲午戰爭，清帝國戰敗。1895 年雙方簽訂《馬關條約》，清帝國把臺灣和澎湖割讓給日本。從此，臺灣開始了大約五十年的日本統治。",key:"<b>1895 年《馬關條約》</b>：臺灣、澎湖割讓給<b>日本</b>，日治約<b>五十年</b>。"},
  stayorgo:{ch:"j1",name:"要走還是要留？",kind:"割讓臺灣",year:"1895 年",text:"條約規定，臺灣的居民可以在兩年內決定：要搬回清國，還是留在臺灣成為日本統治下的人民。有人帶著家當離開，但大部分的人捨不得自己的家和田地，選擇留下來。",key:"居民有<b>兩年</b>可以選擇<b>去或留</b>，大部分人<b>留下</b>。"},
  minzhuguo:{ch:"j1",name:"臺灣民主國",kind:"抵抗日本",year:"1895 年",text:"消息傳來，臺灣的官員和士紳不願意被割讓，成立「臺灣民主國」，旗子是藍底黃虎的「藍地黃虎旗」，想要抵抗日本接收。但是臺灣民主國很快就瓦解了。",key:"<b>臺灣民主國</b>，旗子是<b>藍地黃虎旗</b>，很快就失敗。"},
  oldhouse:{ch:"j1",hidden:true,name:"阿嬤的老房子",kind:"隱藏發現",year:"1895 年",text:"阿嬤說，這間房子是她的公公蓋的，門口的石階被三代人踩得光光亮亮。不管誰來統治，這裡都是她的家。",key:"大部分臺灣人<b>選擇留下</b>，繼續在這片土地生活。"},
  sotokufu:{ch:"j2",name:"臺灣總督府",kind:"統治方式",year:"日治時期",text:"日本在臺灣設立「臺灣總督府」，是統治臺灣的最高機關。臺灣總督的權力非常大，管理行政、法律和軍隊。日本把臺灣當成殖民地，主要是為了日本的利益。",key:"最高統治機關是<b>臺灣總督府</b>，臺灣是日本的<b>殖民地</b>。"},
  police:{ch:"j2",name:"警察制度",kind:"統治方式",year:"日治時期",text:"總督府在各地設立派出所，警察除了抓壞人，還要管戶口、衛生、收稅、農業，什麼都管，權力很大。所以臺灣人都叫警察「大人」，小孩子一聽到警察來了就不敢哭。",key:"<b>警察</b>管很多事，權力很大，被稱為<b>「大人」</b>。"},
  baojia:{ch:"j2",name:"保甲制度",kind:"統治方式",year:"日治時期",text:"總督府把十戶編成一「甲」，十甲編成一「保」，由保正、甲長協助警察管理地方。一戶有人犯錯，同一甲的人也要一起受罰，大家只好互相監督。",key:"<b>保甲制度</b>：十戶一甲、十甲一保，協助<b>警察</b>管理。"},
  survey:{ch:"j2",name:"土地與戶口調查",kind:"統治方式",year:"日治初期",text:"總督府派人調查全臺灣的土地和戶口，弄清楚每塊地是誰的、每戶有幾個人。這讓政府能更有效地管理和收稅。",key:"總督府進行<b>土地調查</b>、<b>戶口調查</b>，方便管理和收稅。"},
  unequal:{ch:"j2",name:"不平等的待遇",kind:"統治的態度",year:"日治時期",text:"在殖民統治下，臺灣人和日本人的待遇不一樣：重要的官職大多是日本人擔任，讀書、工作的機會也不平等。",key:"殖民統治下，臺灣人受到<b>差別待遇</b>。"},
  xilaian:{ch:"j2",name:"武力抗日與西來庵事件",kind:"武力抗日",year:"1915 年",text:"日本統治初期，各地常有臺灣人拿起武器反抗。1915 年發生在臺南的西來庵事件，是規模很大的一次武力抗日，失敗後很多人被判刑。之後，臺灣人慢慢改用不用武力的方法爭取權利。",key:"<b>西來庵事件</b>是日治前期大規模的<b>武力抗日</b>。"},
  sugarco:{ch:"j3",name:"新式製糖業",kind:"經濟",year:"日治時期",text:"日本人在臺灣設立新式製糖工廠（製糖會社），用機器大量製糖，臺灣成為「糖業王國」。蔗農種的甘蔗只能賣給附近的會社，價格和秤重都由會社決定，所以有人說「第一憨，種甘蔗給會社磅」。",key:"<b>新式製糖會社</b>讓臺灣成為糖業王國，但價格由<b>會社</b>決定。"},
  wufen:{ch:"j3",name:"五分車",kind:"交通",year:"日治時期",text:"製糖會社鋪了窄窄的小鐵路，用小火車把甘蔗從田裡運到工廠。因為鐵軌寬度大約是一般鐵路的一半，所以叫「五分車」。",key:"<b>五分車</b>：運送甘蔗的小火車。"},
  railway2:{ch:"j3",name:"縱貫鐵路與港口",kind:"交通建設",year:"1908 年",text:"1908 年，從基隆到高雄的縱貫鐵路全線通車，臺灣南北交通變得快速方便。總督府也擴建基隆港和高雄港，方便把臺灣的米、糖運到日本。",key:"<b>1908 年縱貫鐵路</b>（基隆到高雄）通車，擴建<b>基隆港、高雄港</b>。"},
  agriTW:{ch:"j3",name:"工業日本，農業臺灣",kind:"經濟政策",year:"日治時期",text:"日本希望臺灣生產米、糖等農產品供應日本，日本自己發展工業，這叫「工業日本，農業臺灣」。總督府也把樟腦、菸、酒、鹽等收歸政府專賣，增加收入。",key:"<b>工業日本，農業臺灣</b>；樟腦、菸、酒等實施<b>專賣</b>。"},
  canefield:{ch:"j3",hidden:true,name:"甘蔗田裡的小路",kind:"隱藏發現",year:"日治時期",text:"甘蔗長得比大人還高，蔗田裡的小路彎彎曲曲。小孩子常常偷偷折一截甘蔗來啃。",key:"日治時期臺灣大量種植<b>甘蔗</b>。"},
  school:{ch:"j4",name:"新式教育",kind:"教育",year:"日治時期",text:"總督府在臺灣辦新式學校。臺灣小孩讀「公學校」，日本小孩讀「小學校」，學校教日語（當時稱為國語），兩種學校的資源和升學機會並不平等。不過，越來越多臺灣人有機會讀書識字。",key:"臺灣人讀<b>公學校</b>、日本人讀<b>小學校</b>，學<b>日語</b>，待遇不平等。"},
  health:{ch:"j4",name:"公共衛生",kind:"衛生建設",year:"日治時期",text:"總督府建立公共衛生制度：鋪設自來水和下水道、打預防針、定期大掃除、成立西式醫院和醫學校，努力消滅鼠疫、瘧疾等傳染病。生病和死亡的人明顯變少了。",key:"<b>自來水、下水道、預防注射、大掃除</b>，傳染病減少。"},
  hairfoot:{ch:"j4",name:"放足斷髮",kind:"生活改變",year:"日治時期",text:"清朝時男人留辮子、很多女人纏小腳。日治時期推廣「斷髮」（剪掉辮子）和「放足」（不再纏腳），大家的生活習慣慢慢改變。",key:"<b>斷髮</b>（剪辮子）、<b>放足</b>（不纏腳）。"},
  twoSides:{ch:"j4",name:"日治的兩面",kind:"想一想",year:"日治時期",text:"日治時期帶來鐵路、衛生、教育等現代化建設，讓生活更方便、更健康；但同時，臺灣是殖民地，臺灣人受到不平等的對待，建設也常常是為了日本的利益。看歷史，要兩邊都看到。",key:"現代化建設<b>和</b>不平等的殖民統治，<b>兩面都要看見</b>。"},
  mosquito:{ch:"j4",hidden:true,name:"水溝裡的孑孓",kind:"隱藏發現",year:"日治時期",text:"積水的地方會長出孑孓（蚊子的幼蟲），蚊子會傳染瘧疾。所以大掃除時一定要清水溝、倒積水。",key:"清除積水，預防<b>瘧疾</b>等傳染病。"}
});

,/* ======================= 第二章 總督府與警察 ======================= */
{id:"j2",era:"japan1",seal:"第二章",title:"總督府與警察",pano:"j2",start:{s:"a",x:30},
 music:{root:110,scale:[0,2,3,7,8],tempo:760,wave:"triangle"},
 intro:[
  ["旁白","{name}來到一個小村子。村口有一間木造的小房子，門口站著一位穿白色制服、腰上掛著佩刀的人。"],
  ["教授","那是派出所，那位是日本警察。日治時期，警察在臺灣的權力非常大。去跟他打聲招呼……小心一點喔。"]
 ],
 goals:[

  {t:"把戶口名簿交給警察",c:["f:census"],h:"打開背包，把「戶口名簿」拿給警察。"},

 ],

     ask:{q:"日治時期，統治臺灣的最高機關是什麼？",by:"keisatsu",say:"你記住了嗎？",o:[
      {t:"臺灣總督府",ok:true,r:"很好。總督大人的命令，大家都要遵守。"},
      {t:"臺灣府",r:"那是清帝國時期的行政區。"},
      {t:"東印度公司",r:"那是荷蘭時期的公司。"}]},
     fx:{set:["met"],card:["sotokufu","police"]},after:[["keisatsu","今天要做戶口調查。去跟保正拿戶口名簿來！"]]},
    {if:["!f:census"],lines:[["keisatsu","戶口名簿呢？快去跟保正拿！"]]},
    {if:[],lines:[["keisatsu","每一戶都要登記清楚，不能漏掉。"]]}
   ],
   gives:[{item:"censusbook",if:["f:met"],lines:[["keisatsu","嗯，我看看……每一戶幾個人、叫什麼名字、做什麼工作，都要寫清楚。"],["教授","總督府用戶口調查掌握每一個人，用土地調查掌握每一塊地，這樣就能更有效地管理和收稅。"]],fx:{take:["censusbook"],set:["census"]}}],
   wrong:[["keisatsu","「{item}」？我要的是戶口名簿！"]]},
  {id:"koban",name:"派出所",role:"",kind:"obj",s:"a",x:42,y:42,
   talks:[{if:[],lines:[["教授","總督府在全臺灣設了很多派出所，連很小的村子都有。大人嚇小孩的時候，常說「再哭，大人來了！」"]]}]},
  {id:"farmer2",name:"老農夫",role:"村子裡的老農夫",s:"a",x:83,y:44,
   talks:[

    {if:["!f:oldman"],lines:[["farmer2","日本人剛來的時候，到處都有人拿武器反抗。後來在臺南的西來庵，又有一次很大的反抗……"],["farmer2","失敗以後，好多人被抓、被判刑。大家才知道，用武器是打不過的。"]],fx:{set:["oldman"],card:"xilaian"}},

    {if:["!f:met"],lines:[["hoko","大家注意，等一下要查戶口了！"]]},
    {if:["!f:book"],lines:[["hoko","警察大人要戶口名簿？在這裡，拿去吧。"],["hoko","我是這一保的保正。總督府規定，十戶編成一甲，十甲編成一保。我們要幫警察管好村子。"],["hoko","要是有一戶人家犯了錯，同一甲的人都要一起被罰。所以大家只好互相盯著……"]],
     ask:{q:"日治時期協助警察管理地方的「保甲制度」是怎麼編的？",by:"hoko",say:"你聽懂了嗎？",o:[
      {t:"十戶一甲，十甲一保",ok:true,r:"沒錯。一戶出事，整甲都要負責。"},
      {t:"一個人一保",r:"不是這樣喔，是很多戶編在一起。"},
      {t:"一千戶一甲",r:"太多啦，是十戶一甲。"}]},
     fx:{set:["book"],give:["censusbook"],card:"baojia"}},
    {if:["f:census","c:survey","!c:unequal"],lines:[["hoko","你幫了大忙！來，考考你，這些管理方法，是哪個時代的？"]],

     after:[["hoko","答得真好。不過……重要的官都是日本人在當，我們臺灣人想讀好學校、當大官，機會很少。這就是殖民地啊。"]]},
    {if:[],lines:[["hoko","當保正很辛苦，兩邊都要顧。"]]}
   ]},
  {id:"surveyor",name:"測量員",role:"土地調查的測量員",s:"b",x:68,y:38,
   talks:[
    {if:["!f:census"],lines:[["surveyor","別擋到我的儀器！"]]},
    {if:["!c:survey"],lines:[["surveyor","總督府要調查全臺灣的土地。每一塊田有多大、是誰的，我們都要量清楚，畫成地籍圖。"],["surveyor","這樣政府就知道每塊地該繳多少稅了。"]],fx:{card:"survey",give:["landmap"]},after:[["surveyor","這張舊的地籍圖送你。"]]},
    {if:["c:unequal","!f:done"],lines:[["surveyor","咦？我的儀器旁邊，有個東西一直在發光……"],["旁白","你走過去一看──是第二個時光懷錶！"]],
     ask:{q:"日治時期，臺灣人為什麼叫警察「大人」？",by:"教授",say:"考考你：",o:[
      {t:"因為警察管很多事、權力很大",ok:true,r:"答對了！"},
      {t:"因為警察都長得很高",r:"不是因為身高喔。"},
      {t:"因為警察都是老人",r:"不是喔。"}]},
     fx:{give:["watch2"],done:true}},
    {if:[],lines:[["surveyor","這塊地，長四十間……"]]}
   ]}
 ],

}
,/* ======================= 第三章 鐵路與糖廠 ======================= */

 music:{root:123,scale:[0,2,4,7,9],tempo:640,wave:"triangle"},

Object.assign(CARDS,{
  shoushi:{ch:"k1",name:"守時觀念",kind:"生活改變",year:"日治時期",text:"以前大家看太陽決定作息。日治時期引進一天二十四小時的時間制度，火車、學校、工廠都照時鐘運作，政府還訂了「時間紀念日」宣傳守時。從此「準時」成為很重要的生活習慣。",key:"引進<b>一天 24 小時</b>的時間制度，培養<b>守時觀念</b>。"},
  weekly:{ch:"k1",name:"星期制",kind:"生活改變",year:"日治時期",text:"日治時期開始用「星期制」，一週七天，星期日休息。學校和公家機關固定放假，大家有了「週末」的觀念，也有了國定假日。",key:"<b>星期制</b>：一週七天，<b>星期日休息</b>。"},
  modernlife:{ch:"k1",name:"新式生活",kind:"生活改變",year:"日治中期",text:"城市裡出現了百貨公司、電影院、咖啡廳和公園，例如臺南的林百貨是南臺灣第一間百貨公司，臺北新公園是臺灣第一座都市公園。有人穿西裝、洋裝，也有人穿和服，生活變得多采多姿。",key:"<b>百貨公司、電影院、公園</b>出現，服裝<b>西化、日本化</b>。"},
  art:{ch:"k1",name:"新的藝術",kind:"藝術",year:"日治中期",text:"日治時期傳入西洋油畫、膠彩畫和雕塑。陳澄波是第一位以西洋油畫入選日本帝國美術展覽會的臺灣畫家；黃土水是第一位到日本學習美術的臺灣雕刻家，代表作是〈水牛群像〉。",key:"<b>陳澄波</b>（西洋油畫）、<b>黃土水</b>（雕塑〈水牛群像〉）。"},
  buffalo:{ch:"k1",hidden:true,name:"水牛群像",kind:"隱藏發現",year:"日治中期",text:"公園裡有一座浮雕，雕著幾頭水牛和牧童，那是黃土水的作品〈水牛群像〉，表現了臺灣農村純樸的樣子。",key:"<b>黃土水</b>的〈<b>水牛群像</b>〉。"},
  wenhua:{ch:"k2",name:"臺灣文化協會",kind:"非武裝抗爭",year:"1921 年",text:"武力抗日失敗以後，臺灣人改用不使用武力的方法爭取權利。1921 年，蔣渭水、林獻堂等人成立「臺灣文化協會」，到各地舉辦演講會、讀報社，提升臺灣人的知識和自覺。後來蔣渭水又成立「臺灣民眾黨」，繼續為臺灣人爭取權利。",key:"<b>1921 年</b>，<b>蔣渭水、林獻堂</b>等人成立<b>臺灣文化協會</b>。"},
  minbao:{ch:"k2",name:"臺灣民報",kind:"非武裝抗爭",year:"日治中期",text:"《臺灣民報》是臺灣人自己辦的報紙，用臺灣人看得懂的文字報導新聞、介紹新知識，也替臺灣人發聲。",key:"<b>《臺灣民報》</b>：臺灣人自己辦的報紙。"},
  qingyuan:{ch:"k2",name:"臺灣議會設置請願運動",kind:"非武裝抗爭",year:"1921～1934 年",text:"林獻堂等人一次又一次向日本政府請願，希望設立由臺灣人選出代表的「臺灣議會」，讓臺灣人自己決定臺灣的事。請願持續了十幾年都沒有成功，但讓更多人關心自己的權利。",key:"林獻堂等人推動<b>臺灣議會設置請願運動</b>，爭取<b>自治</b>。"},
  election:{ch:"k2",name:"第一次地方選舉",kind:"非武裝抗爭",year:"1935 年",text:"1935 年臺灣舉辦第一次地方議員選舉，但限制很多：只有年滿 25 歲、繳稅達到一定金額的男性才能投票，而且只能選出一半的議員。",key:"<b>1935 年</b>第一次地方選舉，投票資格<b>限制很多</b>。"},
  wushe:{ch:"k2",name:"霧社事件",kind:"武力抗日",year:"1930 年",text:"1930 年，賽德克族頭目莫那．魯道因為長期受到警察欺壓，帶領族人起來反抗。日本出動軍隊鎮壓，造成很多人死亡。這是日治時期很大的一次武力抗日事件。",key:"<b>1930 年霧社事件</b>，<b>莫那．魯道</b>帶領族人反抗。"},
  watcher:{ch:"k2",hidden:true,name:"臺下的警察",kind:"隱藏發現",year:"日治中期",text:"演講會時，警察常常坐在臺下監聽。只要講的內容讓政府不高興，警察就會喊「中止」，叫演講的人停下來。",key:"演講會常有<b>警察監視</b>。"},
  jianan:{ch:"k3",name:"嘉南大圳",kind:"水利建設",year:"1930 年完工",text:"嘉南平原很大，可是常常缺水、土地又有鹽分，很難種稻。日本工程師八田與一主持興建烏山頭水庫和嘉南大圳，花了十年，在 1930 年完工，嘉南平原從此成為臺灣的大糧倉。",key:"<b>八田與一</b>興建<b>烏山頭水庫</b>和<b>嘉南大圳</b>，嘉南平原成為<b>糧倉</b>。"},
  rotation:{ch:"k3",name:"三年輪作",kind:"水利建設",year:"日治中期",text:"嘉南大圳的水還是不夠所有田地同時種稻，所以採用「三年輪作」：把田地分區，輪流種水稻、甘蔗和雜糧，讓大家都能分到水。",key:"<b>三年輪作</b>：輪流種<b>水稻、甘蔗、雜糧</b>。"},
  penglai:{ch:"k3",name:"蓬萊米",kind:"農業",year:"日治中期",text:"日本人培育出適合臺灣種植、口感Ｑ軟的「蓬萊米」。1920 年以後，臺灣的米和糖產量明顯增加，大量運到日本販賣。",key:"培育<b>蓬萊米</b>，1920 年後<b>米、糖產量大增</b>，運往日本。"},
  coral:{ch:"k3",hidden:true,name:"珊瑚潭",kind:"隱藏發現",year:"今天",text:"從天空往下看，烏山頭水庫的形狀彎彎曲曲，很像一片珊瑚，所以又叫「珊瑚潭」。",key:"烏山頭水庫又叫<b>珊瑚潭</b>。"},
  kominka:{ch:"k4",name:"皇民化運動",kind:"皇民化",year:"1937 年起",text:"1937 年中日戰爭爆發後，日本推動「皇民化運動」，要把臺灣人變成效忠日本天皇的「皇民」：要求說日語、改日本姓名、穿和服、參拜神社，限制臺灣原本的語言、宗教和習俗。",key:"<b>1937 年中日戰爭</b>後推動<b>皇民化運動</b>。"},
  kokugo:{ch:"k4",name:"國語家庭",kind:"皇民化",year:"皇民化時期",text:"全家都說日語的家庭，可以被認定為「國語家庭」，門口掛上牌子，在升學、工作和配給上得到比較好的待遇。很多不會說日語的老人家，因此覺得很為難。",key:"全家說日語可成為<b>國語家庭</b>，得到比較好的待遇。"},
  rename:{ch:"k4",name:"改日本姓名",kind:"皇民化",year:"皇民化時期",text:"皇民化運動鼓勵臺灣人把原本的姓名，改成日本式的姓名。",key:"鼓勵臺灣人<b>改日本姓名</b>。"},
  shrine:{ch:"k4",name:"參拜神社",kind:"皇民化",year:"皇民化時期",text:"日本在臺灣各地蓋了很多神社，要求學生和民眾去參拜。很多傳統的廟宇被整理、合併，布袋戲、歌仔戲等傳統戲劇也受到限制。",key:"要求<b>參拜神社</b>，傳統宗教和戲劇受到<b>限制</b>。"},
  oldgod:{ch:"k4",hidden:true,name:"藏起來的神明",kind:"隱藏發現",year:"皇民化時期",text:"有些家庭把祖先牌位和神明像偷偷藏在櫃子裡，等到可以公開的時候，再請出來拜。",key:"很多人<b>偷偷保存</b>自己的信仰和文化。"},
  pacific:{ch:"k5",name:"太平洋戰爭",kind:"二次世界大戰",year:"1941 年",text:"1941 年日本攻擊美國，太平洋戰爭爆發。臺灣成為日本向南方作戰的基地，建了很多軍事設施和軍需工廠。",key:"<b>1941 年太平洋戰爭</b>，臺灣成為日本的<b>南進基地</b>。"},
  ration:{ch:"k5",name:"物資配給",kind:"二次世界大戰",year:"戰爭時期",text:"戰爭時期物資都先給軍隊用。米、糖、布、油等日用品要拿配給券才能領，而且數量很少，大家的生活很辛苦。",key:"戰爭時期實施<b>物資配給</b>，生活艱苦。"},
  airraid:{ch:"k5",name:"空襲與疏開",kind:"二次世界大戰",year:"戰爭末期",text:"戰爭末期，美軍飛機常常來臺灣轟炸。大家要做防空演習、挖防空洞，城市裡的人也搬到鄉下躲避，叫做「疏開」。",key:"<b>空襲</b>時躲<b>防空洞</b>，城市居民<b>疏開</b>到鄉下。"},
  draft:{ch:"k5",name:"臺灣人上戰場",kind:"二次世界大戰",year:"戰爭時期",text:"戰爭越打越大，很多臺灣年輕人被派去當軍伕、志願兵，後來實施徵兵，被送到中國和南洋的戰場，有很多人再也沒有回來。學生也被動員去做勞動服務。",key:"臺灣人被徵召當<b>軍伕、志願兵</b>，學生被<b>動員</b>。"},
  end1945:{ch:"k5",name:"戰爭結束",kind:"終戰",year:"1945 年",text:"1945 年 8 月，日本宣布投降，第二次世界大戰結束，日本統治臺灣五十年的時期也跟著結束。之後，中華民國政府派人來臺灣接收。",key:"<b>1945 年</b>日本投降，<b>日治時期結束</b>。"}
});

 {ch:"k5",q:"戰爭末期，城市居民為了躲避空襲搬到鄉下，叫做什麼？",o:["疏開","偷渡","屯田","斷髮"],a:0,why:"搬到鄉下躲避空襲叫疏開。"},

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ================= 存檔 ================= */
const KEY="tw-time-explorer-v1";
const fresh=()=>({hero:null,name:"",bag:{},cab:[],cards:[],log:[],pet:{has:false,name:"",aff:0},chs:{},g:[],battle:{best:0,wins:0,plays:0,bestCorrect:0},music:false,cur:null});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r));}catch(e){}
/* 雲端存檔：從遊戲書房登入（有學生代碼）時，進度跟著代碼存到 Supabase，換裝置也能接著玩 */
const CLOUD=(()=>{let c="";try{c=(localStorage.getItem("bz_code")||"").trim().toUpperCase();}catch(e){}
  return c?{code:c,game:"twtime",U:"https://wbxpqyrkgdaqvtsmijoe.supabase.co/rest/v1/rpc/",K:"sb_publishable_04ZnsTSBxbREalRf2NWfeA_L1rzM9V4"}:null;})();
if(CLOUD&&S._code&&S._code!==CLOUD.code)S=fresh();   // 同一台裝置換了另一位學生
let cloudSettled=!CLOUD,pushT=null;
function save(){if(cloudSettled){S._t=Date.now();if(CLOUD)S._code=CLOUD.code;}
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(CLOUD&&cloudSettled){clearTimeout(pushT);pushT=setTimeout(()=>cloudSend(false),2500);}}
function cloudRpc(fn,args,keep){return fetch(CLOUD.U+fn,{method:"POST",keepalive:!!keep,headers:{apikey:CLOUD.K,"Content-Type":"application/json"},body:JSON.stringify(args)});}
function cloudSend(keep){if(!CLOUD)return;clearTimeout(pushT);pushT=null;
  cloudRpc("save_progress",{p_code:CLOUD.code,p_game:CLOUD.game,p_data:S,p_saved_at:S._t||0},keep).catch(()=>{});}
addEventListener("visibilitychange",()=>{if(document.hidden&&pushT)cloudSend(true);});
addEventListener("pagehide",()=>{if(pushT)cloudSend(true);});
const cloudReady=!CLOUD?Promise.resolve():cloudRpc("load_progress",{p_code:CLOUD.code,p_game:CLOUD.game})
  .then(r=>r.ok?r.json():null).then(rows=>{const r=rows&&rows[0];cloudSettled=true;
    if(r&&r.data&&(+r.saved_at||0)>(S._t||0)){S=Object.assign(fresh(),r.data);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(window.onCloudLoaded)onCloudLoaded();}
    else if(S.hero&&(!r||(+r.saved_at||0)<(S._t||0)||!S._t)){save();cloudSend(false);}})
  .catch(()=>{cloudSettled=true;});
function chs(id){return S.chs[id]||(S.chs[id]={flags:[],talked:[],miss:0,done:false,stars:0,missed:[]});}
const heroOf=id=>HEROES.find(h=>h.id===id)||HEROES[0];
const T=s=>String(s).replace(/\{name\}/g,S.name||"探險家").replace(/\{pet\}/g,S.pet.name||"小鹿");

/* ================= 圖示 ================= */
function iconStyle(id){const it=ITEMS[id];if(!it)return "";const n=ICON_GRID,i=it.icon,c=i%n,r=Math.floor(i/n);
  return `background-image:url(${IMG[it.sheet||"items"]});background-size:${n*100}% ${n*100}%;background-position:${c/(n-1)*100}% ${r/(n-1)*100}%`;}
const icon=(id,cls="")=>`<span class="ic ${cls}" style="${iconStyle(id)}"></span>`;

/* ================= 音效＋音樂 ================= */
let AC=null,master=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);}catch(e){return null;}}if(AC.state==="suspended")AC.resume();return AC;}
function tone(f,d,type,at,v=1,slide){const a=ac();if(!a)return;const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
const SFX={
  portal(){tone(110,1.4,"sawtooth",0,.5,880);tone(220,1.2,"sine",.1,.6,1760);[0,4,7,12,16].forEach((s,i)=>tone(523*2**(s/12),.7,"triangle",.5+i*.08,.5));},
  tick(){tone(880,.07,"square",0,.25);},
  pick(){[0,7,12].forEach((s,i)=>tone(659*2**(s/12),.35,"triangle",i*.06,.6));},
  get(){[0,4,7,12].forEach((s,i)=>tone(587*2**(s/12),.4,"triangle",i*.07,.7));},
  ok(){[0,4,7].forEach((s,i)=>tone(784*2**(s/12),.3,"triangle",i*.06,.7));},
  no(){tone(180,.3,"square",0,.4,120);},
  hit(){tone(90,.25,"sawtooth",0,1,40);tone(1200,.15,"square",0,.4,300);},
  hurt(){tone(300,.4,"sawtooth",0,.8,80);},
  chip(){tone(1400+Math.random()*600,.06,"square",0,.5,400);},
  rub(){tone(200+Math.random()*80,.08,"triangle",0,.25);},
  win(){[0,4,7,12,16,19,24].forEach((s,i)=>tone(523*2**(s/12),.5,"triangle",i*.09,.6));},
  munch(){[0,.12,.24].forEach(t=>tone(240,.08,"triangle",t,.5,160));},
};
const music=(()=>{let on=false,timer=null,m=null,pad=[];
  function stop(){clearTimeout(timer);pad.forEach(o=>{try{o.stop();}catch(e){}});pad=[];}
  function start(){const a=ac();if(!a||!m)return;stop();[1,1.5].forEach((r,k)=>{const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=m.root/2*r;g.gain.value=k?.012:.02;o.connect(g);g.connect(master);o.start();pad.push(o);});loop();}
  function loop(){if(!on||!m)return;if(Math.random()<.75){const d=m.scale[Math.random()*m.scale.length|0];tone(m.root*2*(Math.random()<.3?2:1)*2**(d/12),1.6,m.wave,0,.35);}
    timer=setTimeout(loop,m.tempo*(Math.random()<.25?2:1));}
  return{set(mm){m=mm;if(on)start();},toggle(){on=!on;S.music=on;save();if(on)start();else stop();return on;},get on(){return on;}};})();
function syncMusicBtns(){document.querySelectorAll('[data-act="music"]').forEach(b=>b.setAttribute("aria-pressed",music.on));}
document.addEventListener("click",e=>{const b=e.target.closest('[data-act="music"]');if(b){music.toggle();syncMusicBtns();}});

/* ================= 彈窗、提示 ================= */
function modal(html,{wide=false}={}){const p=$("modal-panel");p.className="panel"+(wide?" wide":"");p.style.width=wide?"min(900px,100%)":"";p.innerHTML=html;$("modal").hidden=false;return p;}
function closeModal(){$("modal").hidden=true;}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal"&&!$("modal").dataset.lock)closeModal();});
let toastT=null;
function toast(html){const r=$("toast-root");r.innerHTML=`<div class="toast">${html}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>r.innerHTML="",2600);}

/* ================= 封面 ================= */
$("cover-bg").style.backgroundImage=`url(${IMG.cover})`;
$("pick-bg").style.backgroundImage=`url(${IMG.cover})`;
$("hub-bg").style.backgroundImage=`url(${IMG.cover})`;
const cv=$("sparks"),cx=cv.getContext("2d");let parts=[],sparkOn=true;
function sizeCv(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;}
sizeCv();addEventListener("resize",sizeCv);
function sparkLoop(){if(!sparkOn)return;const W=cv.width,H=cv.height,cxp=W/2,cyp=H*.34;
  if(parts.length<70)parts.push({a:Math.random()*7,r:Math.random()*H*.05,v:.4+Math.random()*1.2,s:(1+Math.random()*2)*devicePixelRatio,life:1});
  cx.clearRect(0,0,W,H);parts.forEach(p=>{p.r+=p.v*devicePixelRatio;p.a+=.004;p.life-=.006;cx.fillStyle=`rgba(255,220,140,${Math.max(0,p.life)})`;cx.beginPath();cx.arc(cxp+Math.cos(p.a)*p.r,cyp+Math.sin(p.a)*p.r*.8,p.s,0,7);cx.fill();});
  parts=parts.filter(p=>p.life>0);requestAnimationFrame(sparkLoop);}
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)sparkLoop();
function show(id){["cover","pick","hub","play","battle"].forEach(s=>$(s).hidden=s!==id);sparkOn=id==="cover";if(sparkOn)sparkLoop();}
let flashing=false;
async function flashTo(fn){if(flashing)return;flashing=true;$("flash").className="on";SFX.portal();await sleep(950);try{fn();}finally{flashing=false;}$("flash").className="off";await sleep(700);$("flash").className="";}
$("go").onclick=async()=>{if(flashing||$("go").disabled)return;
  if(CLOUD&&!cloudSettled){$("go").disabled=true;const t=$("go").textContent;$("go").textContent="讀取進度中…";await Promise.race([cloudReady,sleep(5000)]);cloudSettled=true;$("go").disabled=false;$("go").textContent=t;}
  if(S.music&&!music.on){music.toggle();syncMusicBtns();}
  flashTo(()=>{if(S.hero&&S.name)openHub();else{show("pick");showHero(Math.max(0,HEROES.findIndex(h=>h.id===S.hero)),0);}});};

/* ================= 選角 ================= */
let cur=0;
$("roster").innerHTML=HEROES.map((h,i)=>`<button class="chip" data-i="${i}" aria-label="${h.type}"><img src="${IMG[h.id]}" alt=""><span class="n">${h.type}</span></button>`).join("");
$("roster").querySelectorAll(".chip").forEach(b=>b.onclick=()=>showHero(+b.dataset.i,+b.dataset.i>cur?1:-1));
function showHero(i,dir){i=(i+HEROES.length)%HEROES.length;const h=HEROES[i],hero=$("hero");
  const paint=()=>{cur=i;$("hero-img").src=IMG[h.id];$("i-tag").textContent=h.tag;$("i-type").textContent=h.type;$("i-desc").textContent=h.desc;
    $("i-stats").innerHTML=Object.entries(h.stats).map(([k,v])=>`<div class="stat"><span>${k}</span><span class="bar"><i style="width:${v*20}%"></i></span></div>`).join("");
    document.querySelectorAll(".chip").forEach((c,k)=>c.classList.toggle("on",k===i));hero.classList.remove("out-l","out-r");};
  if(dir){hero.classList.add(dir>0?"out-l":"out-r");SFX.tick();setTimeout(paint,180);}else paint();}
$("prev").onclick=()=>showHero(cur-1,-1);$("next").onclick=()=>showHero(cur+1,1);
let sx=null;$("pick").addEventListener("pointerdown",e=>{if(!e.target.closest("button"))sx=e.clientX;});
$("pick").addEventListener("pointerup",e=>{if(sx===null)return;const d=e.clientX-sx;sx=null;if(Math.abs(d)>50)showHero(cur+(d<0?1:-1),d<0?1:-1);});
$("choose").onclick=()=>{const h=HEROES[cur];SFX.pick();$("hero").classList.add("cheer");setTimeout(()=>$("hero").classList.remove("cheer"),700);
  setTimeout(()=>askName(h),350);};
const BZ_NAME=(()=>{try{return (localStorage.getItem("bz_name")||"").trim();}catch(e){return "";}})();
if(BZ_NAME&&S.name&&S.name!==BZ_NAME){S.name=BZ_NAME;save();}
if(BZ_NAME){const k=document.querySelector("#pick .pick-head .kicker");if(k)k.textContent=BZ_NAME+"，你好！";}
function askName(h){
  if(BZ_NAME){S.hero=h.id;S.name=BZ_NAME;save();SFX.win();flashTo(openHub);return;}
  const p=modal(`<div class="namecard" style="display:grid;gap:16px"><div class="por" style="position:static;height:auto"><img src="${IMG[h.id]}" alt=""></div><div class="body">
    <div class="kicker">STEP 2 ／ 2</div><h2>幫你的探險家取名字</h2>
    <label class="field" for="n-name">探險家名字（劇情裡的人會這樣叫你）<input id="n-name" maxlength="8" autocomplete="off" placeholder="最多 8 個字" value="${S.hero===h.id?esc(S.name):""}"></label>
    <button class="dice" id="n-dice">隨機給我一個名字</button><div class="err" id="n-err"></div>
    <div class="row"><button class="btn ghost" id="n-back">換一位</button><button class="btn" id="n-ok">確定</button></div></div></div>`);
  p.querySelector(".namecard").style.gridTemplateColumns=innerWidth<820?"90px minmax(0,1fr)":"140px minmax(0,1fr)";
  $("n-name").focus();
  $("n-dice").onclick=()=>{$("n-name").value=h.names[Math.random()*h.names.length|0];SFX.tick();};
  $("n-back").onclick=closeModal;
  $("n-name").addEventListener("keydown",e=>{if(e.key==="Enter")$("n-ok").click();});
  $("n-ok").onclick=()=>{const v=$("n-name").value.trim();if(!v){$("n-err").textContent="先幫探險家取個名字吧！";return;}
    S.hero=h.id;S.name=v;save();closeModal();SFX.win();flashTo(openHub);};
}

/* ================= 時光基地 ================= */
const eraOf=ch=>ERAS.find(x=>x.id===ch.era)||ERAS[0];
const eraChs=id=>CHAPTERS.filter(c=>c.era===id);
const eraBossWon=er=>S.g.includes(er.boss.flag);
function eraOpen(i){const er=ERAS[i];if(!er||!eraChs(er.id).length)return false;return i===0||eraBossWon(ERAS[i-1]);}
function chapterUnlocked(i){const c=CHAPTERS[i],list=eraChs(c.era),k=list.indexOf(c);return k===0?eraOpen(ERAS.indexOf(eraOf(c))):chs(list[k-1].id).done;}
function openHub(){
  show("hub");closeVN();music.set(HUB_MUSIC);
  const h=heroOf(S.hero);$("hub-face").src=IMG[h.id];$("hub-name").textContent=S.name;$("hub-type").textContent=h.type+" · 時光探險隊";
  $("hub-pet").hidden=!S.pet.has;
  let sel=ERAS.findIndex(x=>x.id===S.era);if(sel<0||!eraOpen(sel)){sel=0;ERAS.forEach((x,i)=>{if(eraOpen(i))sel=i;});}S.era=ERAS[sel].id;
  $("eras").innerHTML=ERAS.map((er,i)=>{const list=eraChs(er.id),open=eraOpen(i),dc=list.filter(c=>chs(c.id).done).length;
    return `<button class="era ${open?"open":"locked"} ${i===sel?"sel":""}" data-i="${i}"><span class="im" style="background-image:url(${IMG[er.img]})"></span>
    ${open?`<span class="prog">${eraBossWon(er)?"✦ 已破關":dc+"/"+list.length+" 章"}</span>`:`<span class="lock">${list.length?"🔒 先打敗上一個時代的魔王":"時光門修復中"}</span>`}<span class="tx"><b>${er.name}</b><span>${er.years}</span></span></button>`;}).join("");
  $("eras").querySelectorAll(".era").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,er=ERAS[i];
    if(!eraOpen(i)){toast(eraChs(er.id).length?`先完成「${ERAS[i-1].name}」並打敗${ERAS[i-1].boss.name}，才能打開這道時光門！`:"這個時代的時光門還在修復中，敬請期待！");return;}
    S.era=er.id;save();SFX.tick();openHub();});
  const er=ERAS[sel],list=eraChs(er.id);
  $("chapters").innerHTML=list.map(c=>{const i=CHAPTERS.indexOf(c),st=chs(c.id),ok=chapterUnlocked(i);
    return `<button class="chap ${ok?"":"locked"}" data-i="${i}"><span class="th" style="background-image:url(${IMG["thumb_"+c.id]})"></span><span><span>${c.seal}</span><b>${c.title}</b>
      <span class="st">${st.done?"★".repeat(st.stars)+"☆".repeat(3-st.stars):ok?(st.flags.length>1?"進行中…":"可以出發"):"🔒 完成上一章解鎖"}</span></span></button>`;}).join("");
  $("chapters").querySelectorAll(".chap").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!chapterUnlocked(i)){toast("先完成上一章，才能打開這一章喔！");return;}enterChapter(i);});
  const anyDone=list.some(c=>chs(c.id).done),allDone=list.every(c=>chs(c.id).done);
  $("hub-battle").innerHTML=anyDone?`<span style="font-size:34px">⚔️</span><div class="sp"><b>答題對決：${er.boss.name}</b><span>${allDone&&!eraBossWon(er)?"這個時代的章節都完成了，快去打倒魔王！":"題目每次隨機，從這個時代已完成的章節出題。答對還能拿到夥伴的食物！"}最佳紀錄：${S.battle.bestCorrect} 題答對${S.battle.wins?`・勝利 ${S.battle.wins} 次`:""}</span></div><button class="btn" id="hub-fight">${allDone&&!eraBossWon(er)?"迎戰魔王":"開始對決"}</button>`
    :`<span style="font-size:34px;opacity:.5">⚔️</span><div class="sp"><b>答題對決</b><span>完成這個時代的第一章後開放。</span></div>`;
  if(anyDone)$("hub-fight").onclick=()=>startBattle({story:allDone&&!eraBossWon(er),era:er.id});
  S.cur=null;save();
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(!b)return;const w=b.dataset.open;
  if(w==="bag")openBag();if(w==="book")openBook();if(w==="cabinet")openCabinet();if(w==="pet")openPet();});
document.addEventListener("click",e=>{const b=e.target.closest('[data-act="settings"]');if(b)openSettings();});
document.addEventListener("click",e=>{const b=e.target.closest('[data-act="home"]');if(b){dropHeld();openHub();}});
document.addEventListener("click",e=>{const b=e.target.closest('[data-act="hint"]');if(b)giveHint();});

function openSettings(){
  modal(`<div class="panel-head"><h2>設定</h2><button class="x" id="st-x">✕</button></div>
    <div style="display:grid;gap:10px">
      <button class="btn ghost" id="st-hero" style="text-align:left">換探險家或改名字</button>
      <button class="btn ghost" id="st-reset" style="text-align:left">清除全部進度（重新開始整個遊戲）</button>
    </div><p class="hint" style="font-size:13px;color:var(--paper-dim)">進度會自動存在這台裝置。重玩某一章，請到時光基地點那一章，再按「重玩這一章」。</p>`);
  $("st-x").onclick=closeModal;
  $("st-hero").onclick=()=>{closeModal();show("pick");showHero(Math.max(0,HEROES.findIndex(h=>h.id===S.hero)),0);};
  $("st-reset").onclick=()=>{$("st-reset").outerHTML=`<button class="btn" id="st-reset2" style="background:var(--cinnabar);color:#fff;box-shadow:none">真的要清除？再按一次</button>`;
    $("st-reset2").onclick=()=>{S=fresh();save();closeModal();show("cover");};};
}

/* ================= 條件與效果 ================= */
let CH=null;
function test(cond){const st=CH?chs(CH.id):null;
  return (cond||[]).every(c=>{const neg=c[0]==="!";c=neg?c.slice(1):c;const [k,v]=c.split(":");let r=false;
    if(k==="f")r=st&&st.flags.includes(v);else if(k==="i")r=(S.bag[v]||0)>0;else if(k==="c")r=S.cards.includes(v);
    else if(k==="pet")r=S.pet.has&&petLevel()>=(+v||1);else if(k==="g")r=S.g.includes(v);
    return neg?!r:r;});}
function addItem(id,n=1){S.bag[id]=(S.bag[id]||0)+n;const it=ITEMS[id];if(it&&it.kind==="treasure"&&!S.cab.includes(id))S.cab.push(id);}

  const fx=V.w?V.x/V.w:V.x0||0;V.w=w;V.h=h;V.x=fx*w;V.y=Math.min(0,Math.max(vh-h,V.y||(vh-h)/2));
  strip.style.height=h+"px";strip.querySelectorAll(".seg").forEach(s=>s.style.width=w+"px");applyPano();}
function applyPano(){V.x=((V.x%V.w)+V.w)%V.w;const vh=pano.clientHeight;V.y=Math.min(0,Math.max(vh-V.h,V.y));
  strip.style.transform=`translate(${-V.x}px,${V.y}px)`;drawCompass();}
function buildPano(){const P=PANO[CH.pano];strip.innerHTML="";
  for(let k=0;k<2;k++){const seg=document.createElement("div");seg.className="seg";seg.innerHTML=`<img src="${IMG["pano_"+CH.pano]}" alt="">`;strip.appendChild(seg);}
  V={x:0,y:0,w:0,h:0};V.x0=spotFrac(CH.start||{s:"a",x:30})-.5*pano.clientWidth/(pano.clientHeight*1.04*P.L/P.H);layoutPano();renderSpots();}
function spotFrac(sp){const P=PANO[CH.pano];const px=sp.s==="b"?(P.WA-P.ov+sp.x/100*P.W0-P.tBL):(sp.x/100*P.W0-P.tAL);return (((px%P.L)+P.L)%P.L)/P.L;}
pano.addEventListener("pointerdown",e=>{drag={sx:e.clientX,sy:e.clientY,x0:V.x,y0:V.y};dragMoved=false;});
addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>7){dragMoved=true;pano.classList.add("drag");}
  if(dragMoved){V.x=drag.x0-dx;V.y=drag.y0+dy;applyPano();}});
addEventListener("pointerup",()=>{drag=null;pano.classList.remove("drag");setTimeout(()=>dragMoved=false,0);});
pano.addEventListener("wheel",e=>{V.x+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY);applyPano();e.preventDefault();},{passive:false});
function panBy(dx){const s=V.x,t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/450);V.x=s+dx*(1-(1-k)**3);applyPano();if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
$("pl").onclick=()=>panBy(-pano.clientWidth*.45);$("pr").onclick=()=>panBy(pano.clientWidth*.45);
addEventListener("keydown",e=>{if($("play").hidden||!$("vn").hidden||!$("modal").hidden)return;if(e.key==="ArrowLeft")panBy(-200);if(e.key==="ArrowRight")panBy(200);});

function drawCompass(){if(!CH||!V.w)return;const vw=pano.clientWidth,center=(V.x+vw/2)/V.w;const tape=$("tape"),W=tape.clientWidth;
  const dirs=[["北",0],["東",.25],["南",.5],["西",.75]];let html="";
  const place=(f)=>{let d=f-center;d=((d+.5)%1+1)%1-.5;return W/2+d*W*1.6;};
  dirs.forEach(([n,f])=>{const x=place(f);if(x>-20&&x<W+20)html+=`<span class="tick" style="left:${x}px">${n}</span>`;});
  CH.spots.forEach(sp=>{if(!spotVisible(sp))return;if(!isNew(sp))return;const x=place(spotFrac(sp));if(x>-6&&x<W+6)html+=`<span class="dot ${sp.kind==="obj"?"obj":""}" style="left:${x}px"></span>`;});
  tape.innerHTML=html;}

async function sniff(){if(!CH)return;const st=chs(CH.id);SFX.tick();const b=$("pet-btn");b.classList.remove("hop");void b.offsetWidth;b.classList.add("hop");

function craft(c){return new Promise(res=>{const need=c.mode==="tap"?8:100;let prog=0;
  const p=modal(`<div class="craft"><div class="kicker">${esc(c.kicker||(c.mode==="tap"?"打製石器":"磨製石器"))}</div><h2>${esc(c.title)}</h2>
    <div class="craft-pad" id="cp">${icon(c.from)}<span class="chips" id="chips"></span></div>
    <div class="lbl">${esc(c.lbl||(c.mode==="tap"?"用力「敲打」石頭！（連點石頭）":"按住石頭，來回「磨」它！（按住左右拖動）"))}</div>
    <div class="meter"><span class="bar"><i id="cm" style="width:0%"></i></span></div></div>`);
  $("modal").dataset.lock="1";const pad=$("cp");
  const done=async()=>{SFX.win();pad.innerHTML=icon(c.to);await sleep(900);delete $("modal").dataset.lock;closeModal();if(c.take)takeItem(c.take);addItem(c.to);save();
    toast(`${icon(c.to)}<span>完成「${ITEMS[c.to].name}」！</span>`);res();};
  const bump=v=>{prog=Math.min(need,prog+v);$("cm").style.width=prog/need*100+"%";if(prog>=need){pad.onpointerdown=pad.onpointermove=null;done();}};
  if(c.mode==="tap"){pad.onpointerdown=e=>{SFX.chip();pad.classList.add("hit");setTimeout(()=>pad.classList.remove("hit"),80);
      for(let i=0;i<4;i++){const ch=document.createElement("i");const r=pad.getBoundingClientRect();ch.style.left=(e.clientX-r.left)+"px";ch.style.top=(e.clientY-r.top)+"px";ch.style.setProperty("--dx",(Math.random()*120-60)+"px");ch.style.setProperty("--dy",(Math.random()*-90)+"px");$("chips").appendChild(ch);setTimeout(()=>ch.remove(),650);}
      bump(1);};}
  else{let last=null,down=false;pad.onpointerdown=e=>{down=true;last=e.clientX;pad.setPointerCapture(e.pointerId);};pad.onpointerup=()=>down=false;
    pad.onpointermove=e=>{if(!down)return;const d=Math.abs(e.clientX-last);last=e.clientX;if(d>2){bump(d/14);if(Math.random()<.3)SFX.rub();pad.querySelector(".ic").style.transform=`translateX(${(e.clientX-pad.getBoundingClientRect().left-pad.clientWidth/2)*.15}px)`;}};}
});}

/* ================= 對決 ================= */
let B=null;
function startBattle({story,era}){const ER=ERAS.find(x=>x.id===era)||(CH?eraOf(CH):ERAS[0]);const avail=eraChs(ER.id).filter(c=>chs(c.id).done).map(c=>c.id);

    $("b-boss-img").src=IMG[ER.boss.img];$("b-bossname").textContent=ER.boss.name;$("b-hero-img").src=IMG[S.hero];$("b-myname").textContent=S.name;

    $("b-q").innerHTML=`<div class="qt">${esc(T(intro.map(l=>l[1]).join(" ")))}</div><div class="row">${lv>=2?`<span style="font-size:13px;color:#ff9db0;align-self:center">${esc(S.pet.name)}幫你加油：多一顆愛心！${lv>=3?"還會幫你擋一次攻擊！":""}</span>`:""}<button class="btn" id="b-start">開始！</button></div>`;
    $("b-start").onclick=nextQ;});}
function renderBHud(){$("b-hearts").textContent="♥".repeat(B.hearts)+"♡".repeat(Math.max(0,B.maxHearts-B.hearts))+(B.guard?" 🛡":"");$("b-bosshp").style.width=Math.max(0,B.hp)+"%";}
function floatText(el,txt,cls=""){const r=el.getBoundingClientRect(),d=document.createElement("div");d.className="dmg "+cls;d.textContent=txt;d.style.left=(r.left+r.width/2-30)+"px";d.style.top=(r.top+r.height*.3)+"px";$("battle").appendChild(d);setTimeout(()=>d.remove(),1000);}

function nextQ(){clearInterval(B.timer);if(B.hp<=0)return endBattle(true);if(B.hearts<=0)return endBattle(false);if(B.i>=B.qs.length)return endBattle(B.hp<=0);
  const q=B.qs[B.i],opts=shuffle(q.o.map((t,j)=>({t,ok:j===q.a})));let answered=false,left=25;
  $("b-q").innerHTML=`<div class="qm"><span>第 ${B.i+1} / ${B.qs.length} 題${B.combo>=2?`　🔥 連擊 ×${B.combo}`:""}</span><span id="b-tl">${left} 秒</span></div><div class="timer"><i id="b-tb"></i></div>
    <div class="qt">${esc(q.q)}</div><div class="b-opts">${opts.map((o,k)=>`<button class="b-opt" data-k="${k}"><span class="ab">${"ABCD"[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
    <div class="b-skills"><button class="b-skill" id="b-lens" ${B.lens?"":"disabled"}>🔍 放大鏡：刪掉兩個錯的（剩 ${B.lens}）</button></div><div id="b-why"></div>`;
  const tb=$("b-tb");tb.style.transition="none";tb.style.transform="scaleX(1)";requestAnimationFrame(()=>{tb.style.transition="transform 25s linear";tb.style.transform="scaleX(0)";});
  B.timer=setInterval(()=>{left--;const tl=$("b-tl");if(tl)tl.textContent=left+" 秒";if(left<=0){clearInterval(B.timer);if(!answered){answered=true;resolve(null);}}},1000);

}
async function endBattle(win){clearInterval(B.timer);if(B.hp<=0)win=true;
  const counts={};B.food.forEach(f=>{counts[f]=(counts[f]||0)+1;addItem(f);});
  S.battle.plays++;if(win)S.battle.wins++;S.battle.bestCorrect=Math.max(S.battle.bestCorrect,B.correct);
  const ER=B.er,RW=ER.boss.reward;let firstWin=false;if(win&&!S.g.includes(ER.boss.flag)&&(B.story||eraChs(ER.id).every(c=>chs(c.id).done))){S.g.push(ER.boss.flag);firstWin=true;addItem(RW);const ids=eraChs(ER.id).map(c=>c.id);Object.keys(S.bag).forEach(id=>{const it=ITEMS[id];if(it&&it.kind==="tool"&&ids.includes(it.ch))delete S.bag[id];});}
  save();if(win)SFX.win();else SFX.no();
  const stars=win?(B.hearts>=B.maxHearts-1?3:B.hearts>=2?2:1):0;
  const foodTxt=Object.entries(counts).map(([id,n])=>`${icon(id)} ${esc(ITEMS[id].name)} ×${n}`).join("　")||"這次沒有拿到食物";
  modal(`<div class="kicker">${win?"對決勝利":"這次先撤退"}</div><h2>${win?`打退${esc(ER.boss.name)}！`:"差一點點……再挑戰一次！"}</h2>
    ${win?`<p style="font-size:40px;color:var(--brass-hi);letter-spacing:8px;margin:0">${"★".repeat(stars)}${"☆".repeat(3-stars)}</p>`:""}
    <p>答對 ${B.correct} / ${B.i} 題${S.battle.bestCorrect===B.correct&&B.correct>0?"（最佳紀錄！）":""}<br>夥伴食物：${foodTxt}</p>
    ${firstWin?`<div class="item-detail">${icon(RW)}<div><b>得到寶物：${esc(ITEMS[RW].name)}</b><p>${esc(T(ITEMS[RW].desc))}</p></div></div>`:""}
    <div class="row"><button class="btn ghost" id="e-again">再打一次</button><button class="btn" id="e-home">回時光基地</button></div>`);
  $("modal").dataset.lock="1";
  $("e-again").onclick=()=>{delete $("modal").dataset.lock;closeModal();startBattle({story:false,era:ER.id});};
  $("e-home").onclick=async()=>{delete $("modal").dataset.lock;closeModal();if(firstWin){show("hub");await playLines(ER.boss.outro);closeVN();const nx=ERAS[ERAS.indexOf(ER)+1];if(nx&&eraChs(nx.id).length)S.era=nx.id;}openHub();};
}

/* ================= 啟動 ================= */
syncMusicBtns();
if(S.hero&&S.name){$("go").textContent="繼續冒險";}
window.onCloudLoaded=()=>{if(BZ_NAME&&S.hero)S.name=BZ_NAME;if(S.hero&&S.name)$("go").textContent="繼續冒險";};

</script>
