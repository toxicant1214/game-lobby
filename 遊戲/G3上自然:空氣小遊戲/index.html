<title>空氣和水大冒險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：一張「天空 × 水」的冒險地圖，四個世界卡片；遊戲畫面上方實驗台、下方題目卡 */
:root{
  --sky:#E3F2FA; --paper:#FFFFFF; --ink:#173349; --soft:#5C7A8E;
  --sea:#1C8DB7; --sea-l:#BFE4F3; --leaf:#2F9E5F; --sun:#F2AE2E; --coral:#E25A45;
  --line:#CCE2EE; --air:#F3FAFE;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font-family:var(--display);font-size:18px;cursor:pointer;border:0;border-radius:14px;padding:10px 18px;background:var(--sea);color:#fff;box-shadow:0 3px 0 #0E5F7E;transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #0E5F7E}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.ghost{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
button.warn{background:var(--coral);box-shadow:0 3px 0 #9E3727}
button:disabled{opacity:.45;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-size:28px;color:var(--sea)}
.chip{font-family:var(--display);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:16px}
.panel{background:var(--paper);border-radius:20px;padding:18px;border:2px solid var(--line)}
.hero{display:block}
.hero>*,.world>*,.stage>*,.gamehead>*{min-width:0}
.hero p{margin:4px 0 0;color:var(--soft)}
.namerow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.namerow input{flex:1 1 200px;width:100%;min-width:0;font-size:18px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);font-family:var(--body)}
.players{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.players button{font-size:15px;padding:4px 12px;box-shadow:none;background:var(--sky);color:var(--ink)}
.players button.on{background:var(--sun);color:var(--ink)}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.worlds{grid-template-columns:1fr}.namerow button{flex:1 1 100%}.logo h1{font-size:24px}.world{grid-template-columns:56px 1fr}.world .ico{width:56px;height:56px}.world .ico svg{width:44px;height:44px}}
.world{position:relative;text-align:left;background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.world .ico{width:72px;height:72px;border-radius:16px;display:grid;place-items:center}
.world h3{font-size:21px}
.world .sub{font-family:var(--body);font-size:14px;color:var(--soft);line-height:1.4}
.world .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:15px}
.stars{color:var(--sun);letter-spacing:2px}
.stars .off{color:var(--line)}
.world.locked{opacity:.55}
.world .lock{font-family:var(--body);font-size:14px;color:var(--coral)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.gamehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gamehead h2{font-size:24px;flex:1 1 auto}
.score{font-family:var(--display);font-size:20px;color:var(--sea);font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);width:0;transition:width .3s}
.stage{background:var(--paper);border-radius:20px;border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.stage svg{width:100%;height:auto;max-height:360px;display:block}
.tag{font-family:var(--display);color:var(--soft);font-size:15px}
.q{font-family:var(--display);font-size:21px;line-height:1.5}
.opts{display:grid;gap:8px}
.opts button{background:var(--sky);color:var(--ink);box-shadow:0 3px 0 var(--line);text-align:left;font-size:18px}
.opts button.sel{background:var(--sun)}
.opts button.ok{background:var(--leaf);color:#fff;box-shadow:0 3px 0 #1E6B40}
.opts button.bad{background:var(--coral);color:#fff;box-shadow:0 3px 0 #9E3727}
.fb{border-radius:14px;padding:10px 14px;font-size:16px}
.fb.ok{background:#E3F5EA;color:#1E6B40}
.fb.bad{background:#FCE8E4;color:#9E3727}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sent{font-family:var(--display);font-size:22px;line-height:2.1}
.sent button{font-size:22px;padding:2px 8px;margin:2px;background:var(--sky);color:var(--ink);box-shadow:0 2px 0 var(--line);border-radius:10px}
.sent button.ok{background:var(--leaf);color:#fff}
.sent button.bad{background:var(--coral);color:#fff}
.sent button.hint{background:var(--sun)}
.meter{position:relative;height:22px;border-radius:99px;background:linear-gradient(90deg,#D7EEF8,#7CC6E6,#1C8DB7);border:2px solid var(--line);overflow:hidden;flex:1 1 200px}
.meter i{position:absolute;top:0;bottom:0;width:6px;background:var(--ink);border-radius:3px;left:0}
.big{font-size:22px;padding:14px 26px}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result .bigstars{font-size:56px;color:var(--sun);letter-spacing:6px}
.result .bigstars .off{color:var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-size:15px;padding:6px 12px;background:var(--sky);color:var(--ink);box-shadow:none}
.tabs button.on{background:var(--sea);color:#fff}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--display);font-weight:400;color:var(--soft)}
td.n{text-align:right;font-family:var(--display);font-size:19px}
tr.me td{background:#FFF5DD}
.card{border:3px dashed var(--sea);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--air)}
.card .code{font-family:var(--display);font-size:26px;letter-spacing:4px;color:var(--sea)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.small{font-size:14px;color:var(--soft)}
.foot{text-align:center;color:var(--soft);font-size:14px;padding-block:24px 8px}
</style>

<div class="wrap" id="app"></div>

<script>
(()=>{
/* ---------- 工具 ---------- */
const app=document.getElementById('app');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const NS='http://www.w3.org/2000/svg';
function svg(viewBox,inner){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',viewBox);s.innerHTML=inner;return s}
let actx=null;
function sfx(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);const t=actx.currentTime;o.type='triangle';if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.1)}else{o.frequency.setValueAtTime(220,t);o.frequency.setValueAtTime(160,t+.12)}g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}catch(e){}}
function tween(ms,fn){return new Promise(res=>{const t0=performance.now();const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function f(now){let p=reduce?1:Math.min(1,(now-t0)/ms);fn(p);if(p<1)requestAnimationFrame(f);else res()}requestAnimationFrame(f)})}
const ease=p=>1-Math.pow(1-p,3);

/* ---------- 紀錄（存在這台裝置） ---------- */
const KEY='airwater_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{players:{},current:''}}catch(e){return{players:{},current:''}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
let DB=load();
function player(){const n=DB.current;if(!n)return null;if(!DB.players[n])DB.players[n]={best:[0,0,0,0],stars:[0,0,0,0],plays:0};const p=DB.players[n];if(!p.time)p.time=[0,0,0,0];return p}
/* 名次規則：分數高的在前；同分時，秒數少的在前 */
function better(s,t,os,ot){return s>os||(s===os&&s>0&&t>0&&(!ot||t<ot))}
function fmt(sec){if(!sec)return '—';sec=Math.round(sec);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function cmpRow(a,b){return b.v-a.v||((a.t||1e9)-(b.t||1e9))}

/* ====== Supabase 設定（和水生植物、第 1 單元同一個專案，資料存在 air_water_scores 表） ====== */
const SUPABASE_URL="https://wbxpqyrkgdaqvtsmijoe.supabase.co";
const SUPABASE_KEY="sb_publishable_04ZnsTSBxbREalRf2NWfeA_L1rzM9V4"; /* anon / publishable key，可以公開 */
const WKEY=['w1','w2','w3','w4'];
const REMOTE=/*CLOUD_ON*/true;
function sb(path,body){return fetch(SUPABASE_URL+path,{method:body?'POST':'GET',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text().then(t=>t?JSON.parse(t):null)})}
function pid(name){const s=name+'|';let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}return 'p'+(h>>>0).toString(36)}
/* 換裝置時，從資料庫把自己的進度接回來 */
async function pullMine(){if(!REMOTE||!DB.current)return;try{
  const rows=await sb('/rest/v1/air_water_scores?player_id=eq.'+pid(DB.current)+'&world=in.(w1,w2,w3,w4)&select=world,score,secs,stars')||[];
  const p=player();rows.forEach(r=>{const i=WKEY.indexOf(r.world);if(i<0)return;
    if(better(r.score,r.secs,p.best[i],p.time[i])){p.best[i]=r.score;p.time[i]=r.secs}p.stars[i]=Math.max(p.stars[i],r.stars)});save()}catch(e){}}
/* 送出這一關和總分，回傳這一關的名次 */
async function pushScore(i,secs,stars){const p=player();const id=pid(DB.current);
  const rank=await sb('/rest/v1/rpc/submit_air_water',{p_world:WKEY[i],p_id:id,p_name:DB.current,p_score:p.best[i],p_secs:p.time[i]||secs,p_stars:p.stars[i]});
  const tot=p.best.reduce((a,b)=>a+b,0),ts=p.time.reduce((a,b,k)=>a+(p.best[k]>0?(b||0):0),0)||secs;
  await sb('/rest/v1/rpc/submit_air_water',{p_world:'total',p_id:id,p_name:DB.current,p_score:tot,p_secs:ts,p_stars:p.stars.reduce((a,b)=>a+b,0)});
  return rank}
async function cloudBoard(world){const rows=await sb('/rest/v1/air_water_scores?world=eq.'+world+'&select=name,score,secs&order=score.desc,secs.asc&limit=30')||[];
  return rows.map(r=>({n:r.name,v:r.score,t:r.secs}))}
function starsFor(s,m){const r=s/m;return r>=.9?3:r>=.7?2:r>=.4?1:0}
function starStr(n){return '<span class="stars">'+'★'.repeat(n)+'<span class="off">'+'★'.repeat(3-n)+'</span></span>'}

/* ---------- 世界設定 ---------- */
const WORLDS=[
 {name:'實驗模擬室',sub:'壓注射筒、刺破氣球、杯子壓進水裡，先猜再動手',color:'#BFE4F3',ico:'<rect x="26" y="8" width="20" height="44" rx="4" fill="#fff" stroke="#173349" stroke-width="3"/><rect x="29" y="30" width="14" height="19" fill="#7CC6E6"/><rect x="33" y="52" width="6" height="8" fill="#173349"/><rect x="20" y="4" width="32" height="6" rx="3" fill="#173349"/>',run:labWorld},
 {name:'改錯小偵探',sub:'每句話藏了一個錯，找出來再說出正確說法',color:'#FDE7B8',ico:'<circle cx="30" cy="30" r="16" fill="#fff" stroke="#173349" stroke-width="4"/><line x1="42" y1="42" x2="58" y2="58" stroke="#173349" stroke-width="6" stroke-linecap="round"/><text x="30" y="37" font-size="18" text-anchor="middle" fill="#E25A45" font-weight="700">?</text>',run:detectiveWorld},
 {name:'風力推推樂',sub:'控制風和水柱的力量，把帆船、紙杯車送到終點',color:'#D4F0DE',ico:'<path d="M14 48 L50 48 L44 56 L20 56Z" fill="#E25A45"/><path d="M32 12 L32 46 L14 46Z" fill="#fff" stroke="#173349" stroke-width="3"/><path d="M36 18 Q52 30 36 44" fill="none" stroke="#1C8DB7" stroke-width="3"/>',run:windWorld},
 {name:'颱風防災任務',sub:'颱風要來了！答對題目幫家裡加上防護罩',color:'#FAD6CF',ico:'<path d="M32 10 C50 10 56 26 44 32 C56 38 46 56 32 54 C14 54 8 38 20 32 C8 26 14 10 32 10Z" fill="none" stroke="#173349" stroke-width="4"/><circle cx="32" cy="32" r="6" fill="#E25A45"/>',run:typhoonWorld}
];

/* ---------- 畫面：首頁 ---------- */
function header(){
  const p=DB.current;
  return el('div',{class:'top'},
    el('div',{class:'logo'},el('span',{html:'<svg width="40" height="40" viewBox="0 0 40 40"><circle cx="16" cy="18" r="11" fill="#fff" stroke="#1C8DB7" stroke-width="3"/><path d="M28 8 C34 16 36 22 36 26 a8 8 0 0 1-16 0 c0-4 2-10 8-18z" fill="#7CC6E6" stroke="#1C8DB7" stroke-width="3"/></svg>'}),el('h1',{},'空氣和水大冒險')),
    p?el('span',{class:'chip'},'玩家：'+p):null);
}
function home(){
  const bzN=(function(){try{return localStorage.getItem('bz_name')||''}catch(e){return ''}})();
  if(bzN&&DB.current!==bzN){DB.current=bzN;player();save();if(REMOTE)pullMine().then(home);}
  app.innerHTML='';
  app.append(header());
  const pl=player();
  const input=el('input',{id:'nm',placeholder:'輸入你的名字',maxlength:'12',value:DB.current||''});if(bzN)input.readOnly=true;
  const names=Object.keys(DB.players);
  app.append(el('div',{class:'panel hero'},
    el('div',{},el('h2',{style:'font-size:22px'},'三上自然 第 2 單元：空氣和水'),
      el('p',{},'四個世界，答對拿分數和星星，每關都會計時。分數一樣時，比誰的時間短。'),
      el('div',{class:'namerow'},input,el('button',{onclick:()=>{const v=input.value.trim();if(!v){input.classList.add('shake');setTimeout(()=>input.classList.remove('shake'),400);input.focus();return}DB.current=v;player();save();home();if(REMOTE)pullMine().then(home)}},'就是我')),
      (names.length&&!bzN)?el('div',{class:'players'},el('span',{class:'small'},'這台裝置玩過的人：'),names.map(n=>el('button',{class:n===DB.current?'on':'',onclick:()=>{DB.current=n;save();home()}},n))):null
    )));
  const grid=el('div',{class:'worlds'});
  WORLDS.forEach((w,i)=>{
    const unlocked=i===0||(pl&&pl.stars[i-1]>=1);
    const b=el('button',{class:'world'+(unlocked?'':' locked'),onclick:()=>{if(!pl){input.focus();input.classList.add('shake');setTimeout(()=>input.classList.remove('shake'),400);return}if(unlocked)play(i)}},
      el('div',{class:'ico',style:'background:'+w.color,html:'<svg width="56" height="56" viewBox="0 0 64 64">'+w.ico+'</svg>'}),
      el('div',{},el('h3',{},'世界 '+(i+1)+'　'+w.name),el('div',{class:'sub'},w.sub),
        el('div',{class:'meta',html:starStr(pl?pl.stars[i]:0)+(unlocked?'<span>最高 '+(pl?pl.best[i]:0)+' 分'+(pl&&pl.time[i]?'・'+fmt(pl.time[i]):'')+'</span>':'<span class="lock">🔒 上一關拿到 1 顆星就打開</span>')})));
    if(!unlocked)b.setAttribute('aria-disabled','true');
    grid.append(b);
  });
  app.append(grid);
  app.append(el('div',{class:'row'},el('button',{class:'ghost',onclick:()=>board(0)},'排行榜'),pl?el('button',{class:'ghost',onclick:card},'我的成績卡'):null));
}

/* ---------- 排行榜 ---------- */
async function board(tab=0){
  if(typeof tab!=='number')tab=0;
  app.innerHTML='';app.append(header());
  const tabs=['總分',...WORLDS.map(w=>w.name)];
  let rows=[],failed=false;
  if(REMOTE){app.append(el('div',{class:'panel'},'正在讀取排行榜…'));
    try{rows=await cloudBoard(tab===0?'total':WKEY[tab-1])}catch(e){failed=true}
    app.innerHTML='';app.append(header());}
  else rows=Object.entries(DB.players).map(([n,p])=>{const tm=p.time||[0,0,0,0];return tab===0
      ?{n,v:p.best.reduce((a,b)=>a+b,0),t:tm.reduce((a,b,i)=>a+(p.best[i]>0?(b||0):0),0)}
      :{n,v:p.best[tab-1],t:tm[tab-1]}}).filter(r=>r.v>0).sort(cmpRow);
  const tbl=el('table',{},el('tr',{},el('th',{},'名次'),el('th',{},'名字'),el('th',{style:'text-align:right'},'時間'),el('th',{style:'text-align:right'},'分數')));
  rows.forEach((r,i)=>tbl.append(el('tr',{class:r.n===DB.current?'me':''},el('td',{},i<3?['🥇','🥈','🥉'][i]:String(i+1)),el('td',{},r.n),el('td',{style:'text-align:right'},fmt(r.t)),el('td',{class:'n'},String(r.v)))));
  let armed=false;
  const clr=el('button',{class:'ghost',onclick:()=>{if(!armed){armed=true;clr.textContent='再按一次確定清除';clr.className='warn';return}DB={players:{},current:''};save();home()}},'清除這台裝置的紀錄');
  app.append(el('div',{class:'panel',style:'display:flex;flex-direction:column;gap:12px'},

/* 題目卡：單選 / 複選，回傳是否答對 */
function ask(parent,{q,opts,ans,explain,multi=false,tag}){
  return new Promise(res=>{
    const box=el('div',{style:'display:flex;flex-direction:column;gap:10px'});
    if(tag)box.append(el('div',{class:'tag'},tag));
    box.append(el('div',{class:'q'},q));
    const order=multi?shuffle(opts.map((_,i)=>i)):opts.map((_,i)=>i);
    const wrap=el('div',{class:'opts'});const sel=new Set();let done=false;
    const btns={};
    const good=multi?new Set(ans):new Set([ans]);
    function judge(){
      done=true;
      const ok=multi?(sel.size===good.size&&[...sel].every(x=>good.has(x))):sel.has(ans);
      Object.entries(btns).forEach(([k,b])=>{k=+k;b.disabled=true;b.style.opacity=1;b.classList.remove('sel');if(good.has(k))b.classList.add('ok');else if(sel.has(k))b.classList.add('bad')});
      sfx(ok);
      box.append(el('div',{class:'fb '+(ok?'ok':'bad')},(ok?'答對了！':'差一點！')+(explain?' '+explain:'')));
      const nx=el('button',{onclick:()=>{box.remove();res(ok)}},'下一步 →');
      if(okBtn)okBtn.remove();
      box.append(el('div',{class:'ctrl'},nx));nx.focus({preventScroll:true});
    }
    order.forEach(i=>{const b=el('button',{onclick:()=>{if(done)return;if(multi){sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel')}else{sel.add(i);judge()}}},(multi?'□ ':'')+opts[i]);btns[i]=b;wrap.append(b)});
    box.append(wrap);
    let okBtn=null;
    if(multi){box.insertBefore(el('div',{class:'small'},'可以選很多個，選好按「確定」'),wrap);okBtn=el('button',{onclick:()=>{if(!sel.size)return;judge()}},'確定');box.append(okBtn)}
    parent.append(box);
    box.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}
function waitBtn(parent,label,cls=''){return new Promise(r=>{const b=el('button',{class:'big '+cls,onclick:()=>{b.remove();r()}},label);parent.append(b)})}

    await new Promise(res=>{
      c.p.forEach((t,j)=>{const b=el('button',{onclick:()=>{if(sent.dataset.done)return;sent.dataset.done=1;
        if(j===c.w){b.classList.add('ok');sfx(true);ctx.add(10);S.insertBefore(el('div',{class:'fb ok'},'抓到了！就是這裡錯了。'),fixBox)}
        else{b.classList.add('bad','shake');parts[c.w].classList.add('hint');sfx(false);S.insertBefore(el('div',{class:'fb bad'},'不是這裡喔，錯的是黃色那一段。'),fixBox)}
        res()}},t);parts.push(b);sent.append(b)});
      S.append(sent);var fixBox=el('div');S.append(fixBox);
    });
    const fb=el('div');S.append(fb);
    const order=shuffle([0,1,2]);
    const ok=await ask(fb,{tag:'第二步',q:'正確的說法應該是？',opts:order.map(k=>c.f[k]),ans:order.indexOf(0)});
    if(ok)ctx.add(10);
    ctx.prog(i+1,N);
  }
  return N*20;
}

/* ================= 世界 3：風力推推樂 ================= */
async function windWorld(ctx){
  const S=ctx.stage;let max=0;
  const rounds=[
    {kind:'boat',title:'把帆船吹進港口',zone:[.55,.7],tip:'帆船利用空氣的力量前進。'},
    {kind:'car',title:'紙杯車衝過終點線',zone:[.78,.94],tip:'選好紙杯，再控制風力。'},
    {kind:'ball',title:'用水槍把海灘球推到旗子區',zone:[.36,.46],tip:'水也可以傳送動力！'}
  ];
  let done=0;const TOTAL=rounds.length+1+3;
  for(const R of rounds){
    if(!ctx.alive())return 100;
    max+=20;
    S.innerHTML='';
    S.append(el('div',{class:'tag'},R.title+'　'+R.tip));
    const W=640,X0=40,TL=540;
    const s=svg('0 0 640 200','');S.append(s);
    let cup='full';
    function draw(x,blow){
      const zx=X0+R.zone[0]*TL,zw=(R.zone[1]-R.zone[0])*TL;
      const ground=R.kind==='car'?`<rect x="0" y="150" width="640" height="50" fill="#D9CDB8"/><line x1="0" y1="150" x2="640" y2="150" stroke="#B8A88E" stroke-width="3"/>`:`<rect x="0" y="140" width="640" height="60" fill="#7CC6E6"/><path d="M0 140 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#fff" stroke-width="2"/>`;
      const zone=`<rect x="${zx}" y="30" width="${zw}" height="${R.kind==='car'?120:110}" fill="#2F9E5F" opacity=".16"/><line x1="${zx}" y1="30" x2="${zx}" y2="150" stroke="#2F9E5F" stroke-width="2" stroke-dasharray="6 5"/><line x1="${zx+zw}" y1="30" x2="${zx+zw}" y2="150" stroke="#2F9E5F" stroke-width="2" stroke-dasharray="6 5"/><path d="M${zx+zw/2} 30 v-20 l18 6 l-18 6" fill="#E25A45" stroke="#173349" stroke-width="2"/><text x="${zx+zw/2}" y="${R.kind==='car'?172:186}" text-anchor="middle" font-size="15" fill="#173349">${R.kind==='car'?'終點':R.kind==='boat'?'港口':'旗子區'}</text>`;
      let obj='';
      if(R.kind==='boat')obj=`<g transform="translate(${x} 0)"><path d="M-30 128 L30 128 L22 142 L-22 142Z" fill="#E25A45"/><path d="M0 64 L0 126 L-28 126Z" fill="#fff" stroke="#173349" stroke-width="2"/><path d="M2 70 L2 126 L24 126Z" fill="#fff" stroke="#173349" stroke-width="2"/></g>`;
      if(R.kind==='car')obj=`<g transform="translate(${x} 0)"><rect x="-28" y="126" width="56" height="10" rx="3" fill="#F2AE2E"/><circle cx="-18" cy="140" r="8" fill="#173349"/><circle cx="18" cy="140" r="8" fill="#173349"/>${cup==='full'?`<path d="M-26 96 L-26 126 L6 120 L6 102Z" fill="#fff" stroke="#173349" stroke-width="2"/><ellipse cx="-26" cy="111" rx="5" ry="15" fill="#E3F2FA" stroke="#173349" stroke-width="2"/>`:`<path d="M-24 116 L-24 126 L6 124 L6 118Z" fill="#fff" stroke="#173349" stroke-width="2"/>`}</g>`;
      if(R.kind==='ball')obj=`<g transform="translate(${x} 0)"><circle cx="0" cy="124" r="16" fill="#fff" stroke="#173349" stroke-width="2"/><path d="M-16 124 a16 16 0 0 1 32 0" fill="#E25A45"/><path d="M-6 109 a16 16 0 0 1 12 0 v30 a16 16 0 0 1 -12 0z" fill="#1C8DB7" opacity=".8"/></g>`;
      const src=R.kind==='ball'
        ?`<g><rect x="2" y="96" width="34" height="14" rx="4" fill="#F2AE2E" stroke="#173349" stroke-width="2"/><rect x="10" y="108" width="8" height="18" fill="#F2AE2E" stroke="#173349" stroke-width="2"/></g>${blow?`<path d="M36 103 Q${(x+36)/2} 96 ${x-16} 120" stroke="#1C8DB7" stroke-width="5" fill="none" opacity=".7"/>`:''}`
        :`<g><circle cx="18" cy="100" r="16" fill="#fff" stroke="#173349" stroke-width="2"/><path d="M18 100 L18 86 M18 100 L30 108 M18 100 L6 108" stroke="#5C7A8E" stroke-width="4" stroke-linecap="round"/><rect x="15" y="116" width="6" height="30" fill="#5C7A8E"/></g>${blow?[0,1,2].map(i=>`<path d="M40 ${88+i*12} q20 -6 40 0 t40 0" stroke="#9CCDE3" stroke-width="3" fill="none"/>`).join(''):''}`;
      s.innerHTML=ground+zone+src+obj;
    }
    draw(X0,false);
    const info=el('div',{class:'small'},'按住「蓄力」，指針跑到適合的位置就放開。');
    const meter=el('div',{class:'meter'},el('i'));
    const charge=el('button',{class:'big'},R.kind==='ball'?'💦 按住蓄力':'🌀 按住蓄力');
    const cupSel=R.kind==='car'?el('div',{class:'tabs'},
      el('button',{class:'on',onclick:e=>{cup='full';[...cupSel.children].forEach(b=>b.classList.remove('on'));e.currentTarget.classList.add('on');draw(X0,false)}},'完整紙杯'),
      el('button',{onclick:e=>{cup='flat';[...cupSel.children].forEach(b=>b.classList.remove('on'));e.currentTarget.classList.add('on');draw(X0,false)}},'壓扁紙杯')):null;
    const tries=el('span',{class:'tag'},'剩 3 次機會');
    S.append(el('div',{class:'ctrl'},cupSel,tries),el('div',{class:'ctrl'},charge,meter),info);
    let left=3,got=0;
    while(left>0&&ctx.alive()){
      const pw=await new Promise(res=>{
        let v=0,dir=1,on=false,raf;const nd=meter.firstChild;
        const tick=()=>{if(on){v+=dir*.012;if(v>=1){v=1;dir=-1}if(v<=0){v=0;dir=1}nd.style.left='calc('+(v*100)+'% - 3px)';raf=requestAnimationFrame(tick)}};
        const down=e=>{e.preventDefault();if(on)return;on=true;v=0;dir=1;raf=requestAnimationFrame(tick)};
        const up=()=>{if(!on)return;on=false;cancelAnimationFrame(raf);cleanup();res(v)};
        const kd=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){down(e)}};
        function cleanup(){charge.removeEventListener('pointerdown',down);charge.removeEventListener('pointerup',up);charge.removeEventListener('pointerleave',up);charge.removeEventListener('keydown',kd);charge.removeEventListener('keyup',up)}
        charge.addEventListener('pointerdown',down);charge.addEventListener('pointerup',up);charge.addEventListener('pointerleave',up);charge.addEventListener('keydown',kd);charge.addEventListener('keyup',up);
      });
      charge.disabled=true;
      const factor=R.kind==='car'?(cup==='full'?1:.5):1;
      const d=Math.min(1,pw*factor);
      await tween(1100,p=>draw(X0+d*TL*ease(p),p<.6));
      left--;
      const hit=d>=R.zone[0]&&d<=R.zone[1];
      if(hit){got=[20,10,5][2-left];sfx(true);info.textContent='成功！得到 '+got+' 分。';break}
      sfx(false);
      if(d<R.zone[0])info.textContent=(R.kind==='car'&&cup==='flat')?'不夠遠！壓扁的紙杯接到的風比較少，換個紙杯試試？':'不夠遠，力量再大一點。';
      else info.textContent='跑太遠了，力量小一點。';
      tries.textContent='剩 '+left+' 次機會';
      if(left>0){await sleep(900);draw(X0,false);charge.disabled=false}
    }
    if(!ctx.alive())return 100;
    ctx.add(got);done++;ctx.prog(done,TOTAL);
    if(!got)info.textContent='這關沒成功，沒關係，繼續下一關！';
    charge.disabled=true;
    const qa=el('div');S.append(qa);
    if(R.kind==='car'){
      max+=10;
      const ok=await ask(qa,{tag:'想一想',q:'為什麼裝「完整紙杯」的車子跑比較遠？',opts:['接到空氣傳送的動力比較多','完整紙杯比較重','壓扁的紙杯有破洞'],ans:0,explain:'受到空氣傳送的動力愈多，移動的距離愈遠。'});
      if(ok)ctx.add(10);done++;ctx.prog(done,TOTAL);
    }else{await waitBtn(qa,'下一關 →')}
  }
  /* ---- 看旗猜風 ---- */
  const levels=shuffle([0,1,2]);const names=['微風','中等的風','強風'];
  for(let r=0;r<3;r++){
    if(!ctx.alive())return 100;
    max+=10;const L=levels[r];
    S.innerHTML='';S.append(el('div',{class:'tag'},'看旗猜風 '+(r+1)+' / 3　看旗子和樹葉擺動的幅度，判斷風的強弱'));
    const s=svg('0 0 400 230','');S.append(s);
    let t=0,stop=false;
    const droop=[62,28,4][L],amp=[3,7,14][L],spd=[.05,.1,.2][L],lean=[2,8,18][L];
    (function frame(){if(stop)return;t+=1;
      let pts=[];for(let i=0;i<=10;i++){const x=i*11;const y=Math.sin(t*spd*3-i*.7)*amp*(i/10);pts.push([x,y])}
      const top=pts.map(p=>p[0]+','+p[1]).join(' L');const bot=pts.slice().reverse().map(p=>p[0]+','+(p[1]+60)).join(' L');
      s.innerHTML=`<rect x="0" y="200" width="400" height="30" fill="#BFE0B5"/>
        <rect x="118" y="40" width="6" height="165" fill="#5C7A8E"/>
        <g transform="translate(124 44) rotate(${droop+Math.sin(t*spd)*2})"><path d="M${top} L${bot}Z" fill="#E25A45" stroke="#173349" stroke-width="2"/></g>
        <g transform="translate(310 200) rotate(${lean*0.4+Math.sin(t*spd*1.3)*lean*0.3})"><rect x="-6" y="-70" width="12" height="70" fill="#8A5A34"/>
        <g transform="rotate(${lean*0.6})"><ellipse cx="0" cy="-95" rx="44" ry="38" fill="#2F9E5F"/><ellipse cx="-20" cy="-108" rx="22" ry="18" fill="#3FB56E"/></g></g>`;
      requestAnimationFrame(frame)})();
    const qa=el('div');S.append(qa);
    const ok=await ask(qa,{q:'現在吹的是哪一種風？',opts:names,ans:L,explain:['旗子垂下來、只輕輕晃：微風。','旗子斜斜飄起來：中等的風。','旗子被吹平、用力甩動：強風。'][L]});
    stop=true;if(ok)ctx.add(10);done++;ctx.prog(done,TOTAL);
  }
  return max;
}

/* ================= 世界 4：颱風防災任務 ================= */
async function typhoonWorld(ctx){
  const S=ctx.stage;
  const QS=[
    {multi:true,q:'颱風是怎麼形成的？選出「兩個」主要條件',opts:['比較高的海洋溫度','充沛的水氣','冰冷的海水','閃亮的星光'],ans:[0,1],explain:'高溫的海洋加上充沛的水氣，空氣快速流動、旋轉，就形成颱風。'},
    {multi:true,q:'颱風快來了！哪些是正確的準備？',opts:['把招牌固定好','收起店門口的布條','把陽台的盆栽搬進屋裡','到海邊看大浪','把衣服晾在外面'],ans:[0,1,2],explain:'固定、收好容易被吹走的東西，可以減少強風帶來的損害。'},
    {q:'颱風常帶來的災害，哪一個是「錯」的？',opts:['吹倒路樹','豪雨造成水災','招牌被強風破壞','火山爆發'],ans:3,explain:'火山爆發和颱風沒有關係。'},
    {q:'強風來的時候，哪件事最可能發生？',opts:['纜車暫停行駛','路樹完全不會晃動','風箏比較難飛起來'],ans:0,explain:'風太強時，纜車、飛機可能暫停，電線桿也可能被吹倒。'},
    {q:'颱風也會帶來好處嗎？',opts:['會，帶來的雨水可以解除乾旱','不會，只有壞處','會，讓天氣變得又冷又乾'],ans:0,explain:'颱風帶來的雨量是重要的水資源。'},
    {q:'「臺灣在夏天的時候，經常會有颱風。」這句話對嗎？',opts:['○ 對','× 錯'],ans:0},
    {q:'「颱風的形成和植物有關。」這句話對嗎？',opts:['○ 對','× 錯'],ans:1,explain:'颱風和海洋溫度、水氣有關，和植物無關。'}
  ];
  const N=QS.length;let shield=0;
  const hs=svg('0 0 400 210','');
  function drawHouse(n,storm=0,res=null){
    const sh=n>0?`<path d="M80 190 A120 ${70+n*12} 0 0 1 320 190" fill="#BFE4F3" opacity="${.25+n*.08}" stroke="#1C8DB7" stroke-width="${1+n*.6}"/>`:'';
    const sw=storm?`<g transform="translate(${-80+storm*560} 70) rotate(${storm*900})"><path d="M0 -40 C30 -40 40 -10 18 0 C40 10 26 44 0 40 C-30 40 -40 10 -18 0 C-40 -10 -26 -44 0 -40Z" fill="none" stroke="#5C7A8E" stroke-width="6"/><circle r="8" fill="#173349"/></g>`:'';
    hs.innerHTML=`<rect x="0" y="190" width="400" height="20" fill="#BFE0B5"/>${sh}
      <rect x="150" y="120" width="100" height="70" fill="#fff" stroke="#173349" stroke-width="3"/><path d="M140 122 L200 78 L260 122Z" fill="#E25A45" stroke="#173349" stroke-width="3"/>
      <rect x="188" y="150" width="24" height="40" fill="#F2AE2E"/><rect x="160" y="132" width="20" height="18" fill="#BFE4F3" stroke="#173349" stroke-width="2"/><rect x="220" y="132" width="20" height="18" fill="#BFE4F3" stroke="#173349" stroke-width="2"/>
      ${res==='bad'?`<path d="M222 132 L240 150 M240 132 L222 150" stroke="#E25A45" stroke-width="3"/><path d="M150 100 l-20 -18" stroke="#8A5A34" stroke-width="5"/>`:''}
      ${sw}<text x="200" y="30" text-anchor="middle" font-size="18" fill="#173349">防護罩 ${'🛡'.repeat(n)}${'·'.repeat(N-n)}</text>`;
  }
  for(let i=0;i<N;i++){
    if(!ctx.alive())return N*10;
    S.innerHTML='';S.append(el('div',{class:'tag'},'任務 '+(i+1)+' / '+N+'　答對一題，就幫家加一層防護罩'));
    drawHouse(shield);S.append(hs);
    const qa=el('div');S.append(qa);
    const ok=await ask(qa,QS[i]);
    if(ok){ctx.add(10);shield++}
    ctx.prog(i+1,N);
  }
  S.innerHTML='';S.append(el('div',{class:'tag'},'颱風來了！'));S.append(hs);
  const good=shield>=5;
  await tween(2600,p=>drawHouse(shield,p,p>.55?(good?null:'bad'):null));
  S.append(el('div',{class:'fb '+(good?'ok':'bad')},good?'防護罩夠強，家園平安度過颱風！':'防護罩不夠，窗戶和樹被吹壞了。再挑戰一次吧！'));
  await waitBtn(S,'看成績 →');
  return N*10;
}

home();
if(REMOTE&&DB.current)pullMine().then(()=>{if(!CUR)home()});
})();
