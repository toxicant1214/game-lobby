<title>力量大冒險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：磁鐵紅藍兩色的冒險地圖，四個世界卡片；遊戲畫面上方實驗台、下方題目卡 */
:root{
  --sky:#EDEFF8; --paper:#FFFFFF; --ink:#1B2140; --soft:#5D6788;
  --sea:#3557C9; --sea-l:#C9D3F2; --leaf:#2F9E5F; --sun:#F2AE2E; --coral:#D9443A;
  --line:#D5DBEE; --air:#F6F7FC;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font-family:var(--display);font-size:18px;cursor:pointer;border:0;border-radius:14px;padding:10px 18px;background:var(--sea);color:#fff;box-shadow:0 3px 0 #22398A;transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #22398A}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.ghost{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
button.warn{background:var(--coral);box-shadow:0 3px 0 #9E3727}
button:disabled{opacity:.45;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-size:28px;color:var(--sea)}
.chip{font-family:var(--display);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:16px}
.panel{background:var(--paper);border-radius:20px;padding:18px;border:2px solid var(--line)}
.hero{display:block}
.hero>*,.world>*,.stage>*,.gamehead>*{min-width:0}
.hero p{margin:4px 0 0;color:var(--soft)}
.namerow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.namerow input{flex:1 1 200px;width:100%;min-width:0;font-size:18px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);font-family:var(--body)}
.players{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.players button{font-size:15px;padding:4px 12px;box-shadow:none;background:var(--sky);color:var(--ink)}
.players button.on{background:var(--sun);color:var(--ink)}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.worlds{grid-template-columns:1fr}.namerow button{flex:1 1 100%}.logo h1{font-size:24px}.world{grid-template-columns:56px 1fr}.world .ico{width:56px;height:56px}.world .ico svg{width:44px;height:44px}}
.world{position:relative;text-align:left;background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.world .ico{width:72px;height:72px;border-radius:16px;display:grid;place-items:center}
.world h3{font-size:21px}
.world .sub{font-family:var(--body);font-size:14px;color:var(--soft);line-height:1.4}
.world .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:15px}
.stars{color:var(--sun);letter-spacing:2px}
.stars .off{color:var(--line)}
.world.locked{opacity:.55}
.world .lock{font-family:var(--body);font-size:14px;color:var(--coral)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.gamehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gamehead h2{font-size:24px;flex:1 1 auto}
.score{font-family:var(--display);font-size:20px;color:var(--sea);font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);width:0;transition:width .3s}
.stage{background:var(--paper);border-radius:20px;border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.stage svg{width:100%;height:auto;max-height:360px;display:block}
.tag{font-family:var(--display);color:var(--soft);font-size:15px}
.q{font-family:var(--display);font-size:21px;line-height:1.5}
.opts{display:grid;gap:8px}
.opts button{background:var(--sky);color:var(--ink);box-shadow:0 3px 0 var(--line);text-align:left;font-size:18px}
.opts button.sel{background:var(--sun)}
.opts button.ok{background:var(--leaf);color:#fff;box-shadow:0 3px 0 #1E6B40}
.opts button.bad{background:var(--coral);color:#fff;box-shadow:0 3px 0 #9E3727}
.fb{border-radius:14px;padding:10px 14px;font-size:16px}
.fb.ok{background:#E3F5EA;color:#1E6B40}
.fb.bad{background:#FCE8E4;color:#9E3727}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sent{font-family:var(--display);font-size:22px;line-height:2.1}
.sent button{font-size:22px;padding:2px 8px;margin:2px;background:var(--sky);color:var(--ink);box-shadow:0 2px 0 var(--line);border-radius:10px}
.sent button.ok{background:var(--leaf);color:#fff}
.sent button.bad{background:var(--coral);color:#fff}
.sent button.hint{background:var(--sun)}
.meter{position:relative;height:22px;border-radius:99px;background:linear-gradient(90deg,#D7EEF8,#7CC6E6,#1C8DB7);border:2px solid var(--line);overflow:hidden;flex:1 1 200px}
.meter i{position:absolute;top:0;bottom:0;width:6px;background:var(--ink);border-radius:3px;left:0}
.big{font-size:22px;padding:14px 26px}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result .bigstars{font-size:56px;color:var(--sun);letter-spacing:6px}
.result .bigstars .off{color:var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-size:15px;padding:6px 12px;background:var(--sky);color:var(--ink);box-shadow:none}
.tabs button.on{background:var(--sea);color:#fff}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--display);font-weight:400;color:var(--soft)}
td.n{text-align:right;font-family:var(--display);font-size:19px}
tr.me td{background:#FFF5DD}
.card{border:3px dashed var(--sea);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--air)}
.card .code{font-family:var(--display);font-size:26px;letter-spacing:4px;color:var(--sea)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.small{font-size:14px;color:var(--soft)}
.foot{text-align:center;color:var(--soft);font-size:14px;padding-block:24px 8px}
</style>

<div class="wrap" id="app"></div>

<script>
(()=>{
/* ---------- 工具 ---------- */
const app=document.getElementById('app');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const NS='http://www.w3.org/2000/svg';
function svg(viewBox,inner){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',viewBox);s.innerHTML=inner;return s}
let actx=null;
function sfx(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);const t=actx.currentTime;o.type='triangle';if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.1)}else{o.frequency.setValueAtTime(220,t);o.frequency.setValueAtTime(160,t+.12)}g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}catch(e){}}
function tween(ms,fn){return new Promise(res=>{const t0=performance.now();const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function f(now){let p=reduce?1:Math.min(1,(now-t0)/ms);fn(p);if(p<1)requestAnimationFrame(f);else res()}requestAnimationFrame(f)})}
const ease=p=>1-Math.pow(1-p,3);

/* ---------- 紀錄（存在這台裝置） ---------- */
const KEY='force_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{players:{},current:''}}catch(e){return{players:{},current:''}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
let DB=load();
function player(){const n=DB.current;if(!n)return null;if(!DB.players[n])DB.players[n]={best:[0,0,0,0],stars:[0,0,0,0],plays:0};const p=DB.players[n];if(!p.time)p.time=[0,0,0,0];return p}
/* 名次規則：分數高的在前；同分時，秒數少的在前 */
function better(s,t,os,ot){return s>os||(s===os&&s>0&&t>0&&(!ot||t<ot))}
function fmt(sec){if(!sec)return '—';sec=Math.round(sec);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function cmpRow(a,b){return b.v-a.v||((a.t||1e9)-(b.t||1e9))}

/* ====== Supabase 設定（和水生植物、第 1 單元同一個專案，資料存在 force_scores 表） ====== */
const SUPABASE_URL="https://wbxpqyrkgdaqvtsmijoe.supabase.co";
const SUPABASE_KEY="sb_publishable_04ZnsTSBxbREalRf2NWfeA_L1rzM9V4"; /* anon / publishable key，可以公開 */
const WKEY=['w1','w2','w3','w4'];
const REMOTE=/*CLOUD_ON*/true;
function sb(path,body){return fetch(SUPABASE_URL+path,{method:body?'POST':'GET',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text().then(t=>t?JSON.parse(t):null)})}
function pid(name){const s=name+'|';let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}return 'p'+(h>>>0).toString(36)}
/* 換裝置時，從資料庫把自己的進度接回來 */
async function pullMine(){if(!REMOTE||!DB.current)return;try{
  const rows=await sb('/rest/v1/force_scores?player_id=eq.'+pid(DB.current)+'&world=in.(w1,w2,w3,w4)&select=world,score,secs,stars')||[];
  const p=player();rows.forEach(r=>{const i=WKEY.indexOf(r.world);if(i<0)return;
    if(better(r.score,r.secs,p.best[i],p.time[i])){p.best[i]=r.score;p.time[i]=r.secs}p.stars[i]=Math.max(p.stars[i],r.stars)});save()}catch(e){}}
/* 送出這一關和總分，回傳這一關的名次 */
async function pushScore(i,secs,stars){const p=player();const id=pid(DB.current);
  const rank=await sb('/rest/v1/rpc/submit_force',{p_world:WKEY[i],p_id:id,p_name:DB.current,p_score:p.best[i],p_secs:p.time[i]||secs,p_stars:p.stars[i]});
  const tot=p.best.reduce((a,b)=>a+b,0),ts=p.time.reduce((a,b,k)=>a+(p.best[k]>0?(b||0):0),0)||secs;
  await sb('/rest/v1/rpc/submit_force',{p_world:'total',p_id:id,p_name:DB.current,p_score:tot,p_secs:ts,p_stars:p.stars.reduce((a,b)=>a+b,0)});
  return rank}
async function cloudBoard(world){const rows=await sb('/rest/v1/force_scores?world=eq.'+world+'&select=name,score,secs&order=score.desc,secs.asc&limit=30')||[];
  return rows.map(r=>({n:r.name,v:r.score,t:r.secs}))}
function starsFor(s,m){const r=s/m;return r>=.9?3:r>=.7?2:r>=.4?1:0}
function starStr(n){return '<span class="stars">'+'★'.repeat(n)+'<span class="off">'+'★'.repeat(3-n)+'</span></span>'}

/* ---------- 世界設定 ---------- */
const WORLDS=[
 {name:'力的現象',sub:'調方向、控力道把球踢進門，再捏捏看哪些東西會變回原狀',color:'#FDE7B8',ico:'<circle cx="22" cy="42" r="12" fill="#fff" stroke="#1B2140" stroke-width="3"/><path d="M34 34 L50 18" stroke="#F2AE2E" stroke-width="5" stroke-linecap="round"/><path d="M56 12 l-13 3 l9 9z" fill="#F2AE2E"/>',run:forceWorld},
 {name:'磁鐵實驗室',sub:'拖著磁鐵清掃桌面、比比看哪裡磁力最強、把磁鐵火車接起來',color:'#F6D3CF',ico:'<path d="M16 22 V36 a16 16 0 0 0 32 0 V22 H38 V36 a6 6 0 0 1 -12 0 V22Z" fill="#8A93A8"/><rect x="16" y="8" width="10" height="14" fill="#3557C9"/><rect x="38" y="8" width="10" height="14" fill="#D9443A"/>',run:magnetWorld},
 {name:'浮力工廠',sub:'把黏土捏成船讓它浮起來，再挑戰限時快答：這是哪一種力',color:'#CFE6F5',ico:'<rect x="6" y="34" width="52" height="24" rx="4" fill="#7CC6E6"/><path d="M12 28 L52 28 L44 42 L20 42Z" fill="#C8673C"/>',run:floatWorld},
 {name:'磁浮列車任務',sub:'排好 N 極、S 極，讓磁浮列車浮起來、往前衝',color:'#DCDDF5',ico:'<rect x="8" y="18" width="48" height="20" rx="10" fill="#fff" stroke="#1B2140" stroke-width="3"/><rect x="6" y="50" width="52" height="6" fill="#1B2140"/><path d="M20 41 v6 M32 41 v6 M44 41 v6" stroke="#D9443A" stroke-width="3"/>',run:maglevWorld}
];

/* ---------- 畫面：首頁 ---------- */
function header(){
  const p=DB.current;
  return el('div',{class:'top'},
    el('div',{class:'logo'},el('span',{html:'<svg width="40" height="40" viewBox="0 0 40 40"><path d="M6 14 V24 a14 14 0 0 0 28 0 V14 H25 V24 a5 5 0 0 1 -10 0 V14Z" fill="#8A93A8"/><rect x="6" y="4" width="9" height="10" fill="#3557C9"/><rect x="25" y="4" width="9" height="10" fill="#D9443A"/></svg>'}),el('h1',{},'力量大冒險')),
    p?el('span',{class:'chip'},'玩家：'+p):null);
}
function home(){
  const bzN=(function(){try{return localStorage.getItem('bz_name')||''}catch(e){return ''}})();
  if(bzN&&DB.current!==bzN){DB.current=bzN;player();save();if(REMOTE)pullMine().then(home);}
  app.innerHTML='';
  app.append(header());
  const pl=player();
  const input=el('input',{id:'nm',placeholder:'輸入你的名字',maxlength:'12',value:DB.current||''});if(bzN)input.readOnly=true;
  const names=Object.keys(DB.players);
  app.append(el('div',{class:'panel hero'},
    el('div',{},el('h2',{style:'font-size:22px'},'三上自然 第 2 單元：生活中的力'),
      el('p',{},'四個世界，答對拿分數和星星，每關都會計時。分數一樣時，比誰的時間短。'),
      el('div',{class:'namerow'},input,el('button',{onclick:()=>{const v=input.value.trim();if(!v){input.classList.add('shake');setTimeout(()=>input.classList.remove('shake'),400);input.focus();return}DB.current=v;player();save();home();if(REMOTE)pullMine().then(home)}},'就是我')),
      (names.length&&!bzN)?el('div',{class:'players'},el('span',{class:'small'},'這台裝置玩過的人：'),names.map(n=>el('button',{class:n===DB.current?'on':'',onclick:()=>{DB.current=n;save();home()}},n))):null
    )));
  const grid=el('div',{class:'worlds'});
  WORLDS.forEach((w,i)=>{
    const unlocked=i===0||(pl&&pl.stars[i-1]>=1);
    const b=el('button',{class:'world'+(unlocked?'':' locked'),onclick:()=>{if(!pl){input.focus();input.classList.add('shake');setTimeout(()=>input.classList.remove('shake'),400);return}if(unlocked)play(i)}},
      el('div',{class:'ico',style:'background:'+w.color,html:'<svg width="56" height="56" viewBox="0 0 64 64">'+w.ico+'</svg>'}),
      el('div',{},el('h3',{},'世界 '+(i+1)+'　'+w.name),el('div',{class:'sub'},w.sub),
        el('div',{class:'meta',html:starStr(pl?pl.stars[i]:0)+(unlocked?'<span>最高 '+(pl?pl.best[i]:0)+' 分'+(pl&&pl.time[i]?'・'+fmt(pl.time[i]):'')+'</span>':'<span class="lock">🔒 上一關拿到 1 顆星就打開</span>')})));
    if(!unlocked)b.setAttribute('aria-disabled','true');
    grid.append(b);
  });
  app.append(grid);
  app.append(el('div',{class:'row'},el('button',{class:'ghost',onclick:()=>board(0)},'排行榜'),pl?el('button',{class:'ghost',onclick:card},'我的成績卡'):null));
}

/* ---------- 排行榜 ---------- */
async function board(tab=0){
  if(typeof tab!=='number')tab=0;
  app.innerHTML='';app.append(header());
  const tabs=['總分',...WORLDS.map(w=>w.name)];
  let rows=[],failed=false;
  if(REMOTE){app.append(el('div',{class:'panel'},'正在讀取排行榜…'));
    try{rows=await cloudBoard(tab===0?'total':WKEY[tab-1])}catch(e){failed=true}
    app.innerHTML='';app.append(header());}
  else rows=Object.entries(DB.players).map(([n,p])=>{const tm=p.time||[0,0,0,0];return tab===0
      ?{n,v:p.best.reduce((a,b)=>a+b,0),t:tm.reduce((a,b,i)=>a+(p.best[i]>0?(b||0):0),0)}
      :{n,v:p.best[tab-1],t:tm[tab-1]}}).filter(r=>r.v>0).sort(cmpRow);
  const tbl=el('table',{},el('tr',{},el('th',{},'名次'),el('th',{},'名字'),el('th',{style:'text-align:right'},'時間'),el('th',{style:'text-align:right'},'分數')));
  rows.forEach((r,i)=>tbl.append(el('tr',{class:r.n===DB.current?'me':''},el('td',{},i<3?['🥇','🥈','🥉'][i]:String(i+1)),el('td',{},r.n),el('td',{style:'text-align:right'},fmt(r.t)),el('td',{class:'n'},String(r.v)))));
  let armed=false;
  const clr=el('button',{class:'ghost',onclick:()=>{if(!armed){armed=true;clr.textContent='再按一次確定清除';clr.className='warn';return}DB={players:{},current:''};save();home()}},'清除這台裝置的紀錄');
  app.append(el('div',{class:'panel',style:'display:flex;flex-direction:column;gap:12px'},
    el('h2',{style:'font-size:24px'},REMOTE?'全校排行榜（前 30 名）':'排行榜（這台裝置）'),
    el('div',{class:'tabs'},tabs.map((t,i)=>el('button',{class:i===tab?'on':'',onclick:()=>board(i)},t))),

/* 題目卡：單選 / 複選，回傳是否答對 */
function ask(parent,{q,opts,ans,explain,multi=false,tag,onAnswer}){
  return new Promise(res=>{
    const box=el('div',{style:'display:flex;flex-direction:column;gap:10px'});
    if(tag)box.append(el('div',{class:'tag'},tag));
    box.append(el('div',{class:'q'},q));
    const order=multi?shuffle(opts.map((_,i)=>i)):opts.map((_,i)=>i);
    const wrap=el('div',{class:'opts'});const sel=new Set();let done=false;
    const btns={};
    const good=multi?new Set(ans):new Set([ans]);
    function judge(){
      done=true;
      const ok=multi?(sel.size===good.size&&[...sel].every(x=>good.has(x))):sel.has(ans);
      Object.entries(btns).forEach(([k,b])=>{k=+k;b.disabled=true;b.style.opacity=1;b.classList.remove('sel');if(good.has(k))b.classList.add('ok');else if(sel.has(k))b.classList.add('bad')});
      sfx(ok);if(onAnswer)onAnswer(ok);
      box.append(el('div',{class:'fb '+(ok?'ok':'bad')},(ok?'答對了！':'差一點！')+(explain?' '+explain:'')));
      const nx=el('button',{onclick:()=>{box.remove();res(ok)}},'下一步 →');
      if(okBtn)okBtn.remove();
      box.append(el('div',{class:'ctrl'},nx));nx.focus({preventScroll:true});
    }
    order.forEach(i=>{const b=el('button',{onclick:()=>{if(done)return;if(multi){sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel')}else{sel.add(i);judge()}}},(multi?'□ ':'')+opts[i]);btns[i]=b;wrap.append(b)});
    box.append(wrap);
    let okBtn=null;
    if(multi){box.insertBefore(el('div',{class:'small'},'可以選很多個，選好按「確定」'),wrap);okBtn=el('button',{onclick:()=>{if(!sel.size)return;judge()}},'確定');box.append(okBtn)}
    parent.append(box);
    box.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}
function waitBtn(parent,label,cls=''){return new Promise(r=>{const b=el('button',{class:'big '+cls,onclick:()=>{b.remove();r()}},label);parent.append(b)})}

/* ---------- 共用：按住蓄力、SVG 座標 ---------- */
function chargeOnce(btn,meter,onTick){
  return new Promise(res=>{
    let v=0,dir=1,on=false,raf;const nd=meter.firstChild;btn.disabled=false;
    const tick=()=>{if(on){v+=dir*.012;if(v>=1){v=1;dir=-1}if(v<=0){v=0;dir=1}nd.style.left='calc('+(v*100)+'% - 3px)';onTick&&onTick(v);raf=requestAnimationFrame(tick)}};
    const down=e=>{e.preventDefault();if(on)return;on=true;v=0;dir=1;raf=requestAnimationFrame(tick)};
    const up=()=>{if(!on)return;on=false;cancelAnimationFrame(raf);cleanup();btn.disabled=true;res(v)};
    const kd=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)down(e)};
    function cleanup(){btn.removeEventListener('pointerdown',down);btn.removeEventListener('pointerup',up);btn.removeEventListener('pointerleave',up);btn.removeEventListener('keydown',kd);btn.removeEventListener('keyup',up)}
    btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointerleave',up);btn.addEventListener('keydown',kd);btn.addEventListener('keyup',up);
  });
}
function svgPt(s,e){const p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(s.getScreenCTM().inverse())}

      let h='<rect x="0" y="170" width="400" height="30" fill="#D5DBEE"/>';
      if(L.mode==='lift'){
        L.track.forEach((p,i)=>{const x=110+i*90;h+=`<rect x="${x-30}" y="150" width="60" height="20" fill="${col(p)}"/><text x="${x}" y="165" text-anchor="middle" fill="#fff" font-size="15">${p}</text>`});
        h+=`<g transform="translate(${dx} ${-lift}) rotate(${tilt} 200 120)"><rect x="60" y="80" width="280" height="44" rx="20" fill="#fff" stroke="#1B2140" stroke-width="3"/><rect x="82" y="90" width="60" height="16" rx="4" fill="#BFE4F3"/><rect x="160" y="90" width="60" height="16" rx="4" fill="#BFE4F3"/><rect x="238" y="90" width="60" height="16" rx="4" fill="#BFE4F3"/>`;
        set.forEach((p,i)=>{const x=110+i*90;h+=`<rect x="${x-30}" y="124" width="60" height="20" fill="${col(p)}"/><text x="${x}" y="139" text-anchor="middle" fill="#fff" font-size="15">${p}</text>`});
        h+='</g>';
      }else{
        h+=`<rect x="20" y="150" width="360" height="12" fill="#A3ABBC"/>`;
        h+=`<rect x="30" y="96" width="34" height="40" fill="${col(set[1])}"/><text x="47" y="122" text-anchor="middle" fill="#fff" font-size="15">${set[1]}</text><text x="47" y="88" text-anchor="middle" font-size="12" fill="#5D6788">後方</text>`;
        h+=`<rect x="336" y="96" width="34" height="40" fill="${col(set[0])}"/><text x="353" y="122" text-anchor="middle" fill="#fff" font-size="15">${set[0]}</text><text x="353" y="88" text-anchor="middle" font-size="12" fill="#5D6788">前方</text>`;
        h+=`<g transform="translate(${dx} 0)"><rect x="110" y="96" width="180" height="44" rx="20" fill="#fff" stroke="#1B2140" stroke-width="3"/><rect x="110" y="104" width="16" height="28" fill="#D9443A"/><rect x="274" y="104" width="16" height="28" fill="#D9443A"/><text x="118" y="123" text-anchor="middle" fill="#fff" font-size="12">N</text><text x="282" y="123" text-anchor="middle" fill="#fff" font-size="12">N</text><text x="200" y="124" text-anchor="middle" font-size="14" fill="#1B2140">→ 前進方向</text></g>`;
      }
      s.innerHTML=h;
    };
    draw();
    const sel=el('div',{class:'ctrl'});
    const labels=L.mode==='lift'?['左','中','右'].map(x=>'列車底部・'+x):['前方軌道','後方軌道'];
    const btns=labels.map((lab,i)=>el('button',{style:'background:'+col(set[i]),onclick:()=>{set[i]=set[i]==='N'?'S':'N';btns[i].textContent=lab+'：'+set[i];btns[i].style.background=col(set[i]);draw()}},lab+'：'+set[i]));
    sel.append(...btns);S.append(sel);
    const info=el('div',{class:'small'},'點按鈕切換 N / S，設定好按「通電出發」。');const tries=el('span',{class:'tag'},'剩 3 次機會');
    const go=el('button',{class:'big'},'⚡ 通電出發');S.append(el('div',{class:'ctrl'},go,tries),info);
    let left=3,got=0;
    while(left>0&&ctx.alive()){
      await new Promise(r=>{go.onclick=r});go.disabled=true;btns.forEach(b=>b.disabled=true);left--;
      let ok=false;
      if(L.mode==='lift'){
        const rep=set.map((p,i)=>p===L.track[i]);
        if(rep.every(Boolean)){ok=true;await tween(700,q=>draw(26*ease(q)));await tween(900,q=>draw(26,0,160*q));info.textContent='同極相斥，列車浮起來往前衝！'}
        else if(rep.every(x=>!x)){await tween(400,q=>draw(-6*ease(q)));info.textContent='異極相吸，列車被軌道吸住了！'}
        else{const t=rep[0]?-6:6;await tween(500,q=>draw(10*ease(q),t*ease(q)));info.textContent='有的地方推、有的地方吸，列車歪掉了！再檢查每一塊。'}
      }else{
        ok=set[0]==='S'&&set[1]==='N';
        if(ok){await tween(1200,q=>draw(0,0,120*ease(q)));info.textContent='前方 S 極把車頭 N 極吸過去，後方 N 極把車尾推出去，列車前進了！'}
        else{await tween(300,q=>draw(0,0,Math.sin(q*12)*4));info.textContent=(set[0]==='N'?'前方是 N 極，會把車頭推回來。':'')+(set[1]==='S'?'後方是 S 極，會把車尾吸回去。':'')}
      }
      if(ok){got=[20,10,5][2-left];ctx.add(got);sfx(true);info.textContent+=' 得到 '+got+' 分。';break}
      sfx(false);tries.textContent='剩 '+left+' 次機會';
      if(left>0){await sleep(800);draw();go.disabled=false;btns.forEach(b=>b.disabled=false)}
    }
    if(!ctx.alive())return max;
    pg();if(!got)info.textContent+=' 這關沒成功，繼續下一關！';
    await waitBtn(S,'下一關 →');
  }
  /* ---- 閱讀素養 ---- */
  S.innerHTML='';
  S.append(el('div',{class:'tag'},'閱讀任務　讀完再回答'),el('div',{class:'panel',style:'background:var(--air);line-height:1.9'},
    '磁浮列車是利用磁鐵「同極相斥、異極相吸」的特性來設計的交通工具。一般的火車，車輪會接觸軌道，產生摩擦力；磁浮列車卻是浮在軌道上方，前進時不碰到地面，主要只受到空氣阻力，所以可以跑得非常快，理論上時速可以超過 600 公里。不過，磁浮列車的造價十分昂貴，所以目前還沒有在世界各地普遍使用。'));
  const qa=el('div');S.append(qa);
  await Q(qa,{q:'磁浮列車是利用磁鐵的哪一種特性設計的？',opts:['同極相斥、異極相吸','同極相吸、異極相斥','磁鐵會吸引銅製品'],ans:0});
  await Q(qa,{q:'磁浮列車浮在軌道上，所以不太會受到哪一種力的影響？',opts:['摩擦力','空氣阻力','磁力'],ans:0,explain:'兩個物體互相接觸時會產生摩擦力，磁浮列車沒有碰到地面。'});
  await Q(qa,{q:'根據文章，下面哪一句是正確的？',opts:['磁浮列車目前還沒有在世界各地普遍使用','磁浮列車造價很便宜','磁浮列車跑得很慢'],ans:0});
  await Q(qa,{q:'理論上，磁浮列車的時速可以達到多少？',opts:['600 公里以上','60 公里','6 公里'],ans:0});
  return max;
}

home();
if(REMOTE&&DB.current)pullMine().then(()=>{if(!CUR)home()});
})();
