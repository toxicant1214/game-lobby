  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#fff9 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 34%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 33% 62%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 55% 86%,#fff6 50%,transparent 51%),radial-gradient(ellipse at 50% -10%,#24306A,var(--night) 60%);background-attachment:fixed}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
b{color:var(--gold);font-weight:700}
button{font-family:var(--display);font-size:18px;cursor:pointer;border:0;border-radius:14px;padding:10px 18px;background:var(--gold);color:#1E1A0C;box-shadow:0 3px 0 var(--gold-d);transition:transform .08s;min-height:48px}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-d)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
button.ghost{background:var(--panel);color:var(--ink);box-shadow:0 3px 0 #0B0F26;border:2px solid var(--line)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}

.namerow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.namerow input{flex:1 1 200px;width:100%;min-width:0;font-size:18px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--night);color:var(--ink);font-family:var(--body)}

.world h3{font-size:21px}
.world .sub{font-family:var(--body);font-size:14px;color:var(--soft);line-height:1.4}

.score{font-family:var(--display);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}

.stage{background:var(--panel);border-radius:20px;border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}

.opts button.ok,.mover.ok,.bin.ok{background:var(--leaf)!important;color:#fff;box-shadow:0 3px 0 #227552;opacity:1}

.pairtag{display:block;font-size:13px;color:var(--moon);font-family:var(--display)}
/* 魔王 */
.hp{height:16px;border-radius:99px;background:#3A2340;overflow:hidden;border:2px solid #7A4A86}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#F07A6A,#C94E8A);transition:width .3s}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

.tabs{display:flex;gap:6px;flex-wrap:wrap}

table.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lb td,.lb th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.lb th{font-family:var(--display);font-weight:400;color:var(--soft)}
.lb td.n{text-align:right;font-family:var(--display);font-size:19px}

.card{border:3px dashed var(--gold);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.card .code{font-family:var(--display);font-size:26px;letter-spacing:4px;color:var(--gold)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
input[type=range]{accent-color:var(--gold);width:100%;height:36px}

function waitBtn(parent,label){return new Promise(r=>{const b=el('button',{class:'big'},label);b.onclick=()=>{b.remove();r()};parent.append(b);b.focus({preventScroll:true})})}
const ptsFor=(pts,wrong)=>[pts,Math.round(pts*.6),Math.round(pts*.3)][wrong]||0;
const lab=o=>o.label||String(o.html||o).replace(/<[^>]+>/g,'');

/* 答錯不給答案：第 1、2 次錯給提示並可重答（得分遞減），第 3 次才揭曉 */
function tiered(fb,{hints=[],explain=''}){
  let wrong=0;
  return{
    get wrong(){return wrong},
    bad(why){wrong++;sfx(false);fb.hidden=false;fb.className='fb bad';
      if(wrong>=3)return true;
      fb.innerHTML=(why?why+'<br>':'')+'💡 提示：'+(hints[Math.min(wrong-1,hints.length-1)]||'再想一想！')+' 再試一次！';return false},
    good(){sfx(true);fb.hidden=false;fb.className='fb ok';fb.innerHTML='答對了！'+(explain?' '+explain:'')},
    reveal(ans){fb.className='fb bad';fb.innerHTML='答案是「'+ans+'」。'+(explain?' '+explain:'')}
  }
}
/* 一般選擇題 */
function pick(parent,{q,tag,opts,ans=0,hints,explain,pts=10,img=false}){
  return new Promise(res=>{
    const box=el('div',{class:'qbox'});if(tag)box.append(el('div',{class:'tag'},tag));if(q)box.append(el('div',{class:'q',html:q}));
    const wrap=el('div',{class:'opts'+(img?' imgs':'')});const fb=el('div',{class:'fb',hidden:''});
    const T=tiered(fb,{hints,explain});const btns=[];let done=false;
    const end=got=>{done=true;btns.forEach(b=>b.disabled=true);btns[ans].classList.add('ok');btns[ans].disabled=false;
      const nx=el('button',{},'下一步 →');nx.onclick=()=>{box.remove();res(got)};box.append(el('div',{class:'ctrl'},nx));nx.focus({preventScroll:true})};
    shuffle(opts.map((_,i)=>i)).forEach(i=>{const o=opts[i];
      const b=el('button',{html:o.html||o},);b.onclick=()=>{if(done||b.disabled)return;
        if(i===ans){b.classList.add('ok');T.good();end(ptsFor(pts,T.wrong))}
        else{b.classList.add('bad');b.disabled=true;if(T.bad(o.why)){T.reveal(lab(opts[ans]));end(0)}}};
      btns[i]=b;wrap.append(b)});
    box.append(wrap,fb);parent.append(box);
  });
}
/* 會飛來飛去的選項（流星、泡泡） */
function chase(parent,ctx,{q,qhtml,opts,ans=0,hints,explain,pts=10,kind='meteor'}){
  return new Promise(res=>{
    const box=el('div',{class:'qbox'});
    if(qhtml)box.append(el('div',{class:'bigmoon',html:qhtml}));
    box.append(el('div',{class:'q',html:q}));
    const sky=el('div',{class:'sky '+kind});const fb=el('div',{class:'fb',hidden:''});
    box.append(sky,fb);parent.append(box);
    const T=tiered(fb,{hints,explain});let done=false;const S=88;
    const W=()=>Math.max(200,sky.clientWidth),H=260;
    const ms=shuffle(opts.map((_,i)=>i)).map((i,k,arr)=>{const o=opts[i];
      const b=el('button',{class:'mover',html:o.html||o});sky.append(b);
      const lane=(H-S)/(arr.length-1||1);
      const m={b,i,x:kind==='meteor'?k*(W()/arr.length)-S/2:Math.random()*(W()-S),y:kind==='meteor'?k*lane:Math.random()*(H-S),
        vx:kind==='meteor'?55+Math.random()*35:(Math.random()<.5?-1:1)*(35+Math.random()*30),vy:kind==='meteor'?0:(Math.random()<.5?-1:1)*(30+Math.random()*25),dead:false};
      if(REDUCE){m.x=(k%2)*(W()/2)+20;m.y=(k>>1)*(H/2)+20}
      b.onclick=()=>{if(done||m.dead)return;
        if(i===ans){b.classList.add('ok');T.good();finish(ptsFor(pts,T.wrong))}
        else{b.classList.add('bad');m.dead=true;if(T.bad(o.why)){T.reveal(lab(opts[ans]));ms.find(z=>z.i===ans).b.classList.add('ok');finish(0)}}};
      return m});
    let last=performance.now();
    const place=m=>{m.b.style.transform=`translate(${m.x}px,${m.y}px)`};ms.forEach(place);
    function loop(now){if(done||!ctx.alive())return;const dt=Math.min(.05,(now-last)/1000);last=now;const w=W();
      ms.forEach(m=>{if(m.dead)return;m.x+=m.vx*dt;m.y+=m.vy*dt;
        if(kind==='meteor'){if(m.x>w+20){m.x=-S-20;}}
        else{if(m.x<0){m.x=0;m.vx*=-1}if(m.x>w-S){m.x=w-S;m.vx*=-1}if(m.y<0){m.y=0;m.vy*=-1}if(m.y>H-S){m.y=H-S;m.vy*=-1}}
        place(m)});requestAnimationFrame(loop)}
    if(!REDUCE)requestAnimationFrame(loop);
    function finish(got){done=true;const nx=el('button',{},'下一步 →');nx.onclick=()=>{box.remove();res(got)};box.append(el('div',{class:'ctrl'},nx));nx.focus({preventScroll:true})}
  });
}

      h+=p===m?`<circle cx="${x}" cy="${y}" r="21" fill="#2B3566" stroke="#F2C14E" stroke-width="2"/><text x="${x}" y="${y+8}" text-anchor="middle" font-size="22" fill="#F2C14E">?</text>`:`<g transform="translate(${x-21} ${y-21}) scale(.42)">${moonInner(p.rep)}</g>`;
      h+=`<text x="${x}" y="${y+36}" text-anchor="middle" font-size="12" fill="#AEB6DA">${cn(p.rep)}</text>`});
    h+=`<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" fill="#AEB6DA">逆時針前進</text></svg>`;
    S.append(el('div',{html:h}));
    const others=shuffle(PH.filter(p=>p!==m)).slice(0,3);
    ctx.tick(await chase(S,ctx,{q:'問號那裡是農曆<b>'+cn(m.rep)+'</b>，應該是哪一個月亮？',kind:'bubble',ans:0,
      opts:[m,...others].map(p=>({html:moon(p.rep),label:p.full,why:p===m?'':'那是'+p.full+'，在農曆'+daysTxt(p)+'。'})),
      hints:[sideHint(m.rep),'看看問號兩邊的月亮，它應該介於兩者之間。'],explain:'農曆'+cn(m.rep)+'是'+m.full+'：'+m.shape+'。'}),10)}
  /* 反推日期 */
  for(let r=0;r<2;r++){if(!ctx.alive())return;S.innerHTML='';tagLine(S,'反推日期　先點月亮，再點它的農曆日期');
    let set;do{set=shuffle(PH).slice(0,4)}while(set.some((p,i)=>set.some((q,j)=>i<j&&ring(p.rep,q.rep)<4)));
    const tray=el('div',{class:'tray'}),chips=el('div',{class:'chips'}),fb=el('div',{class:'fb',hidden:''});let sel=null,mis=0,done=0;
    S.append(tray,chips,fb);
    const got=await new Promise(res=>{
      const mb=shuffle(set).map(p=>{const b=el('button',{html:moon(p.rep)});b.onclick=()=>{if(b.disabled)return;mb.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel={p,b}};tray.append(b);return b});
      shuffle(set).forEach(p=>{const c=el('button',{},'農曆'+cn(p.rep));chips.append(c);
        c.onclick=()=>{if(!sel){fb.hidden=false;fb.className='fb bad';fb.textContent='先點一個月亮喔！';return}
          if(sel.p===p){sfx(true);sel.b.disabled=true;sel.b.classList.remove('sel');sel.b.style.opacity=1;sel.b.style.background='var(--leaf)';c.disabled=true;c.style.background='var(--leaf)';c.style.color='#fff';fb.hidden=false;fb.className='fb ok';fb.textContent='✔ 農曆'+cn(p.rep)+'：'+p.full;sel=null;
            if(++done===4){const st=set.slice().sort((a,b)=>a.rep-b.rep);S.append(el('div',{class:'train'},st.map(q=>el('div',{class:'car',html:moon(q.rep)+'<span>'+cn(q.rep)+'</span>'}))),el('div',{class:'small'},'照日期排好，月亮就是這樣變化的。'));waitBtn(S,'下一步 →').then(()=>res(Math.max(0,10-3*mis)))}}
          else{mis++;sfx(false);shake(c);fb.hidden=false;fb.className='fb bad';const q=sel.p;
            fb.textContent='農曆'+cn(p.rep)+'不是這個月亮。💡 '+(q.rep===1?'看不到月亮是一個月的開始。':q.rep<15?'這個月亮亮在右邊，是十五以前。':q.rep<=16?'圓圓的月亮在一個月的正中間。':'這個月亮亮在左邊，是十五以後。')}}})});
    ctx.tick(got,10)}
}

/* ================= 魔王關 ================= */
function bossQ(){
  const g=rnd(['day','img','fest','cal','stmt','fist']);
  if(g==='day'){const ph=rnd(PH),d=rnd(ph.days);const o=shuffle(PH.filter(p=>p!==ph)).slice(0,3);return{q:'農曆'+cn(d)+'的月亮是？',img:true,opts:[ph,...o].map(p=>({html:moon(p===ph?d:p.rep),label:p.full})),why:'農曆'+cn(d)+'是'+ph.full+'。'}}
  if(g==='img'){const ph=rnd(PH);const o=shuffle(PH.filter(p=>p!==ph)).slice(0,3);return{q:'<div class="bigmoon">'+moon(ph.rep)+'</div>這是什麼月相？',opts:[ph,...o].map(p=>p.full),why:'這是'+ph.full+'。'}}
  if(g==='fest'){const F=rnd(FEST.filter(f=>!f.d||[1,7,8,15,16,30].includes(f.d)));const nm=F.d?(F.d===1||F.d===30?'朔（看不到月亮）':F.d<=8?'上弦月':'滿月（望）'):'沒有固定月相';
    const pool=['朔（看不到月亮）','上弦月','滿月（望）','下弦月','沒有固定月相'].filter(x=>x!==nm);return{q:F.n+'的晚上，月亮是？',opts:[nm,...shuffle(pool).slice(0,3)],why:F.n+'是'+F.date+'。'}}
  if(g==='cal'){const F=rnd(FEST);return{q:F.n+'是哪一種節慶？',opts:F.d?['農曆','國曆']:['國曆','農曆'],why:F.n+'是'+F.date+'。'}}
  if(g==='stmt'){const s=rnd(STMT);return{q:'哪一句是正確的？',opts:[s.ok,s.bad],why:s.ok}}
  const n=rnd([2,3,4,5,6,7]);return{q:'疊了 '+n+' 個拳頭剛好遮住月亮，高度角大約是？',opts:[n*10+'°',n+'°',(n*10+30)+'°',n*5+'°'],why:'一個拳頭大約 10°。'};
}
async function w5(ctx){
  const S=ctx.stage;ctx.N=10;const HP=10,TL=90;let hp=HP;
  const hpb=el('i',{style:'width:100%'});const tEl=el('span',{class:'score'},'⏱ '+TL);
  const mon=el('div',{style:'display:flex;justify-content:center'});
  const drawMon=(mood)=>{const cover=hp/HP;mon.innerHTML=`<svg viewBox="0 0 240 150" style="width:100%;max-width:300px"><g transform="translate(120 20) scale(.9)">${moonInner(15)}</g><g transform="translate(0 ${(1-cover)*70}) " opacity="${.35+.65*cover}"><path d="M30 120 Q20 80 60 80 Q70 45 110 60 Q140 35 170 62 Q215 60 212 100 Q232 108 222 130 L40 132 Q22 132 30 120Z" fill="#8A7FB0"/><circle cx="95" cy="98" r="7" fill="#1B2350"/><circle cx="140" cy="98" r="7" fill="#1B2350"/>${mood==='hit'?'<path d="M100 118 q18 -10 36 0" stroke="#1B2350" stroke-width="4" fill="none"/>':'<path d="M100 112 q18 14 36 0" stroke="#1B2350" stroke-width="4" fill="none"/>'}</g></svg>`};
  drawMon();
  S.append(el('div',{class:'ctrl'},el('span',{class:'tag'},'雲霧怪的血量'),tEl),el('div',{class:'hp'},hpb),mon,el('div',{class:'small'},'答對一題打掉一格血（10 分）。'+TL+' 秒內打倒牠！答錯會顯示正確答案，不扣分。'));
  await waitBtn(S,'開戰！');
  const qa=el('div');S.append(qa);const t0=Date.now();let over=false;
  const tick=setInterval(()=>{const left=Math.max(0,TL-(Date.now()-t0)/1000);tEl.textContent='⏱ '+Math.ceil(left);if(left<=0||!ctx.alive()){over=true;clearInterval(tick)}},250);
  ctx.max=HP*10;
  while(hp>0&&!over&&ctx.alive()){
    const Q=bossQ();qa.innerHTML='';const box=el('div',{class:'qbox'},el('div',{class:'q',html:Q.q}));const wrap=el('div',{class:'opts'+(Q.img?' imgs':'')});const fb=el('div',{class:'fb',hidden:''});box.append(wrap,fb);qa.append(box);
    const ok=await new Promise(r=>{const order=shuffle(Q.opts.map((_,i)=>i));const bs=[];
      order.forEach(i=>{const o=Q.opts[i];const b=el('button',{html:o.html||o});bs[i]=b;wrap.append(b);
        b.onclick=()=>{bs.forEach(x=>x.disabled=true);if(i===0){b.classList.add('ok');r(true)}else{b.classList.add('bad');bs[0].classList.add('ok');bs[0].disabled=false;fb.hidden=false;fb.className='fb bad';fb.textContent='正確答案是「'+lab(Q.opts[0])+'」。'+Q.why;r(false)}}});
      const iv=setInterval(()=>{if(over||!ctx.alive()){clearInterval(iv);r(null)}},200)});
    if(ok===null)break;
    if(ok){hp--;ctx.add(10);ctx.step++;sfx(true);hpb.style.width=(hp/HP*100)+'%';drawMon('hit');await sleep(450)}
    else{sfx(false);drawMon();await sleep(1800)}
  }
  clearInterval(tick);if(!ctx.alive())return;
  qa.innerHTML='';qa.append(el('div',{class:'fb '+(hp<=0?'ok':'bad')},hp<=0?'雲霧怪被打跑了，月亮回來了！':'時間到！雲霧怪還剩 '+hp+' 格血，再挑戰一次！'));
  await waitBtn(S,'看成績 →');
}

home();
if(REMOTE&&DB.current)pullMine().then(()=>{if(!CUR)home()});
})();
