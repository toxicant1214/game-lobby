<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>遊戲書房 老師查看</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  --paper:#EEF0E8; --sheet:#F8F9F3; --ink:#24302B; --ink-soft:#5E6B63; --line:#C9D0C4;
  --moss:#4F6B4A; --rust:#A65A3A; --gold:#B8860B;
  --serif:"Noto Serif TC","Songti TC",serif; --hand:"LXGW WenKai TC","Kaiti TC",var(--serif);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--hand);font-size:16px;line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding-block:48px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
.back{color:var(--ink-soft);text-decoration:none;font-size:14px;letter-spacing:.06em}
h1{font-family:var(--serif);font-weight:900;font-size:34px;margin:0;letter-spacing:.06em}
h2{font-family:var(--serif);font-weight:700;font-size:22px;margin:0;letter-spacing:.06em}
.sub{color:var(--ink-soft);margin:0}
.card{background:var(--sheet);border:1px solid var(--line);padding:24px;display:grid;gap:14px;min-width:0}
label{font-family:var(--serif);font-weight:700;letter-spacing:.1em}
select,input{font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--ink);background:#fff;color:var(--ink);width:100%;min-height:46px}
button{font:inherit;font-size:16px;font-weight:700;letter-spacing:.1em;padding:10px 16px;min-height:46px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--sheet)}
button.ghost{background:transparent;color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--rust);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 200px}
.msg{margin:0;font-weight:700;min-height:1.4em}
.msg.ok{color:var(--moss)}.msg.err{color:var(--rust)}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-size:20px;margin-right:4px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--serif);font-size:13px;letter-spacing:.12em;color:var(--ink-soft);background:var(--sheet);position:sticky;top:0;cursor:pointer;user-select:none}
th.on{color:var(--ink)}
th.on::after{content:" ▾"}
td.num{text-align:right}
td.name{font-weight:700}
.trophy{color:var(--gold);font-weight:700}
.dim{color:#9AA39C}
.note{font-size:14px;color:var(--ink-soft);margin:0}
@media (max-width:640px){
  .tablewrap{overflow:visible;border:0;background:transparent}
  .tablewrap thead{display:none}
  .tablewrap table,.tablewrap tbody{display:block}
  .tablewrap tr{display:flex;flex-wrap:wrap;gap:2px 16px;background:#fff;border:1px solid var(--line);padding:12px;margin-bottom:10px}
  .tablewrap td{border:0;padding:0;white-space:nowrap;flex:0 0 auto}
  .tablewrap td.num{text-align:left}
  .tablewrap td[data-l]::before{content:attr(data-l) "　";color:var(--ink-soft);font-size:13px}
  .tablewrap td.name{flex:1 1 50%;font-size:18px;order:-2}
  .tablewrap td.clr{order:-1}
  .tablewrap td.t{flex:1 1 100%;white-space:normal}
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">← 回遊戲書房</a>
  <div>
    <h1>老師查看</h1>
    <p class="sub">看所有玩過的孩子：玩了幾次、過了幾關、有沒有全破。</p>
  </div>

  <form class="card" id="login">
    <label for="pass">老師密碼</label>
    <div class="row">
      <input id="pass" type="password" autocomplete="current-password" required>
      <button type="submit" id="loginBtn" style="flex:0 0 auto">進入</button>
    </div>
    <p class="msg" id="loginMsg" aria-live="polite"></p>
  </form>

  <section class="card" id="report" hidden>
    <div class="row">
      <div><label for="game">遊戲</label><select id="game"><option value="all">全部遊戲</option></select></div>
      <div><label for="q">找名字或代碼</label><input id="q" type="search" placeholder="例如：王小明"></div>
    </div>
    <div class="stats" id="stats"></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="tablewrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="row">
      <button type="button" class="ghost" id="reload" style="flex:0 0 auto">重新整理</button>
      <button type="button" class="ghost" id="csv" style="flex:0 0 auto">下載成 Excel 檔</button>
    </div>
    <p class="note">「玩了幾次」是每玩完一關算一次。「全破」是每一關都過關過。排行榜每兩個月清除時，這裡的紀錄也會一起清除（舊資料有備份）。</p>
  </section>
</div>
<script>
const SUPABASE_URL = "https://wbxpqyrkgdaqvtsmijoe.supabase.co";
const SUPABASE_KEY = "sb_publishable_04ZnsTSBxbREalRf2NWfeA_L1rzM9V4";
const $ = id => document.getElementById(id);
const say = (t, cls) => { $('msg').textContent = t; $('msg').className = 'msg ' + (cls || ''); };
let PASS = '', ROWS = [], SORT = 'name';

async function rpc(fn, args){
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method:'POST',
    headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(args) });
  const body = await r.json().catch(()=>null);
  if(!r.ok){ const e = new Error((body && body.message) || r.status); e.wrong = String(e.message).includes('wrong password'); throw e; }
  return body;
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => t ? new Date(t).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const allGames = () => $('game').value === 'all';

const COLS = [
  { k:'name',   t:'姓名',     cls:'name' },
  { k:'code',   t:'代碼',     l:'代碼' },
  { k:'title',  t:'遊戲',     l:'遊戲', all:true, cls:'t' },
  { k:'plays',  t:'玩了幾次', l:'玩了', num:true },
  { k:'passed', t:'過關',     l:'過關', num:true },
  { k:'clr',    t:'全破',     cls:'clr' },
  { k:'best',   t:'最高總分', l:'最高總分', num:true },
  { k:'last',   t:'最後玩',   l:'最後玩' }
];
const SORTERS = {
  name:  (a,b) => a.name.localeCompare(b.name,'zh-Hant') || a.title.localeCompare(b.title,'zh-Hant'),
  code:  (a,b) => a.code.localeCompare(b.code),
  title: (a,b) => a.title.localeCompare(b.title,'zh-Hant') || a.name.localeCompare(b.name,'zh-Hant'),
  plays: (a,b) => b.plays - a.plays,
  passed:(a,b) => b.passed_levels/b.levels - a.passed_levels/a.levels,
  clr:   (a,b) => (b.cleared?1:0) - (a.cleared?1:0),
  best:  (a,b) => b.total_best - a.total_best,
  last:  (a,b) => String(b.last_played).localeCompare(String(a.last_played))
};

function render(){
  const cols = COLS.filter(c => !c.all || allGames());
  $('head').innerHTML = cols.map(c => `<th data-k="${c.k}" class="${SORT===c.k?'on':''}">${c.t}</th>`).join('');
  const q = $('q').value.trim().toUpperCase();
  const rows = ROWS.filter(r => !q || r.name.toUpperCase().includes(q) || r.code.includes(q)).sort(SORTERS[SORT]);
  const kids = new Set(rows.map(r => r.code)).size;
  const cleared = new Set(rows.filter(r => r.cleared).map(r => r.code)).size;
  $('stats').innerHTML = `<span><b>${kids}</b>位孩子玩過</span><span><b>${rows.reduce((s,r)=>s+r.plays,0)}</b>次遊玩</span><span><b>${cleared}</b>位有全破</span>`;
  const cell = {
    name:  r => esc(r.name),
    code:  r => esc(r.code),
    title: r => esc(r.title),
    plays: r => r.plays + ' 次',
    passed:r => r.passed_levels + ' / ' + r.levels,
    clr:   r => r.cleared ? '<span class="trophy">🏆 全破</span>' : '<span class="dim">還沒</span>',
    best:  r => r.total_best,
    last:  r => fmt(r.last_played)
  };
  $('tbody').innerHTML = rows.length ? rows.map(r => '<tr>' + cols.map(c =>
      `<td class="${c.cls||''}${c.num?' num':''}"${c.l?` data-l="${c.l}"`:''}>${cell[c.k](r)}</td>`).join('') + '</tr>').join('')
    : `<tr><td colspan="${cols.length}">${q ? '找不到這個名字。' : '還沒有孩子玩過。'}</td></tr>`;
}

async function load(){
  say('讀取中…');
  try{
    ROWS = await rpc('teacher_report', { p_pass: PASS, p_game: $('game').value }) || [];
    say(''); render();
  }catch(err){ say(err.wrong ? '密碼不對，請重新整理頁面再登入。' : '讀取失敗：' + err.message, 'err'); }
}

async function login(pass){
  PASS = pass; $('loginBtn').disabled = true; $('loginMsg').textContent = '確認中…'; $('loginMsg').className = 'msg';
  try{
    ROWS = await rpc('teacher_report', { p_pass: PASS, p_game: 'all' }) || [];
    try{ sessionStorage.setItem('bz_tpass', PASS); }catch(e){}
    try{
      const r = await fetch(SUPABASE_URL + '/rest/v1/game_levels?select=game,title&order=title', { headers:{ apikey:SUPABASE_KEY } });
      (await r.json()).forEach(g => $('game').insertAdjacentHTML('beforeend', `<option value="${esc(g.game)}">${esc(g.title)}</option>`));
    }catch(e){}
    $('login').hidden = true; $('report').hidden = false; render();
  }catch(err){
    try{ sessionStorage.removeItem('bz_tpass'); }catch(e){}
    $('loginMsg').textContent = err.wrong ? '密碼不對，請再試一次。' : '讀取失敗：' + err.message; $('loginMsg').className = 'msg err';
  }
  $('loginBtn').disabled = false;
}

$('login').addEventListener('submit', e => { e.preventDefault(); login($('pass').value); });
$('game').addEventListener('change', load);
$('q').addEventListener('input', render);
$('reload').addEventListener('click', load);
$('head').addEventListener('click', e => { const th = e.target.closest('th'); if(th){ SORT = th.dataset.k; render(); } });
$('csv').addEventListener('click', () => {
  const head = ['姓名','代碼','遊戲','玩了幾次','過關','關卡數','全破','最高總分','最後玩'];
  const lines = ROWS.slice().sort(SORTERS[SORT]).map(r => [r.name, r.code, r.title, r.plays, r.passed_levels, r.levels,
    r.cleared ? '是' : '否', r.total_best, r.last_played ? new Date(r.last_played).toLocaleString('zh-TW') : '']);
  const csv = '﻿' + [head, ...lines].map(l => l.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = '遊戲書房學生紀錄.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* 從主任室點進來，或這個分頁已經登入過，就不用再輸入密碼 */
try{ const p = sessionStorage.getItem('bz_tpass'); if(p) login(p); }catch(e){}
</script>
</body>
</html>
